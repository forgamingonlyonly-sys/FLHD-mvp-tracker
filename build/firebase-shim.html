<script>
(function(){
  const cfg = window.FALSEHOOD_FIREBASE;
  if(!cfg || !window.firebase) return;            // no config: the tracker runs in this-device mode
  window.FALSEHOOD_HOST = 'firebase';
  firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const fs = firebase.firestore();

  // Short lease on a doc, used by the tracker to hand out item numbers one at a time
  firebase.firestore.DocumentReference.prototype.acquire = async function(opts){
    const lock = fs.collection('locks').doc(this.path.replace(/\//g, '_'));
    const holder = (opts && opts.holder) || String(Math.random());
    const ttl = (opts && opts.ttlMs) || 4000;
    const ok = await fs.runTransaction(async tx=>{
      const s = await tx.get(lock);
      const d = s.exists ? s.data() : null;
      if(d && d.until > Date.now() && d.holder !== holder) return false;
      tx.set(lock, { holder, until: Date.now() + ttl });
      return true;
    });
    if(ok) held.set(this.path, lock);
    return { acquired: ok };
  };
  // Saving the leased doc releases the lease, so the next person doesn't wait for it to expire
  const held = new Map();
  const origSet = firebase.firestore.DocumentReference.prototype.set;
  firebase.firestore.DocumentReference.prototype.set = async function(...args){
    const r = await origSet.apply(this, args);
    const lock = held.get(this.path);
    if(lock){ held.delete(this.path); lock.delete().catch(()=>{}); }
    return r;
  };

  let gateDone = null;
  let role = 'editor';
  // Editor password first, then the view-only one; the security rules decide which matches
  async function join(uid, pass, roles){
    for(const r of roles || ['editor', 'timer', 'viewer']){
      try { await fs.collection('members').doc(uid).set({ pass, role: r, joinedAt: Date.now() }); return r; }
      catch(x) { if(!(x && x.code === 'permission-denied')) throw x; }
    }
    return null;
  }
  // Access badge beside LIVE: shows Editor / View only, click for switch + log out
  function showRole(){
    const sync = document.getElementById('sync');
    if(!sync || document.getElementById('fbRole')) return;
    const b = document.createElement('button');
    b.id = 'fbRole'; b.type = 'button';
    b.className = 'fb-role ' + role;
    b.textContent = role === 'editor' ? '✎ FLHD' : role === 'timer' ? '⏱ Timers' : '👁 View only';
    b.title = 'Your access on this device. Click for options.';
    sync.after(b);
    const menu = document.createElement('div');
    menu.className = 'fb-menu'; menu.hidden = true;
    menu.innerHTML = `<div class="m-info">${role === 'editor'
        ? 'You have <b>FLHD access</b> on this device: you can log kills and manage storage.'
        : role === 'timer'
        ? 'You have <b>timer access</b> on this device: you can log MVP and MINI MVP kills. Storage is view only.'
        : 'You have <b>view-only access</b> on this device: you can see everything but can’t make changes.'}</div>
      ${role !== 'editor' ? '<button type="button" class="m-up">🔑 Enter another password</button>' : ''}
      <button type="button" class="m-out">⎋ Log out of this device</button>
      ${role === 'editor' ? '<button type="button" class="m-out m-all">⎋ Log out all devices</button>' : ''}`;
    document.body.appendChild(menu);
    b.onclick = e=>{
      e.stopPropagation();
      if(!menu.hidden){ menu.hidden = true; return; }
      const r = b.getBoundingClientRect();
      menu.hidden = false;
      menu.style.top = (r.bottom + 6) + 'px';
      menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + 'px';
    };
    document.addEventListener('click', e=>{ if(!menu.contains(e.target)) menu.hidden = true; });
    const all = menu.querySelector('.m-all');
    if(all) all.onclick = async ()=>{
      if(!confirm('Log out EVERY device using the Falsehood tracker?\n\nEveryone else will need to enter their name and the guild password again. You stay logged in.\n\nTip: change the passwords in Firebase first if someone should lose access for good.')) return;
      menu.hidden = true;
      try { await logoutAll(); alert('Done. All other devices are being logged out now.'); }
      catch(e) { alert('Couldn’t log everyone out (' + ((e && e.code) || 'error') + '). Check your connection and try again.'); }
    };
    const up = menu.querySelector('.m-up');
    if(up) up.onclick = ()=>{ menu.hidden = true; window.falsehoodUnlock(); };
    menu.querySelector('.m-out').onclick = async ()=>{
      if(!confirm('Log out of the Falsehood tracker on this device? You’ll need a password to get back in.')) return;
      try { await fs.collection('presence_' + role).doc(auth.currentUser.uid).delete(); } catch(e) {}
      try { await auth.signOut(); } catch(e) {}
      location.reload();
    };
  }
  // Who's online: each open tracker checks in every 2 minutes; counts use cheap server-side count queries
  const ONLINE_MS = 5 * 60000, BEAT_MS = 2 * 60000;
  async function countSince(col, since){
    const token = await auth.currentUser.getIdToken();
    const url = 'https://firestore.googleapis.com/v1/projects/' + cfg.projectId + '/databases/(default)/documents:runAggregationQuery';
    const body = { structuredAggregationQuery: {
      structuredQuery: { from: [{ collectionId: col }],
        where: { fieldFilter: { field: { fieldPath: 'at' }, op: 'GREATER_THAN', value: { integerValue: String(since) } } } },
      aggregations: [{ alias: 'n', count: {} }] } };
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(body) });
    if(!r.ok) throw new Error('count ' + r.status);
    const j = await r.json();
    const f = j && j[0] && j[0].result && j[0].result.aggregateFields;
    return f && f.n ? +(f.n.integerValue || 0) : 0;
  }
  function startPresence(uid){
    const sync = document.getElementById('sync');
    const chip = document.createElement('span');
    chip.className = 'fb-online';
    chip.title = 'Guildmates with the tracker open in the last 5 minutes';
    chip.innerHTML = '<span class="dot"></span>Online <b class="o-e" title="FLHD">✎ –</b><b class="o-t" title="Timers">⏱ –</b><b class="o-v" title="View only">👁 –</b>';
    (document.getElementById('fbRole') || sync).after(chip);
    let beatErr = null;
    const beat = ()=> fs.collection('presence_' + role).doc(uid).set({ at: Date.now(), name: myNick || null })
      .then(()=>{ beatErr = null; chip.classList.remove('err'); })
      .catch(x=>{ beatErr = (x && x.code) || 'error'; chip.classList.add('err'); });
    const refresh = async ()=>{
      const since = Date.now() - ONLINE_MS;
      try {
        const [e, t, v] = await Promise.all(['editor', 'timer', 'viewer'].map(r=> countSince('presence_' + r, since)));
        chip.querySelector('.o-e').textContent = '✎ ' + e;
        chip.querySelector('.o-t').textContent = '⏱ ' + t;
        chip.querySelector('.o-v').textContent = '👁 ' + v;
        chip.title = beatErr
          ? `You aren’t being counted (${beatErr}). Ask the board owner to update the Firebase rules.`
          : `Online in the last 5 minutes: ${e} FLHD, ${t} timer${t === 1 ? '' : 's'}, ${v} view-only` + (role === 'editor' ? ' · click to see who' : '');
      } catch(x) { chip.title = 'Couldn’t load who’s online right now'; }
    };
    // FLHD accounts: click Online to see who's on, with nicknames
    if(role === 'editor'){
      chip.classList.add('clickable'); chip.setAttribute('role', 'button'); chip.tabIndex = 0;
      const pop = document.createElement('div');
      pop.className = 'fb-menu fb-who'; pop.hidden = true;
      document.body.appendChild(pop);
      const LBL = { editor: '✎ FLHD', timer: '⏱ Timers', viewer: '👁 View only' };
      const esc = v=> String(v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const ago = t=>{ const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? 'now' : m + 'm ago'; };
      const open = async ()=>{
        const r = chip.getBoundingClientRect();
        pop.innerHTML = '<div class="m-info">Loading who’s online…</div>';
        pop.hidden = false;
        pop.style.top = (r.bottom + 6) + 'px';
        pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + 'px';
        const since = Date.now() - ONLINE_MS;
        try {
          const groups = await Promise.all(['editor', 'timer', 'viewer'].map(async rl=>{
            const snap = await fs.collection('presence_' + rl).where('at', '>', since).get();
            return [rl, snap.docs.map(d=>({ id: d.id, at: (d.data() || {}).at || 0, name: (d.data() || {}).name || names[d.id] || '' }))
              .sort((a, b)=> (a.name || '~').localeCompare(b.name || '~'))];
          }));
          pop.innerHTML = `<div class="m-info">Online in the last 5 minutes</div>` + groups.map(([rl, list])=>
            `<div class="w-grp"><div class="w-h">${LBL[rl]} <span>${list.length}</span></div>${list.length
              ? list.map(p=>`<div class="w-row"><span>${esc(p.name || 'No nickname')}${p.id === uid ? ' <em>(you)</em>' : ''}</span><small>${ago(p.at)}</small></div>`).join('')
              : '<div class="w-none">Nobody</div>'}</div>`).join('');
          pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + 'px';
        } catch(x) { pop.innerHTML = '<div class="m-info">Couldn’t load the list right now.</div>'; }
      };
      chip.onclick = e=>{ e.stopPropagation(); if(!pop.hidden){ pop.hidden = true; return; } open(); };
      chip.onkeydown = e=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); chip.onclick(e); } };
      pop.onclick = e=> e.stopPropagation();
      document.addEventListener('click', ()=>{ pop.hidden = true; });
      chip.title = 'Click to see who’s online';
    }
    beat().then(refresh);
    setInterval(()=>{ beat(); refresh(); }, BEAT_MS);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible'){ beat().then(refresh); } });
  }
  window.falsehoodUnlock = async ()=>{
    const uid = auth.currentUser && auth.currentUser.uid;
    if(!uid) return;
    const r = await askPassword(uid, true);
    if(r) location.reload();
  };
  function askPassword(uid, upgrade){
    let idleOut = false, kicked = false;
    try { idleOut = sessionStorage.getItem(IDLE_FLAG) === '1'; sessionStorage.removeItem(IDLE_FLAG); } catch(e) {}
    try { kicked = sessionStorage.getItem(KICK_FLAG) === '1'; sessionStorage.removeItem(KICK_FLAG); } catch(e) {}
    return new Promise(resolve=>{
      const g = document.createElement('div');
      g.id = 'fbGate';
      g.innerHTML = `<form class="g-card">
        <h2>Falsehood</h2>
        <p>${upgrade ? 'Enter the timer or editor password to get more access on this device.' : (kicked ? '<b>An officer logged out all devices.</b> Enter your name and the current guild password to continue.' : idleOut ? '<b>You were logged out after 3 hours of inactivity.</b> Enter the guild password to continue.' : 'Enter the guild password to open the shared timers and storage.')}</p>
        ${upgrade ? '' : `<input type="text" class="g-nick" maxlength="24" autocomplete="nickname" placeholder="Your in-game name (e.g. Scrumzilla)" aria-label="Your in-game name">`}
        <input type="password" class="g-pass" autocomplete="current-password" placeholder="Guild password" aria-label="Guild password">
        <div class="g-err" role="alert"></div>
        <div class="g-row"><button type="button" class="g-skip">${upgrade ? 'Cancel' : 'Use offline'}</button><button class="g-go">Enter</button></div>
      </form>`;
      document.body.appendChild(g);
      const form = g.querySelector('form'), inp = g.querySelector('.g-pass'), nickIn = g.querySelector('.g-nick'), err = g.querySelector('.g-err'), go = g.querySelector('.g-go');
      if(nickIn){ nickIn.value = lsGetX(NICK_KEY) || ''; (nickIn.value ? inp : nickIn).focus(); } else inp.focus();
      g.querySelector('.g-skip').onclick = ()=>{ g.remove(); resolve(false); };
      form.onsubmit = async e=>{
        e.preventDefault();
        const pass = inp.value;
        const nick = nickIn ? cleanNick(nickIn.value) : '';
        if(nickIn && nick.length < 2){ err.textContent = 'Enter your in-game name (at least 2 characters).'; nickIn.focus(); return; }
        if(!pass) return;
        go.disabled = true; err.textContent = '';
        try {
          // when upgrading, only try roles above the current one so a lower password can't downgrade
          const r = await join(uid, pass, upgrade ? (role === 'viewer' ? ['editor', 'timer'] : ['editor']) : null);
          if(!r){
            err.textContent = upgrade ? 'That password doesn’t give more access.' : 'Wrong password. Ask a guild officer for it.';
            go.disabled = false; inp.select(); return;
          }
          if(nick) await saveNick(uid, nick);
          lsSetX(LOGIN_KEY, String(Date.now()));
          g.remove(); resolve(r);
        } catch(x) {
          err.textContent = 'Couldn’t connect (' + ((x && (x.code || x.message)) || 'unknown') + '). Check your internet and try again.';
          go.disabled = false; inp.select();
        }
      };
    });
  }
  // ---- Log out after 3 hours with no activity (clicks, keys, taps, scrolling) on this device ----
  const IDLE_MS = 3 * 60 * 60000, ACT_KEY = 'falsehood-last-active', IDLE_FLAG = 'falsehood-idle-out';
  const lsGetX = k=>{ try { return localStorage.getItem(k); } catch(e) { return null; } };
  const lsSetX = (k, v)=>{ try { localStorage.setItem(k, v); } catch(e) {} };
  const lastActive = ()=> +lsGetX(ACT_KEY) || 0;
  let actWritten = 0;
  const markActive = ()=>{ const n = Date.now(); if(n - actWritten > 30000){ actWritten = n; lsSetX(ACT_KEY, String(n)); } };
  async function idleLogout(){
    try { sessionStorage.setItem(IDLE_FLAG, '1'); } catch(e) {}
    try { if(auth.currentUser) await fs.collection('presence_' + role).doc(auth.currentUser.uid).delete(); } catch(e) {}
    try { await auth.signOut(); } catch(e) {}
    location.reload();
  }
  function startIdleWatch(){
    lsSetX(ACT_KEY, String(Date.now())); actWritten = Date.now();
    ['pointerdown', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(ev=> window.addEventListener(ev, markActive, { passive: true, capture: true }));
    // "Still there?" warning 5 minutes before the log out; any click/tap/key (or the button) keeps you in
    const WARN_MS = 5 * 60000;
    const warn = document.createElement('div');
    warn.id = 'fbIdleWarn'; warn.hidden = true; warn.setAttribute('role', 'alertdialog'); warn.setAttribute('aria-live', 'assertive');
    warn.innerHTML = `<div class="iw-card"><div class="iw-ic">⏳</div>
      <div class="iw-txt"><b>Still there?</b><span>You’ll be logged out for inactivity in <b id="fbIdleLeft">5:00</b>.</span></div>
      <button type="button" class="iw-btn" id="fbIdleStay">I’m still here</button></div>`;
    document.body.appendChild(warn);
    const stay = ()=>{ actWritten = Date.now(); lsSetX(ACT_KEY, String(actWritten)); warn.hidden = true; };
    warn.querySelector('#fbIdleStay').onclick = stay;
    let warnedChime = false;
    setInterval(()=>{
      const idle = Date.now() - lastActive();
      if(idle > IDLE_MS){ idleLogout(); return; }
      const left = IDLE_MS - idle;
      if(left <= WARN_MS){
        if(warn.hidden){
          warn.hidden = false;
          if(!warnedChime){ warnedChime = true; try { if(typeof playSoft === 'function') playSoft(); } catch(e) {} }
        }
        const sec = Math.ceil(left / 1000);
        warn.querySelector('#fbIdleLeft').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
      } else if(!warn.hidden){ warn.hidden = true; warnedChime = false; }
      else warnedChime = false;
    }, 1000);
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible' && Date.now() - lastActive() > IDLE_MS) idleLogout();
    });
  }

  // ---- Nicknames: required at login, saved to names/<uid> (the same names Storage uses) ----
  const NICK_KEY = 'falsehood-nick';
  let myNick = '';
  const cleanNick = v=> String(v || '').replace(/\s+/g, ' ').trim().slice(0, 24);
  async function saveNick(uid, nick){
    myNick = nick; lsSetX(NICK_KEY, nick);
    try { names[uid] = nick; } catch(e) {}
    try { await fs.collection('names').doc(uid).set({ name: nick }); } catch(e) {}
  }
  function askNick(){
    return new Promise(resolve=>{
      const g = document.createElement('div');
      g.id = 'fbGate';
      g.innerHTML = `<form class="g-card">
        <h2>Your nickname</h2>
        <p>Enter your in-game name so guildmates know who’s online and who logged each kill.</p>
        <input type="text" class="g-nick" maxlength="24" autocomplete="nickname" placeholder="e.g. Scrumzilla" aria-label="Your in-game name">
        <div class="g-err" role="alert"></div>
        <div class="g-row"><button class="g-go">Save</button></div>
      </form>`;
      document.body.appendChild(g);
      const nickIn = g.querySelector('.g-nick'), err = g.querySelector('.g-err');
      nickIn.value = lsGetX(NICK_KEY) || ''; nickIn.focus();
      g.querySelector('form').onsubmit = e=>{
        e.preventDefault();
        const n = cleanNick(nickIn.value);
        if(n.length < 2){ err.textContent = 'At least 2 characters.'; return; }
        g.remove(); resolve(n);
      };
    });
  }
  async function ensureNick(uid){
    try {
      const d = await fs.collection('names').doc(uid).get();
      const n = d.exists ? cleanNick((d.data() || {}).name) : '';
      if(n){ myNick = n; lsSetX(NICK_KEY, n); return; }
    } catch(e) {}
    if(document.readyState === 'loading') await new Promise(r=> document.addEventListener('DOMContentLoaded', r, { once:true }));
    await saveNick(uid, await askNick());
  }

  // ---- Log out all devices: an FLHD account sets meta/session.resetAt; every device logged in before that signs out ----
  const LOGIN_KEY = 'falsehood-login-at', KICK_FLAG = 'falsehood-kicked';
  async function forcedLogout(){
    try { sessionStorage.setItem(KICK_FLAG, '1'); } catch(e) {}
    try { if(auth.currentUser) await fs.collection('presence_' + role).doc(auth.currentUser.uid).delete(); } catch(e) {}
    try { await auth.signOut(); } catch(e) {}
    location.reload();
  }
  function watchSession(){
    fs.doc('meta/session').onSnapshot(d=>{
      const r = d.exists ? +((d.data() || {}).resetAt) || 0 : 0;
      if(r && r > (+lsGetX(LOGIN_KEY) || 0)) forcedLogout();
    }, ()=>{});
  }
  async function logoutAll(){
    const now = Date.now();
    lsSetX(LOGIN_KEY, String(now + 1000));          // keep the officer who pressed it logged in
    await fs.doc('meta/session').set({ resetAt: now, by: auth.currentUser ? auth.currentUser.uid : null, byName: myNick || null });
  }

  async function ready(){
    if(gateDone) return gateDone;
    gateDone = (async ()=>{
      try {
        await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        // already idle too long since the last visit: start fresh (asks for the password again)
        await new Promise(res=>{ const off = auth.onAuthStateChanged(()=>{ off(); res(); }); });
        if(auth.currentUser && lastActive() && Date.now() - lastActive() > IDLE_MS){
          try { sessionStorage.setItem(IDLE_FLAG, '1'); } catch(e) {}
          try { await auth.signOut(); } catch(e) {}
        }
        const cred = auth.currentUser ? { user: auth.currentUser } : await new Promise((res, rej)=>{
          const off = auth.onAuthStateChanged(u=>{ off(); u ? res({ user: u }) : auth.signInAnonymously().then(res, rej); });
        });
        const uid = cred.user.uid;
        let member = false;
        try {
          const me = await fs.collection('members').doc(uid).get();
          if(me.exists){ member = true; const r = (me.data() || {}).role; role = r === 'viewer' || r === 'timer' ? r : 'editor'; }
        } catch(e) { member = false; }
        if(!member){
          if(document.readyState === 'loading') await new Promise(r=> document.addEventListener('DOMContentLoaded', r, { once:true }));
          const r = await askPassword(uid, false);
          if(r){ member = true; role = r; }
        }
        window.FALSEHOOD_ROLE = role;
        if(member && role === 'viewer') document.body.classList.add('viewonly');
        if(member && role === 'timer') document.body.classList.add('storage-ro');
        if(member){ await ensureNick(uid); showRole(); startPresence(uid); startIdleWatch(); watchSession(); }
        if(member && role === 'editor') await importOnce(uid);
        return member ? uid : null;
      } catch(e) {
        console.warn('Firebase sign-in failed', e);
        window.FALSEHOOD_FB_ERROR = (e && (e.code || e.message)) || 'unknown';
        return null;
      }
    })();
    return gateDone;
  }

  const IMPORT = window.FALSEHOOD_IMPORT || null;
  const names = Object.assign({}, IMPORT && IMPORT.names);
  let namesOn = false;
  // One-time copy of the old Claude board (timers, storage, pictures, history) into Firebase
  async function importOnce(uid){
    if(!IMPORT) return;
    const flag = fs.doc('meta/imported');
    let mine = false;
    try {
      mine = await fs.runTransaction(async tx=>{
        const s = await tx.get(flag);
        if(s.exists) return false;
        tx.set(flag, { at: Date.now(), by: uid });
        return true;
      });
    } catch(e) { return; }
    if(!mine) return;
    const writes = [];
    for(const col of ['loot', 'lootfiles', 'lootlog']){
      for(const [id, data] of Object.entries(IMPORT[col] || {})) writes.push(fs.collection(col).doc(id).set(data));
    }
    for(const [id, data] of Object.entries(IMPORT.mvps || {})){
      writes.push((async ()=>{
        const ref = fs.collection('mvps').doc(id);
        const cur = await ref.get();
        if(!cur.exists) await ref.set(data);         // keep anything already logged on the new board
      })());
    }
    writes.push((async ()=>{
      const ref = fs.doc('meta/counter');
      const cur = await ref.get();
      const last = cur.exists ? (+(cur.data() || {}).last || 0) : 0;
      if(last < (IMPORT.counter || 0)) await ref.set({ last: IMPORT.counter });
    })());
    try { await Promise.all(writes); } catch(e) { console.warn('Import incomplete', e); }
  }
  function watchNames(){
    if(namesOn) return; namesOn = true;
    fs.collection('names').onSnapshot(s=>{ s.docs.forEach(d=>{ names[d.id] = (d.data() || {}).name; }); }, ()=>{});
  }
  window.claude = {
    async use(what){
      const uid = await ready();
      if(!uid) return null;
      watchNames();
      if(what === 'db') return fs;
      if(what === 'user') return {
        id: async ()=> uid,
        can: async ()=> role !== 'viewer',
        profiles: async ids=>{
          const out = {};
          ids.forEach(id=>{ out[id] = { name: names[id] || null, isMe: id === uid }; });
          return out;
        },
      };
      return null;
    },
  };
})();
</script>
