<script>
(function(){
  const cfg = window.FALSEHOOD_FIREBASE;
  if(!cfg || !window.firebase) return;            // no config: the tracker runs in this-device mode
  window.FALSEHOOD_HOST = 'firebase';
  firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const fs = firebase.firestore();
  // ---- Error reports: a tracker that hits a bug records it (Admin-only log). Once per error per visit, max 5 a day per device ----
  const errQueue = [], errSeen = new Set();
  let errReady = false;
  const IGNORE = /ResizeObserver loop|Script error\.?$|Failed to fetch|NetworkError|Load failed|network error|AbortError|The operation was aborted|Quota exceeded|resource-exhausted|unavailable|offline|permission-denied|Missing or insufficient permissions|play\(\) (request|failed)|NotAllowedError|user gesture/i;
  function errReport(msg, where, stack){
    msg = String(msg || '').slice(0, 300); where = String(where || '').slice(0, 200);
    if(!msg || IGNORE.test(msg) || /extension:\/\/|^chrome:|moz-extension/.test(where + ' ' + stack)) return;
    const key = msg + '|' + where;
    if(errSeen.has(key)) return; errSeen.add(key);
    const day = new Date().toISOString().slice(0, 10);
    let n = 0; try { const c = JSON.parse(localStorage.getItem('falsehood-errs') || '{}'); n = c.day === day ? c.n : 0; if(n >= 5) return; localStorage.setItem('falsehood-errs', JSON.stringify({ day, n: n + 1 })); } catch(e) {}
    const entry = { at: Date.now(), msg, where, stack: String(stack || '').split('\n').slice(0, 6).join('\n').slice(0, 700),
      ua: navigator.userAgent.slice(0, 160), tab: (typeof currentTab !== 'undefined' && currentTab) || '' };
    errQueue.push(entry); errFlush();
  }
  function errFlush(){
    if(!errReady) return;
    while(errQueue.length){
      const e = errQueue.shift();
      const u = auth.currentUser;
      fs.collection('errlog').doc(Date.now().toString(36) + Math.random().toString(36).slice(2, 7))
        .set(Object.assign(e, { uid: u ? u.uid : null, name: myNick || null, role, ver: window.FALSEHOOD_BUILD || '' })).catch(()=>{});
    }
  }
  window.addEventListener('error', ev=>{ try { errReport(ev.message || (ev.error && ev.error.message), (ev.filename || '').split('/').pop() + ':' + (ev.lineno || 0) + ':' + (ev.colno || 0), ev.error && ev.error.stack); } catch(x) {} });
  window.addEventListener('unhandledrejection', ev=>{ try { const r = ev.reason || {}; errReport('Unhandled: ' + (r.message || r), '', r.stack); } catch(x) {} });
  window.falsehoodReportError = (msg, where, stack)=> errReport(msg, where, stack);

  // keep a copy of the data in this browser (all tabs share it), so a refresh downloads only what changed
  try { if(fs.enablePersistence) fs.enablePersistence({ synchronizeTabs: true }).catch(()=>{}); } catch(e) {}

  // Short lease on a doc, used by the tracker to hand out item numbers one at a time
  firebase.firestore.DocumentReference.prototype.acquire = async function(opts){
    const lock = fs.collection('locks').doc(this.path.replace(/\//g, '_'));
    const holder = (opts && opts.holder) || String(Math.random());
    const ttl = (opts && opts.ttlMs) || 4000;
    const ok = await fs.runTransaction(async tx=>{
      const s = await tx.get(lock);
      const d = s.exists ? s.data() : null;
      if(d && d.until > Date.now() && d.holder !== holder) return false;
      tx.set(lock, { holder, until: Date.now() + ttl });
      return true;
    });
    if(ok) held.set(this.path, lock);
    return { acquired: ok };
  };
  // Saving the leased doc releases the lease, so the next person doesn't wait for it to expire
  const held = new Map();
  const origSet = firebase.firestore.DocumentReference.prototype.set;
  firebase.firestore.DocumentReference.prototype.set = async function(...args){
    const r = await origSet.apply(this, args);
    const lock = held.get(this.path);
    if(lock){ held.delete(this.path); lock.delete().catch(()=>{}); }
    return r;
  };

  let gateDone = null;
  let role = 'editor';
  // admin = everything FLHD can do, plus deleting Storage items
  const RANK = { viewer: 0, timer: 1, editor: 2, admin: 3 };   // admin only: delete Storage items, log out all devices
  const isOfficer = ()=> role === 'editor' || role === 'admin';
  const presCol = ()=> 'presence_' + role;   // presence_admin / _editor / _timer / _viewer (counts; no names)
  // each device checks in under a random token, so the counts can't be tied back to a person;
  // the token → nickname link sits in presence_who, which only the Admin can read
  const PTOKEN = (()=>{ let t = null; try { t = localStorage.getItem('falsehood-ptoken'); } catch(e) {}
    if(!t){ t = Array.from(crypto.getRandomValues(new Uint8Array(12)), b=> b.toString(16).padStart(2, '0')).join(''); try { localStorage.setItem('falsehood-ptoken', t); } catch(e) {} }
    return t; })();
  const dropPresence = async ()=>{
    try { await fs.collection(presCol()).doc(PTOKEN).delete(); } catch(e) {}
    try { await fs.collection('presence_who').doc(PTOKEN).delete(); } catch(e) {}
  };
  // Editor password first, then the view-only one; the security rules decide which matches
  async function join(uid, pass, roles){
    for(const r of roles || ['admin', 'editor', 'timer', 'viewer']){
      try { await fs.collection('members').doc(uid).set({ pass, role: r, joinedAt: firebase.firestore.FieldValue.serverTimestamp() }); return r; }
      catch(x) { if(!(x && x.code === 'permission-denied')) throw x; }
    }
    return null;
  }
  // Access badge beside LIVE: shows Editor / View only, click for switch + log out
  function showRole(){
    const sync = document.getElementById('sync');
    if(!sync || document.getElementById('fbRole')) return;
    const b = document.createElement('button');
    b.id = 'fbRole'; b.type = 'button';
    b.className = 'fb-role ' + role;
    const k = role === 'admin' ? 'a' : role === 'editor' ? 'e' : role === 'timer' ? 't' : 'v';
    b.innerHTML = `<i class="ic">${ICON[k]}</i><span>${role === 'admin' ? 'Admin' : role === 'editor' ? 'FLHD' : role === 'timer' ? 'Timers' : 'View only'}</span>`;
    b.title = 'Your access on this device. Click for options.';
    sync.after(b);
    const menu = document.createElement('div');
    menu.className = 'fb-menu'; menu.hidden = true;
    menu.innerHTML = `<div class="m-info">${role === 'admin'
        ? 'You have <b>Admin access</b> on this device: everything FLHD can do, plus deleting Storage items and logging out all devices.'
        : role === 'editor'
        ? 'You have <b>FLHD access</b> on this device: you can log kills and manage storage (only the Admin can delete items).'
        : role === 'timer'
        ? 'You have <b>timer access</b> on this device: you can log MVP and MINI MVP kills. Storage is view only.'
        : 'You have <b>view-only access</b> on this device: you can see everything but can’t make changes.'}</div>
      <button type="button" class="m-nm">🏷 In-game name: <b class="m-nm-v"></b></button>
      ${role !== 'admin' ? '<button type="button" class="m-up">🔑 Enter another password</button>' : ''}
      <button type="button" class="m-out">⎋ Log out of this device</button>
      ${role === 'admin' ? '<button type="button" class="m-rv">📋 Auto-detect log…</button>' : ''}
      ${role === 'admin' ? '<button type="button" class="m-dc">💬 Discord board…</button>' : ''}
      ${role === 'admin' ? '<button type="button" class="m-er">🐞 Error reports…</button>' : ''}
      ${role === 'admin' ? '<button type="button" class="m-cl">🧹 Clean up old logs…</button>' : ''}
      ${role === 'admin' ? '<button type="button" class="m-out m-all">⎋ Log out all devices</button>' : ''}`;
    document.body.appendChild(menu);
    b.onclick = e=>{
      e.stopPropagation();
      if(!menu.hidden){ menu.hidden = true; return; }
      const nv = menu.querySelector('.m-nm-v');
      if(nv) nv.textContent = (window.falsehoodMyName && window.falsehoodMyName()) || 'not set';
      const r = b.getBoundingClientRect();
      menu.hidden = false;
      menu.style.top = (r.bottom + 6) + 'px';
      menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + 'px';
    };
    document.addEventListener('click', e=>{ if(!menu.contains(e.target)) menu.hidden = true; });

  async function countSince(col, since){
    const token = await auth.currentUser.getIdToken();
    const url = 'https://firestore.googleapis.com/v1/projects/' + cfg.projectId + '/databases/(default)/documents:runAggregationQuery';
    const body = { structuredAggregationQuery: {
      structuredQuery: { from: [{ collectionId: col }],
        where: { fieldFilter: { field: { fieldPath: 'at' }, op: 'GREATER_THAN', value: { integerValue: String(since) } } } },
      aggregations: [{ alias: 'n', count: {} }] } };
    const ac = new AbortController(), to = setTimeout(()=> ac.abort(), 12000);
    let r;
    try { r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(body), signal: ac.signal }); }
    catch(e) { throw new Error(e && e.name === 'AbortError' ? 'no answer from Firebase (timed out)' : 'couldn’t reach Firebase (' + ((e && e.message) || 'network') + ')'); }
    finally { clearTimeout(to); }
    if(!r.ok){
      let msg = ''; try { const j = await r.json(); msg = ((Array.isArray(j) ? j[0] : j) || {}).error?.message || ''; } catch(e) {}
      const why = r.status === 429 || /quota|exhausted/i.test(msg) ? 'Firebase daily limit reached'
        : r.status === 403 ? 'blocked by the Firebase rules' : r.status === 401 ? 'login expired' : 'Firebase error ' + r.status;
      const err = new Error(why); err.status = r.status; err.detail = msg; throw err;
    }
    const j = await r.json();
    const f = j && j[0] && j[0].result && j[0].result.aggregateFields;
    return f && f.n ? +(f.n.integerValue || 0) : 0;
  }

      <linearGradient id="gFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0616" stop-opacity="0"/><stop offset=".55" stop-color="#0c0616" stop-opacity=".2"/><stop offset="1" stop-color="#0c0616" stop-opacity=".95"/></linearGradient></defs>
    <g fill="#fff" opacity=".55"><circle cx="60" cy="40" r="1"/><circle cx="130" cy="90" r=".8"/><circle cx="210" cy="30" r="1.1"/><circle cx="300" cy="60" r=".8"/><circle cx="440" cy="190" r="1"/><circle cx="30" cy="150" r=".9"/><circle cx="250" cy="120" r=".7"/><circle cx="470" cy="40" r=".8"/></g>
    <circle cx="395" cy="105" r="95" fill="url(#gMoon)" opacity=".55"/><circle cx="395" cy="105" r="52" fill="#c9b0ff" opacity=".42"/>
    <circle cx="380" cy="95" r="9" fill="#9c7ee6" opacity=".35"/><circle cx="410" cy="122" r="6" fill="#9c7ee6" opacity=".3"/>
    <path fill="#1c0d36" opacity=".95" d="M0 300V190l10-24 10 24v-40l14-34 14 34v60h10v-30l8-18 8 18v50h12v-80l16-40 16 40v100h10v-36l9-20 9 20v56h12v40H0z"/>
    <path fill="#1c0d36" opacity=".95" d="M500 300V200l-10-22-10 22v-56l-14-36-14 36v86h-10v-34l-9-20-9 20v46h-12v-70l-15-40-15 40v94h-10v-30l-8-18-8 18v50h-12v32h176z"/>
    <path fill="#13082a" d="M0 330V250l9-20 9 20v-30l12-28 12 28v58h120v62zM500 330V240l-9-20-9 20v-26l-12-30-12 30v52H340v64z"/>
    <rect y="260" width="500" height="380" fill="url(#gFade)"/>
    <g fill="#6a2fbf" opacity=".22"><ellipse cx="20" cy="560" rx="90" ry="60"/><ellipse cx="490" cy="520" rx="80" ry="70"/><ellipse cx="40" cy="430" rx="50" ry="40"/><ellipse cx="470" cy="400" rx="44" ry="36"/></g>
  </svg>`;
  const G_ORN = '<i class="g-gem t"></i><i class="g-gem b"></i><i class="g-corner tl"></i><i class="g-corner tr"></i><i class="g-corner bl"></i><i class="g-corner br"></i>';
  const gLogo = ()=>{ const e = document.querySelector('header .emblem'); return e ? `<div class="g-logo">${e.outerHTML}</div>` : ''; };
  const G_HEAD = ()=> G_SKY + G_ORN + gLogo() + '<div class="g-title">FALSEHOOD</div>';
  const G_IC = {
    user: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6z"/></svg>',
    lock: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.3"/></svg>',
    eye: '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
    warn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffc94d" d="M12 2.5 1.5 21h21z"/><path fill="#2a1600" d="M11 9h2v6h-2zm0 7.5h2v2h-2z"/></svg>',
    go: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  };
  window.falsehoodGateHead = G_HEAD;
  window.falsehoodUnlock = async ()=>{
    const uid = auth.currentUser && auth.currentUser.uid;
    if(!uid) return;
    const r = await askPassword(uid, true);
    if(r){
      // drop the old access level's online entry so you aren't listed twice
      await dropPresence();
      location.reload();
    }
  };
  function askPassword(uid, upgrade){
    let idleOut = false, kicked = false;
    try { idleOut = sessionStorage.getItem(IDLE_FLAG) === '1'; sessionStorage.removeItem(IDLE_FLAG); } catch(e) {}
    try { kicked = sessionStorage.getItem(KICK_FLAG) === '1'; sessionStorage.removeItem(KICK_FLAG); } catch(e) {}
    let kickedOne = false;
    try { kickedOne = sessionStorage.getItem('falsehood-kicked-one') === '1'; sessionStorage.removeItem('falsehood-kicked-one'); } catch(e) {}
    return new Promise(resolve=>{
      const g = document.createElement('div');
      g.id = 'fbGate';
      g.innerHTML = `<form class="g-card">
        ${G_HEAD()}
        ${upgrade ? '<button type="button" class="g-x g-skip" title="Cancel" aria-label="Cancel">✕</button>' : ''}
        <p>${upgrade ? 'Enter a higher-access password (Timers, FLHD or Admin) for this device.' : (kickedOne ? '<b>The Admin logged you out.</b> Enter your name and the guild password to continue.' : kicked ? '<b>An officer logged out all devices.</b> Enter your name and the current guild password to continue.' : idleOut ? '<b>You were logged out after 24 hours of inactivity.</b> Enter the guild password to continue.' : 'Enter the guild password to open the shared timers and storage.')}</p>
        ${upgrade ? '' : `<label class="g-field">${G_IC.user}<input type="text" class="g-nick" maxlength="24" autocomplete="nickname" placeholder="In-game name (e.g. Scrumzilla)" aria-label="Your in-game name"></label>`}
        <label class="g-field pw">${G_IC.lock}<input type="password" class="g-pass" autocomplete="current-password" placeholder="Guild password" aria-label="Guild password"><button type="button" class="g-eye" title="Show password" aria-label="Show password">${G_IC.eyeOff}</button></label>
        ${upgrade ? '' : `<div class="g-note">${G_IC.warn}<div><b>Only recognized in-game names (IGNs) are allowed.</b>Users with unrecognized IGNs will be automatically logged out. Placeholder names like “admin”, “guest” or “no name” are blocked.</div></div>`}
        <div class="g-err" role="alert"></div>
        <button class="g-go">${G_IC.go}Enter</button>
      </form>`;
      document.body.appendChild(g);
      const form = g.querySelector('form'), inp = g.querySelector('.g-pass'), nickIn = g.querySelector('.g-nick'), err = g.querySelector('.g-err'), go = g.querySelector('.g-go');
      if(nickIn){ nickIn.value = lsGetX(NICK_KEY) || ''; (nickIn.value ? inp : nickIn).focus(); } else inp.focus();
      const skip = g.querySelector('.g-skip');   // only when switching access; no offline mode on the login box
      if(skip) skip.onclick = ()=>{ g.remove(); resolve(false); };
      const eye = g.querySelector('.g-eye');
      eye.onclick = ()=>{
        const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        eye.innerHTML = show ? G_IC.eye : G_IC.eyeOff;
        eye.title = show ? 'Hide password' : 'Show password'; eye.setAttribute('aria-label', eye.title);
        inp.focus();
      };
      form.onsubmit = async e=>{
        e.preventDefault();
        const pass = inp.value;
        const nick = nickIn ? cleanNick(nickIn.value) : '';
        const nErr = nickIn ? nickError(nick) : '';
        if(nErr){ err.textContent = nErr; nickIn.focus(); nickIn.select(); return; }
        if(!pass) return;
        go.disabled = true; err.textContent = '';
        try {
          // when upgrading, only try roles above the current one so a lower password can't downgrade
          const r = await join(uid, pass, upgrade ? ['admin', 'editor', 'timer'].filter(x=> RANK[x] > RANK[role]) : null);
          if(!r){
            err.textContent = upgrade ? 'That password doesn’t give more access.' : 'Wrong password. Ask a guild officer for it.';
            go.disabled = false; inp.select(); return;
          }
          if(nick) await saveNick(uid, nick);
          lsSetX(LOGIN_KEY, String(Date.now()));
          g.remove(); resolve(r);
        } catch(x) {
          err.textContent = 'Couldn’t connect (' + ((x && (x.code || x.message)) || 'unknown') + '). Check your internet and try again.';
          go.disabled = false; inp.select();
        }
      };
    });
  }
  // ---- Log out after 24 hours with no activity (clicks, keys, taps, scrolling) on this device ----
  const IDLE_MS = 24 * 60 * 60000, ACT_KEY = 'falsehood-last-active', IDLE_FLAG = 'falsehood-idle-out';
  const lsGetX = k=>{ try { return localStorage.getItem(k); } catch(e) { return null; } };
  const lsSetX = (k, v)=>{ try { localStorage.setItem(k, v); } catch(e) {} };
  const lastActive = ()=> +lsGetX(ACT_KEY) || 0;
  let actWritten = 0;
  const markActive = ()=>{ const n = Date.now(); if(n - actWritten > 30000){ actWritten = n; lsSetX(ACT_KEY, String(n)); } };
  async function idleLogout(){
    try { sessionStorage.setItem(IDLE_FLAG, '1'); } catch(e) {}
    await dropPresence();
    try { await auth.signOut(); } catch(e) {}
    location.reload();
  }
  function startIdleWatch(){
    lsSetX(ACT_KEY, String(Date.now())); actWritten = Date.now();
    ['pointerdown', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(ev=> window.addEventListener(ev, markActive, { passive: true, capture: true }));
    // "Still there?" warning 5 minutes before the log out; any click/tap/key (or the button) keeps you in
    const WARN_MS = 5 * 60000;
    const warn = document.createElement('div');
    warn.id = 'fbIdleWarn'; warn.hidden = true; warn.setAttribute('role', 'alertdialog'); warn.setAttribute('aria-live', 'assertive');
    warn.innerHTML = `<div class="iw-card"><div class="iw-ic">⏳</div>
      <div class="iw-txt"><b>Still there?</b><span>You’ll be logged out for inactivity in <b id="fbIdleLeft">5:00</b>.</span></div>
      <button type="button" class="iw-btn" id="fbIdleStay">I’m still here</button></div>`;
    document.body.appendChild(warn);
    const stay = ()=>{ actWritten = Date.now(); lsSetX(ACT_KEY, String(actWritten)); warn.hidden = true; };
    warn.querySelector('#fbIdleStay').onclick = stay;
    let warnedChime = false;
    setInterval(()=>{
      const idle = Date.now() - lastActive();
      if(idle > IDLE_MS){ idleLogout(); return; }
      const left = IDLE_MS - idle;
      if(left <= WARN_MS){
        if(warn.hidden){
          warn.hidden = false;
          if(!warnedChime){ warnedChime = true; try { if(typeof playSoft === 'function') playSoft(); } catch(e) {} }
        }
        const sec = Math.ceil(left / 1000);
        warn.querySelector('#fbIdleLeft').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
      } else if(!warn.hidden){ warn.hidden = true; warnedChime = false; }
      else warnedChime = false;
    }, 1000);
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible' && Date.now() - lastActive() > IDLE_MS) idleLogout();
    });
  }

  // ---- Nicknames: required at login, saved to names/<uid> (the same names Storage uses) ----
  const NICK_KEY = 'falsehood-nick';
  let myNick = '';
  const cleanNick = v=> String(v || '').replace(/\s+/g, ' ').trim().slice(0, 24);
  // names that would confuse the Online list, history or access badges aren't allowed
  const RESERVED = ['nonickname','nickname','noname','name','myname','yourname','ign','guildmate','aguildmate','amember','member','someone',
    'unknown','anonymous','anon','user','player','guest','test','tester','null','undefined','none','na','nil','blank','empty',
    'admin','administrator','flhd','flhdog','falsehood','moderator','mod','officer','gm','gamemaster','leader','guildleader','owner',
    'you','me','timer','timers','viewer','viewonly','editor','system','bot','claude'];
  function nickError(v){
    const n = cleanNick(v), k = n.toLowerCase().replace(/[^a-z0-9]/g, '');
    if(n.length < 2) return 'Enter your in-game name (at least 2 characters).';
    if(!/[a-z0-9]/i.test(n)) return 'Use your real in-game name (letters or numbers).';
    if(RESERVED.includes(k) || /^no(nick|name)/.test(k) || /^(admin|flhd)\d*$/.test(k)) return '“' + n + '” can’t be used. Enter your real in-game name.';
    return '';
  }
  window.falsehoodNickError = nickError;
  async function saveNick(uid, nick){
    myNick = nick; lsSetX(NICK_KEY, nick);
    try { names[uid] = nick; } catch(e) {}
    try { await fs.collection('names').doc(uid).set({ name: nick }); } catch(e) {}
  }
  function askNick(){
    return new Promise(resolve=>{
      const g = document.createElement('div');
      g.id = 'fbGate';
      g.innerHTML = `<form class="g-card">
        ${G_HEAD()}
        <p>Enter your in-game name so guildmates know who’s online and who logged each kill.</p>
        <label class="g-field">${G_IC.user}<input type="text" class="g-nick" maxlength="24" autocomplete="nickname" placeholder="In-game name (e.g. Scrumzilla)" aria-label="Your in-game name"></label>
        <div class="g-err" role="alert"></div>
        <button class="g-go">${G_IC.go}Save</button>
      </form>`;
      document.body.appendChild(g);
      const nickIn = g.querySelector('.g-nick'), err = g.querySelector('.g-err');
      nickIn.value = lsGetX(NICK_KEY) || ''; nickIn.focus();
      g.querySelector('form').onsubmit = e=>{
        e.preventDefault();
        const n = cleanNick(nickIn.value);
        const nErr = nickError(n);
        if(nErr){ err.textContent = nErr; nickIn.select(); return; }
        g.remove(); resolve(n);
      };
    });
  }
  async function ensureNick(uid){
    try {
      const d = await fs.collection('names').doc(uid).get();
      const n = d.exists ? cleanNick((d.data() || {}).name) : '';
      if(n && !nickError(n)){ myNick = n; lsSetX(NICK_KEY, n); return; }
      if(n) lsSetX(NICK_KEY, '');
    } catch(e) {}
    if(document.readyState === 'loading') await new Promise(r=> document.addEventListener('DOMContentLoaded', r, { once:true }));
    await saveNick(uid, await askNick());
  }

  // ---- Log out all devices: an FLHD account sets meta/session.resetAt; every device logged in before that signs out ----
  const LOGIN_KEY = 'falsehood-login-at', KICK_FLAG = 'falsehood-kicked';
  async function forcedLogout(){
    try { sessionStorage.setItem(KICK_FLAG, '1'); } catch(e) {}
    await dropPresence();
    try { await auth.signOut(); } catch(e) {}
    location.reload();
  }
  // Firebase also enforces this: after a reset, logins from before it can't read or write anything
  async function staleLogin(uid, data){
    const r = data && data.resetAt;
    if(!r || data.by === uid) return false;
    if(typeof r === 'number') return r > (+lsGetX(LOGIN_KEY) || 0);           // older style reset
    if(typeof r.toMillis !== 'function') return false;                          // still being saved
    try {
      const me = await fs.collection('members').doc(uid).get();
      const j = me.exists ? (me.data() || {}).joinedAt : null;
      return !(j && typeof j.toMillis === 'function' && j.toMillis() > r.toMillis());
    } catch(e) { return false; }
  }
  function watchSession(uid){
    fs.doc('meta/session').onSnapshot(async d=>{
      if(await staleLogin(uid, d.exists ? d.data() : null)) forcedLogout();
    }, e=>{ if(e && e.code === 'permission-denied') forcedLogout(); });
  }
  // the Admin logged this one person out (kicks/<uid>): sign out if it's newer than this login
  const ONE_FLAG = 'falsehood-kicked-one';
  function watchKick(uid){
    fs.collection('kicks').doc(uid).onSnapshot(async d=>{
      const k = d.exists ? (d.data() || {}).at : null;
      if(!k || typeof k.toMillis !== 'function') return;
      try {
        const me = await fs.collection('members').doc(uid).get();
        const j = me.exists ? (me.data() || {}).joinedAt : null;
        if(j && typeof j.toMillis === 'function' && j.toMillis() > k.toMillis()) return;   // logged in again since
      } catch(e) {}
      try { sessionStorage.setItem(ONE_FLAG, '1'); } catch(e) {}
      await dropPresence();
      try { await auth.signOut(); } catch(e) {}
      location.reload();
    }, ()=>{});
  }
  async function logoutAll(){
    lsSetX(LOGIN_KEY, String(Date.now() + 1000));
    await fs.doc('meta/session').set({ resetAt: firebase.firestore.FieldValue.serverTimestamp(), by: auth.currentUser ? auth.currentUser.uid : null, byName: myNick || null });
  }

  async function ready(){
    if(gateDone) return gateDone;
    gateDone = (async ()=>{
      try {
        await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        // already idle too long since the last visit: start fresh (asks for the password again)
        await new Promise(res=>{ const off = auth.onAuthStateChanged(()=>{ off(); res(); }); });
        if(auth.currentUser && lastActive() && Date.now() - lastActive() > IDLE_MS){
          try { sessionStorage.setItem(IDLE_FLAG, '1'); } catch(e) {}
          try { await auth.signOut(); } catch(e) {}
        }
        const cred = auth.currentUser ? { user: auth.currentUser } : await new Promise((res, rej)=>{
          const off = auth.onAuthStateChanged(u=>{ off(); u ? res({ user: u }) : auth.signInAnonymously().then(res, rej); });
        });
        const uid = cred.user.uid;
        let member = false;
        try {
          const me = await fs.collection('members').doc(uid).get();
          if(me.exists){ member = true; const r = (me.data() || {}).role; role = r === 'viewer' || r === 'timer' || r === 'admin' ? r : 'editor'; }
          // logged out by the Admin (just this person) since this login? ask for the password again
          if(member){
            try {
              const kd = await fs.collection('kicks').doc(uid).get();
              const k = kd.exists ? (kd.data() || {}).at : null, j = (me.data() || {}).joinedAt;
              if(k && typeof k.toMillis === 'function' && !(j && typeof j.toMillis === 'function' && j.toMillis() > k.toMillis())){
                member = false; try { sessionStorage.setItem('falsehood-kicked-one', '1'); } catch(x) {}
              }
            } catch(e) {}
          }
          // logged in before the last "Log out all devices"? then ask for the password again
          if(member){
            try {
              const sd = await fs.doc('meta/session').get();
              if(await staleLogin(uid, sd.exists ? sd.data() : null)){ member = false; try { sessionStorage.setItem(KICK_FLAG, '1'); } catch(e) {} }
            } catch(e) { if(e && e.code === 'permission-denied'){ member = false; try { sessionStorage.setItem(KICK_FLAG, '1'); } catch(x) {} } }
          }
        } catch(e) { member = false; }
        if(!member){
          if(document.readyState === 'loading') await new Promise(r=> document.addEventListener('DOMContentLoaded', r, { once:true }));
          const r = await askPassword(uid, false);
          if(r){ member = true; role = r; }
        }
        window.FALSEHOOD_ROLE = role;
        if(member){ errReady = true; errFlush(); }
        if(member){ window.FALSEHOOD_FS = fs; window.FALSEHOOD_UID = uid; }
        if(member && role === 'viewer') document.body.classList.add('viewonly');
        if(member && role === 'timer') document.body.classList.add('storage-ro');
        if(member){ await ensureNick(uid); showRole(); startPresence(uid); startIdleWatch(); watchSession(uid); watchKick(uid); }
        if(member && role !== 'admin') document.body.classList.add('no-delete');   // only the Admin deletes Storage items
        return member ? uid : null;
      } catch(e) {
        console.warn('Firebase sign-in failed', e);
        window.FALSEHOOD_FB_ERROR = (e && (e.code || e.message)) || 'unknown';
        return null;
      }
    })();
    return gateDone;
  }

  // name for the one account id carried over from the old Claude board (shows on old Storage history)
  const names = { u_neI6SlIzY8TC2nT6VWMOPA: 'Scrumzilla' };
  let namesOn = false;
  function watchNames(){
    if(namesOn) return; namesOn = true;
    fs.collection('names').onSnapshot(s=>{
      s.docs.forEach(d=>{ names[d.id] = (d.data() || {}).name; });
      try { window.dispatchEvent(new CustomEvent('falsehood-names', { detail: names })); } catch(e) {}
    }, ()=>{});
  }
  window.claude = {
    async use(what){
      const uid = await ready();
      if(!uid) return null;
      watchNames();
      if(what === 'db') return fs;
      if(what === 'user') return {
        id: async ()=> uid,
        can: async ()=> role !== 'viewer',
        profiles: async ids=>{
          const out = {};
          ids.forEach(id=>{ out[id] = { name: names[id] || null, isMe: id === uid }; });
          return out;
        },
      };
      return null;
    },
  };
})();
</script>
