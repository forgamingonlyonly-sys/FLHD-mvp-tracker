<!-- Night scene behind the tracker (dark theme): the guild artwork, kept dark in the middle so the MVP list stays readable -->
<style>
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#05020a}
:root[data-theme="light"] #scene{display:none}
#scene .art{position:absolute;inset:0;background:#05020a url("bg.webp") 62% 40% / cover no-repeat;
  filter:saturate(1.05)}
@media (max-width:820px){#scene .art{background-image:url("bg-small.webp");background-position:78% 30%}}
/* dark, calm middle where the timers are; the artwork shows at the edges and top */
#scene .shade{position:absolute;inset:0;background:
  radial-gradient(ellipse 46% 62% at 50% 58%,rgba(5,2,10,.86) 0%,rgba(5,2,10,.62) 55%,rgba(5,2,10,0) 100%),
  linear-gradient(180deg,rgba(5,2,10,.15) 0%,rgba(5,2,10,.45) 45%,rgba(5,2,10,.78) 100%)}
#scene .top{position:absolute;left:0;right:0;top:0;height:150px;background:linear-gradient(180deg,rgba(5,2,10,.72),rgba(5,2,10,.35) 60%,transparent)}
#scene .edge{position:absolute;inset:0;background:radial-gradient(ellipse 110% 95% at 50% 40%,transparent 60%,rgba(2,1,5,.7) 100%)}

/* translucent black / deep-purple panels over the artwork (dark theme) */
:root:not([data-theme="light"]) body{background:#05020a}
:root:not([data-theme="light"]) body::before{display:none}
:root:not([data-theme="light"]){
  --surface:rgba(12,7,22,.66);--surface-2:rgba(22,13,38,.74);--border:rgba(120,80,190,.28);
  --row-waiting:rgba(30,24,10,.7);--row-window:rgba(10,32,22,.7);--row-overdue:rgba(38,10,24,.72)}
:root:not([data-theme="light"]) .item{box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.35)}
/* pop-ups and menus stay solid so they're easy to read over the list */
.alert-panel,.row-menu,.modal,#mvpTip{background:#150d24!important;border-color:rgba(150,100,230,.45)!important;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.4)!important}
.alert-panel .ap-switch:hover,.row-menu button:hover{background:#21153a}
/* the big panels get a soft frosted blur (only a few, so it stays light on the PC) */
:root:not([data-theme="light"]) .nextup,:root:not([data-theme="light"]) .bebar,:root:not([data-theme="light"]) .ctl-bar,:root:not([data-theme="light"]) .tabs{
  background:rgba(12,7,22,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
/* Next Spawns: bright glowing frame, the artwork shows through on the right */
:root:not([data-theme="light"]) .nextup.nu-hero{border:1.5px solid #9b4dff;
  background:linear-gradient(90deg,rgba(8,4,16,.9) 0%,rgba(8,4,16,.74) 50%,rgba(8,4,16,.3) 100%);
  -webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);
  box-shadow:0 0 0 1px rgba(200,150,255,.18) inset,0 0 14px rgba(155,77,255,.75),0 0 40px rgba(120,50,230,.4)}
:root:not([data-theme="light"]) .nu-hero .nu-label br{display:none}
:root:not([data-theme="light"]) .nu-hero .nu-label{white-space:nowrap;word-spacing:.35em;color:#ffc93d;text-shadow:0 0 10px rgba(255,190,60,.45)}
:root:not([data-theme="light"]) .nu-hero .nu-label svg{stroke:#ffc93d;filter:drop-shadow(0 0 5px rgba(255,190,60,.5))}
:root:not([data-theme="light"]) .nu-hero .nu-item{border-left:1px solid rgba(155,77,255,.38)}
:root:not([data-theme="light"]) .nu-hero .nu-name{color:#fff}
:root:not([data-theme="light"]) .nu-hero .nu-time{font:800 25px/1.15 Inter,system-ui,sans-serif;color:#ffc93d;letter-spacing:.01em;text-shadow:0 0 12px rgba(255,180,40,.45)}
:root:not([data-theme="light"]) .nu-hero .pt-card img{filter:drop-shadow(0 0 6px rgba(170,110,255,.55))}
@media (max-width:700px){:root:not([data-theme="light"]) .nu-hero .nu-item{border-left:0;border-top:1px solid rgba(155,77,255,.3)}
  :root:not([data-theme="light"]) .nextup.nu-hero{background:linear-gradient(180deg,rgba(8,4,16,.88),rgba(8,4,16,.62))}}
/* Boss Event bar: glowing frame like Next Spawns — orange fire while the boss is up, soft purple once it's killed */
:root:not([data-theme="light"]) .bebar{border:1.5px solid #ff8a2a;border-left-width:1.5px;
  background:linear-gradient(90deg,rgba(28,10,4,.9) 0%,rgba(16,6,10,.78) 55%,rgba(8,4,16,.45) 100%);
  box-shadow:0 0 0 1px rgba(255,190,120,.16) inset,0 0 14px rgba(255,122,30,.7),0 0 40px rgba(255,90,20,.32);animation:beGlow 2.6s ease-in-out infinite}
:root:not([data-theme="light"]) .bebar .nu-label{background:linear-gradient(180deg,#ffb35c,#ff7a1e);color:#3a1204;box-shadow:0 0 10px rgba(255,140,40,.55)}
:root:not([data-theme="light"]) .bebar.is-dead,:root:not([data-theme="light"]) .bebar.is-none{border-color:rgba(155,77,255,.55);animation:none;
  background:linear-gradient(90deg,rgba(8,4,16,.88) 0%,rgba(8,4,16,.7) 55%,rgba(8,4,16,.35) 100%);
  box-shadow:0 0 0 1px rgba(200,150,255,.1) inset,0 0 10px rgba(155,77,255,.4),0 0 26px rgba(120,50,230,.18)}
:root:not([data-theme="light"]) .bebar.is-dead .nu-label,:root:not([data-theme="light"]) .bebar.is-none .nu-label{background:rgba(155,77,255,.22);color:#e6d6ff;box-shadow:none}
/* bigger Boss Event card: more room, larger name / map / timer and picture */
.bebar{padding:13px 18px!important;min-height:52px;gap:12px!important}
.bebar .nu-label{font-size:11.5px;padding:5px 12px}
.bebar .nu-name{font-size:17px;font-weight:800}
.bebar .be-map{font-size:14px}
.bebar .be-up{font-size:19px;font-weight:800}
.bebar .be-ago,.bebar .sep{font-size:14px}
.bebar .pt-bar,.bebar .pt-bar img{width:38px!important;height:38px!important}
.bebar .be-acts .btn{font-size:13.5px;padding:6px 14px}
@media (max-width:700px){.bebar{padding:11px 13px!important}.bebar .nu-name{font-size:16px}.bebar .be-up{font-size:17px}}
@keyframes beGlow{0%,100%{box-shadow:0 0 0 1px rgba(255,190,120,.16) inset,0 0 12px rgba(255,122,30,.6),0 0 34px rgba(255,90,20,.26)}50%{box-shadow:0 0 0 1px rgba(255,190,120,.22) inset,0 0 18px rgba(255,140,40,.85),0 0 48px rgba(255,100,20,.4)}}
@media (prefers-reduced-motion:reduce){:root:not([data-theme="light"]) .bebar{animation:none}}
/* tabs: raised dark-metal plaques; the open tab gets a gold rim and gold text */
.tabs{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;gap:8px}
.tab{border-radius:8px!important;padding:10px 18px!important;color:#cfc4df;font-family:Cinzel,serif;font-weight:700;letter-spacing:.1em;
  background:linear-gradient(180deg,#3a3148 0%,#231b30 50%,#17111f 100%)!important;border:1px solid #4a3d5e;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.6)!important}
.tab:hover{border-color:#6b5a8c;color:#f1ecf8}
.tab.active{color:#ffe08a!important;border-color:#e3a21a;background:linear-gradient(180deg,#4a2f7a 0%,#2c1650 55%,#1b0d33 100%)!important;
  box-shadow:inset 0 1px 0 rgba(255,230,160,.35),0 0 0 1px rgba(227,162,26,.5),0 0 14px rgba(255,190,60,.35)!important;text-shadow:0 0 8px rgba(255,190,60,.5)}
.tab .count,.tab.active .count{background:rgba(0,0,0,.35)!important;color:inherit!important;font-family:Inter,system-ui,sans-serif}
@media (max-width:560px){.tabs{gap:5px;flex-wrap:nowrap!important}.tab{padding:7px 9px!important;letter-spacing:.03em;font-size:12px!important;gap:5px!important}.tab .tab-ic{width:14px!important;height:14px!important}.tab .count{padding:0 5px!important;font-size:10.5px}}
/* status counts: one raised metal HUD panel (matches the tabs), coloured glowing numbers; metal buttons */
.toolbar-right .summary{background:linear-gradient(180deg,#3a3148 0%,#231b30 50%,#17111f 100%)!important;border:1px solid #4a3d5e!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.6)!important;border-radius:8px!important;gap:0!important;overflow:hidden!important}
.toolbar-right .summary .chip{background:transparent!important;border:0!important;border-right:1px solid rgba(0,0,0,.55)!important;box-shadow:1px 0 0 rgba(255,255,255,.06);height:34px!important;padding:0 12px!important;font-family:Cinzel,serif;font-weight:700;letter-spacing:.05em;color:#cfc4df}
.toolbar-right .summary .chip:last-child{border-right:0!important;box-shadow:none}
.toolbar-right .summary .chip b{font-family:Inter,system-ui,sans-serif;font-size:15px}
.toolbar-right .summary .chip:nth-child(1) b{color:#2fbf71;text-shadow:0 0 8px rgba(47,191,113,.6)}
.toolbar-right .summary .chip:nth-child(1) .dot{box-shadow:0 0 6px #2fbf71}
.toolbar-right .summary .chip:nth-child(2) b{color:#e0a100;text-shadow:0 0 8px rgba(224,161,0,.6)}
.toolbar-right .summary .chip:nth-child(2) .dot{box-shadow:0 0 6px #e0a100}
.toolbar-right .summary .chip:nth-child(3) b{color:#e2405c;text-shadow:0 0 8px rgba(226,64,92,.6)}
.toolbar-right .summary .chip:nth-child(3) .dot{box-shadow:0 0 6px #e2405c}
.toolbar-right .summary .chip:nth-child(4) b{color:#8f82a6;text-shadow:0 0 8px rgba(143,130,166,.6)}
.toolbar-right .summary .chip:nth-child(4) .dot{box-shadow:0 0 6px #8f82a6}
#compactBtn,#resetAllBtn,#undoResetBtn{background:linear-gradient(180deg,#3a3148 0%,#231b30 50%,#17111f 100%)!important;border:1px solid #4a3d5e!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.6)!important;border-radius:8px!important;height:34px!important;font-family:Cinzel,serif;font-weight:700;letter-spacing:.06em;color:#cfc4df!important}
#compactBtn:hover{border-color:#6b5a8c!important;color:#f1ecf8!important}
#resetAllBtn{border-color:#7a3446!important;color:#ffb3c0!important}
#undoResetBtn{border-color:#e3a21a!important;color:#ffe08a!important}
@media (max-width:760px){.toolbar-right .summary .chip{padding:0 6px!important;letter-spacing:.02em;font-size:11px}.toolbar-right .summary .chip b{font-size:13.5px}}
@media (max-width:480px){.toolbar-right .summary .chip{padding:0 4px!important;letter-spacing:0;font-size:10px;gap:3px!important;min-width:0}.toolbar-right .summary .chip .dot{width:6px;height:6px}.toolbar-right .summary .chip b{font-size:12.5px}}
/* MVP rows: gold-framed dark metal with a glowing status bar on the left and gold gothic names;
   rows with no timer (Unknown) are dimmed so the live ones stand out (full brightness on hover); timer sizes unchanged */
.item{background:linear-gradient(180deg,rgba(46,36,62,.94),rgba(18,12,28,.94))!important;border:1px solid rgba(227,162,26,.35)!important;border-left:1px solid rgba(227,162,26,.35)!important;border-radius:10px!important;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,230,160,.12),0 3px 10px rgba(0,0,0,.55)!important;position:relative}
.item::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:#4a3d5e;pointer-events:none}
.item.s-window::before{background:#2fbf71;box-shadow:0 0 8px #2fbf71}
.item.s-waiting::before{background:#e0a100;box-shadow:0 0 8px #e0a100}
.item.s-overdue::before{background:#e2405c;box-shadow:0 0 8px #e2405c}
.item .mvp-name{font-family:Cinzel,serif;font-weight:700;color:#ffe9b0;letter-spacing:.03em}
.item.fav{border-color:rgba(255,210,87,.75)!important}
.item.s-unknown{opacity:.55;filter:saturate(.6);transition:opacity .15s,filter .15s}
.item.s-unknown:hover,.item.s-unknown:focus-within{opacity:1;filter:none}
/* 3D icons: beveled metal strokes (gold / silver / purple) with a light top edge and a shadow below */
.tab-ic svg,.nu-hero .nu-label svg,.pin,.st-ic svg{
  filter:drop-shadow(0 -.6px 0 rgba(255,245,220,.55)) drop-shadow(0 1.4px .6px rgba(0,0,0,.85)) drop-shadow(0 0 3px rgba(0,0,0,.4))}
.tab-ic svg{stroke:url(#ic3dSilver);stroke-width:2.2}
.tab-ic svg circle[r="1.4"]{fill:url(#ic3dSilver)}
.tab.active .tab-ic svg{stroke:url(#ic3dGold)}
.tab.active .tab-ic svg circle[r="1.4"]{fill:url(#ic3dGold)}
.nu-hero .nu-label svg{stroke:url(#ic3dGold)!important;stroke-width:2.4;filter:drop-shadow(0 -.6px 0 rgba(255,250,225,.7)) drop-shadow(0 1.6px .6px rgba(0,0,0,.9)) drop-shadow(0 0 6px rgba(255,180,40,.45))!important}
.pin{stroke:url(#ic3dPurple);stroke-width:2.3}
.st-ic svg{stroke:url(#ic3dGold)}
.st-stat.t-store .st-ic svg{stroke:url(#ic3dPurple)}
.st-stat.t-sold .st-ic svg{stroke:url(#ic3dGreen)}
.st-stat.t-owed .st-ic svg{stroke:url(#ic3dRed)}
.fb-role .ic svg,.fb-online .ic svg{filter:drop-shadow(0 -.5px 0 rgba(255,255,255,.45)) drop-shadow(0 1.2px .5px rgba(0,0,0,.85))}
</style>
<script>
(function(){
  const sc = document.createElement('div'); sc.id = 'scene'; sc.setAttribute('aria-hidden', 'true');
  sc.innerHTML = '<div class="art"></div><div class="shade"></div><div class="top"></div><div class="edge"></div>';
  document.body.prepend(sc);
  // shared gradients for the 3D icons (one light top edge fading to a darker bottom, like polished metal)
  const g = (id, stops)=> `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="2" x2="0" y2="22">${stops.map(([o, c])=> `<stop offset="${o}" stop-color="${c}"/>`).join('')}</linearGradient>`;
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  defs.setAttribute('width', '0'); defs.setAttribute('height', '0'); defs.setAttribute('aria-hidden', 'true'); defs.style.position = 'absolute';
  defs.innerHTML = '<defs>' + g('ic3dGold', [[0, '#fff3c4'], [.35, '#ffd257'], [.6, '#e3a21a'], [1, '#8a5a06']])
    + g('ic3dSilver', [[0, '#ffffff'], [.4, '#d9cdf0'], [.7, '#a493c9'], [1, '#6b5a94']])
    + g('ic3dPurple', [[0, '#f0dcff'], [.4, '#c48bff'], [.7, '#9142f0'], [1, '#55209c']])
    + g('ic3dGreen', [[0, '#e3ffe9'], [.4, '#7fe8a2'], [.7, '#33b864'], [1, '#17703a']])
    + g('ic3dRed', [[0, '#ffe1e6'], [.4, '#ff8c9d'], [.7, '#e2405c'], [1, '#8a1730']]) + '</defs>';
  document.body.prepend(defs);
})();
</script>
