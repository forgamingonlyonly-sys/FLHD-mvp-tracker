<!-- Night scene behind the tracker (dark theme): layered sky, moon, mountains, castle, fog and graveyard with gentle parallax -->
<style>
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;--px:0;--py:0;--sy:0;
  background:linear-gradient(180deg,#120726 0%,#1b0c36 38%,#2a1250 62%,#140a22 78%,#09060f 100%)}
:root[data-theme="light"] #scene{display:none}
#scene .sc-l{position:absolute;inset:-40px;will-change:transform;transform:translate3d(calc(var(--px)*var(--k)*1px),calc(var(--py)*var(--k)*1px - var(--sy)*var(--ks)*1px),0)}
#scene svg{position:absolute;inset:0;width:100%;height:100%}
#scene .sc-stars{--k:3;--ks:.02}
#scene .sc-stars circle{fill:#fff}
#scene .sc-stars .tw{animation:scTw 4s ease-in-out infinite}
@keyframes scTw{0%,100%{opacity:.25}50%{opacity:1}}
#scene .sc-moon{--k:6;--ks:.04}
#scene .moon{position:absolute;right:13%;top:7%;width:min(190px,22vw);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#fbf6ff 0%,#e6d8ff 34%,#b9a0f0 70%,#8a6ad4 100%);
  box-shadow:0 0 50px 12px rgba(190,150,255,.45),0 0 160px 60px rgba(140,90,240,.25),inset -18px -14px 40px rgba(70,40,140,.55)}
#scene .moon i{position:absolute;border-radius:50%;background:rgba(120,90,190,.28);box-shadow:inset 2px 2px 4px rgba(60,30,120,.35)}
#scene .sc-far{--k:10;--ks:.06;filter:blur(1.2px)}
#scene .sc-far2{--k:14;--ks:.08;filter:blur(.6px)}
#scene .sc-castle{--k:20;--ks:.1}
#scene .sc-castle .win{fill:#ffc768;opacity:.8;filter:drop-shadow(0 0 4px rgba(255,180,80,.8))}
#scene .sc-castle .win rect:nth-child(3n){animation:scFlick 5s ease-in-out infinite}
#scene .sc-castle .win rect:nth-child(4n){animation:scFlick 7s ease-in-out infinite reverse}
@keyframes scFlick{0%,100%{opacity:1}45%{opacity:.75}50%{opacity:.4}55%{opacity:.85}}
#scene .sc-near{--k:34;--ks:.16}
#scene .sc-near .tr path{stroke:#06030b;stroke-linecap:round;fill:none}
#scene .fog{position:absolute;left:0;width:200%;pointer-events:none;animation:scFog 140s linear infinite}
#scene .fog.f1{top:52%;height:22%;opacity:.55;background:radial-gradient(ellipse 18% 50% at 10% 50%,rgba(170,130,230,.35),transparent 70%),radial-gradient(ellipse 22% 45% at 35% 55%,rgba(150,110,220,.28),transparent 70%),radial-gradient(ellipse 16% 50% at 60% 50%,rgba(170,130,230,.35),transparent 70%),radial-gradient(ellipse 22% 45% at 85% 55%,rgba(150,110,220,.28),transparent 70%)}
#scene .fog.f2{top:72%;height:24%;opacity:.5;animation-duration:95s;animation-direction:reverse;background:radial-gradient(ellipse 20% 50% at 15% 50%,rgba(120,90,190,.4),transparent 70%),radial-gradient(ellipse 18% 40% at 45% 60%,rgba(140,100,210,.3),transparent 70%),radial-gradient(ellipse 20% 50% at 65% 50%,rgba(120,90,190,.4),transparent 70%),radial-gradient(ellipse 18% 40% at 95% 60%,rgba(140,100,210,.3),transparent 70%)}
@keyframes scFog{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (max-width:700px){#scene .moon{right:auto;left:58%;top:3%;width:96px}}
#scene .vig{position:absolute;inset:0;background:radial-gradient(ellipse 90% 80% at 50% 30%,transparent 55%,rgba(5,2,10,.75) 100%)}
#scene.paused *,#scene.paused{animation-play-state:paused!important}
@media (prefers-reduced-motion: reduce){#scene *{animation:none!important}#scene .sc-l{transform:none!important}}
/* the scene shows through the panels a little (dark theme) */
:root:not([data-theme="light"]) body{background:#09060f}
:root:not([data-theme="light"]) body::before{display:none}
:root:not([data-theme="light"]){--surface:rgba(21,16,32,.9);--surface-2:rgba(30,23,44,.92);--row-waiting:rgba(30,26,14,.92);--row-window:rgba(14,36,24,.92);--row-overdue:rgba(40,14,26,.93)}
:root:not([data-theme="light"]) .item,:root:not([data-theme="light"]) .nextup{box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35)}
</style>

    addEventListener('scroll', ()=> sc.style.setProperty('--sy', Math.min(scrollY, 1500).toFixed(0)), { passive: true });
  }
  // nothing animates while the tab is in the background (keeps the PC free for Auto-detect)
  const vis = ()=> sc.classList.toggle('paused', document.visibilityState !== 'visible');
  document.addEventListener('visibilitychange', vis); vis();
})();
</script>
