<!-- Auto-detect: share the Ragnarok window; the tracker reads "… has killed [MVP] at Map." announcements and logs the kill -->
<style>
.kd-btn{display:inline-flex;align-items:center;gap:6px;margin-left:6px;font:600 11px Inter,system-ui,sans-serif;letter-spacing:.04em;padding:3px 10px;border-radius:999px;border:1px solid rgba(127,110,150,.45);background:transparent;color:inherit;cursor:pointer;vertical-align:middle;white-space:nowrap}
.kd-btn:hover{border-color:#b77ee8}
.kd-btn .kd-dot{width:7px;height:7px;border-radius:50%;background:#8f82a6}
.kd-btn.on{border-color:#2fbf71;color:#2fbf71}
.kd-btn.on .kd-dot{background:#2fbf71;box-shadow:0 0 0 3px rgba(47,191,113,.2);animation:kdPulse 1.6s ease-in-out infinite}
.kd-btn.busy .kd-dot{background:#e0a100}
@keyframes kdPulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.kd-btn.on .kd-dot{animation:none}}
.kd-pop{position:fixed;z-index:9998;width:min(340px,calc(100vw - 16px));background:#1b1426;color:#f1ecf8;border:1px solid #3b2d52;border-radius:12px;padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.45);font:13px Inter,system-ui,sans-serif}
.kd-pop[hidden]{display:none!important}
.kd-pop h4{margin:0 0 6px;font:700 14px Cinzel,serif;letter-spacing:.03em}
.kd-pop p{margin:0 0 10px;color:#b9aecb;font-size:12.5px;line-height:1.45}
.kd-pop .kd-status{font-size:12px;color:#9d8fb3;margin-bottom:8px}
.kd-pop .kd-diag{font-size:11.5px;color:#8f82a6;margin:-2px 0 8px;line-height:1.4;word-break:break-word}
.kd-pop .kd-area{font-size:12px;color:#cfc4df;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.kd-pop .kd-area button{padding:3px 10px;border-radius:8px;border:1px solid #4a3a63;background:#2a2233;color:#f6f3fb;font:600 12px Inter,system-ui,sans-serif;cursor:pointer}
.kd-pick{position:fixed;inset:0;z-index:9999;background:rgba(10,6,18,.82);display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif}
.kd-pick-card{background:#1b1426;color:#f1ecf8;border:1px solid #3b2d52;border-radius:14px;padding:14px;display:grid;gap:8px;max-width:94vw}
.kd-pick-card>b{font:700 16px Cinzel,serif}
.kd-pick-card>span{font-size:12.5px;color:#b9aecb}
.kd-pick-stage{position:relative;cursor:crosshair;touch-action:none;line-height:0}
.kd-pick-stage canvas{border-radius:6px;max-width:100%}
.kd-pick-rect{position:absolute;border:2px solid #2fbf71;background:rgba(47,191,113,.15);box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
.kd-pick-rect[hidden]{display:none}
.kd-pick-acts{display:flex;gap:8px;justify-content:flex-end}
.kd-pick-acts button{padding:8px 14px;border-radius:9px;border:1px solid #4a3a63;background:#2a2233;color:#f6f3fb;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.kd-pick-acts .kd-pick-ok{background:#a02ab8;border-color:#c03bd6}
.kd-pick-acts button:disabled{opacity:.5;cursor:default}
.kd-pop .kd-log{max-height:220px;overflow:auto;border-top:1px solid #3b2d52;padding-top:6px}
.kd-pop .kd-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:12.5px}
.kd-pop .kd-row small{color:#8f82a6;white-space:nowrap}
.kd-pop .kd-row.ok b{color:#7be0a5}
.kd-pop .kd-row.skip b{color:#e0c27a}
.kd-pop .kd-row.miss b{color:#ff9aa8}
.kd-pop .kd-none{color:#8f82a6;font-size:12px;padding:4px 0}
.kd-pop .kd-acts{display:flex;gap:8px;margin-top:10px}
.kd-pop button.kd-go{flex:1;padding:8px 12px;border-radius:9px;border:1px solid #c03bd6;background:#a02ab8;color:#fff;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.kd-pop button.kd-stop{flex:1;padding:8px 12px;border-radius:9px;border:1px solid #6b3b4a;background:#3a1f29;color:#ffb3c0;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
</style>
<script>
(function(){
  if(!window.FALSEHOOD_FIREBASE) return;
  const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  const SCAN_MS = 1500, SAME_KILL_MS = 5 * 60000;

  // ---------- reading the announcement ----------
  // Poring World announcements are bright green: about rgb(130, 245, 120)
  // Poring World kill lines are one exact green: about rgb(140, 255, 123). Matching that shade tightly
  // ignores grass, trees and other green things on screen.
  const isAnn = (r, g, b)=> g >= 225 && r >= 110 && r <= 170 && b >= 95 && b <= 150 && g - r >= 75;
  const SCALE = 4;
  let tessP = null, worker = null;
  function loadOCR(){
    if(tessP) return tessP;
    tessP = new Promise((res, rej)=>{
      if(window.Tesseract) return res();
      const s = document.createElement('script'); s.src = TESS_URL; s.onload = res; s.onerror = ()=> rej(new Error('Couldn’t load the text reader'));
      document.head.appendChild(s);
    }).then(async ()=>{
      worker = await Tesseract.createWorker('eng');
      await worker.setParameters({ tessedit_pageseg_mode: '7', preserve_interword_spaces: '1',
        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789[]().,\'-_ ' });
      return worker;
    });
    tessP.catch(()=>{ tessP = null; });
    return tessP;
  }

  // find each line of kill-green text and return it as a clean black-on-white picture, one line per picture
  function findLines(img){
    const W = img.width, H = img.height, d = img.data;
    const mask = new Uint8Array(W * H), rows = new Uint32Array(H);
    for(let y = 0, i = 0; y < H; y++){
      let c = 0;
      for(let x = 0; x < W; x++, i += 4){
        if(isAnn(d[i], d[i+1], d[i+2])){ mask[y*W + x] = 1; c++; }
      }
      rows[y] = c;
    }
    // lines = runs of rows that contain green, split wherever a blank row (or a near-blank one) separates them
    const runs = [];
    let y0 = -1;
    for(let y = 0; y <= H; y++){
      const on = y < H && rows[y] >= 2;
      if(on && y0 < 0) y0 = y;
      if(!on && y0 >= 0){ runs.push([y0, y - 1]); y0 = -1; }
    }
    // join tiny pieces (dots of i/j, accents) to the line right below/above them
    const lines = [];
    for(const r of runs){
      const last = lines[lines.length - 1];
      if(last && (r[0] - last[1] <= 2) && ((r[1] - r[0] < 4) || (last[1] - last[0] < 4))) last[1] = r[1];
      else lines.push(r.slice());
    }
    const out = [];
    for(const [a, b] of lines){
      if(b - a < 5 || b - a > 40) continue;                 // not a text line
      let total = 0, x0 = W, x1 = -1;
      for(let y = a; y <= b; y++) for(let x = 0; x < W; x++) if(mask[y*W + x]){ total++; if(x < x0) x0 = x; if(x > x1) x1 = x; }
      if(total < 120 || x1 - x0 < 100) continue;            // too short to be a kill line
      const pad = 4, cx0 = Math.max(0, x0 - pad), cy0 = Math.max(0, a - pad), cw = Math.min(W, x1 + pad + 1) - cx0, ch = Math.min(H, b + pad + 1) - cy0;
      // black text on white at 1x, then scaled up smoothly (soft edges read better than blocky pixels)
      const tmp = document.createElement('canvas'); tmp.width = cw + 8; tmp.height = ch + 8;
      const tx = tmp.getContext('2d'), od = tx.createImageData(tmp.width, tmp.height);
      od.data.fill(255);
      for(let y = 0; y < ch; y++) for(let x = 0; x < cw; x++)
        if(mask[(cy0 + y)*W + cx0 + x]){ const j = ((y + 4) * tmp.width + x + 4) * 4; od.data[j] = od.data[j+1] = od.data[j+2] = 0; }
      tx.putImageData(od, 0, 0);
      const cv = document.createElement('canvas'); cv.width = tmp.width * SCALE; cv.height = tmp.height * SCALE;
      const cx = cv.getContext('2d');
      cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
      cx.drawImage(tmp, 0, 0, cv.width, cv.height);
      let sig = '';
      for(let x = 0; x < cw; x += 5){ let c = 0; for(let y = 0; y < ch; y++) c += mask[(cy0 + y)*W + cx0 + x]; sig += c.toString(36); }
      out.push({ canvas: cv, sig: cw + 'x' + ch + ':' + sig });
    }
    return out;
  }

  // "[Name] of Guild [Guild] has killed [Maya] at Ant Hell F2."
  function parseLine(raw){
    const t = String(raw || '').replace(/\s+/g, ' ').trim();
    const clean = s=> s.replace(/^[\[\]\(\)\{\}|<>"'`.:;,\s]+|[\[\]\(\)\{\}|<>"'`.:;,\s]+$/g, '');
    const who = /^(.*?)\s+o[ft]\s+Gu?[il1|]{1,2}d\s+(.*?)\s+ha[s5]\s/i.exec(t);
    const k = /has\s*k\s*[il1|!]{1,3}\s*[il1|!]?\s*e\s*d\s*(.+?)\s+at\s+(.+?)\s*[.,:;]*$/i.exec(t);
    if(k) return { mvp: clean(k[1]), map: clean(k[2]), killer: who ? clean(who[1]) : '', guild: who ? clean(who[2]) : '', text: t };
    // forgiving read 1: the MVP is the last [ … ] in the line, the map is what follows it
    const groups = [...t.matchAll(/[\[\(\{|]\s*([^\[\]\(\)\{\}|]{2,40}?)\s*[\]\)\}|]/g)];
    if(groups.length >= 2 || (groups.length && /k[hil1|]|ha[s5]|gu[il1]/i.test(t))){
      const g = groups[groups.length - 1];
      const after = t.slice(g.index + g[0].length).replace(/^[\s.,:;'"-]*(a[a-z]?\s+)?/i, '');
      return { mvp: clean(g[1]), map: clean(after), killer: groups.length >= 3 ? clean(groups[0][1]) : (who ? clean(who[1]) : ''), guild: groups.length >= 3 ? clean(groups[1][1]) : (who ? clean(who[2]) : ''), text: t, loose: true, after: g[1] + ' ' + after };
    }
    // forgiving read 2: OCR slipped on "has killed" or "at" — find the words by shape instead
    const toks = t.split(' ');
    let ki = toks.findIndex(w=> sim(w, 'killed') >= 0.6 || /k\S{2,4}ed/i.test(w));
    if(ki < 0){ const gi = toks.findIndex(w=> sim(w, 'guild') >= 0.6); if(gi < 0 || !/kil|has|ha5/i.test(t)) return null; ki = gi; }
    let ai = -1;
    for(let i = toks.length - 1; i > ki; i--) if(/^(at|al|af|a[t1l]\.?)$/i.test(toks[i])){ ai = i; break; }
    const rest = toks.slice(ki + 1, ai > 0 ? ai : undefined).join(' ');
    const map = ai > 0 ? toks.slice(ai + 1).join(' ') : '';
    return { mvp: clean(rest), map: clean(map), killer: who ? clean(who[1]) : '', guild: who ? clean(who[2]) : '', text: t, loose: true, after: toks.slice(ki + 1).join(' ') };
  }

  // ---------- which MVP is it? ----------
  const norm = s=> String(s || '').toLowerCase().replace(/[^a-z]/g, '');
  // common OCR slips: "rn" for "m", "vv" for "w"
  function sim(a, b){
    const x = sim1(a, b), A = norm(a).replace(/rn/g, 'm').replace(/vv/g, 'w');
    return Math.max(x, sim1(A, b));
  }
  function sim1(a, b){
    a = norm(a); b = norm(b);
    if(!a || !b) return 0;
    if(a === b) return 1;
    const m = a.length, n = b.length, dp = Array.from({ length: m + 1 }, (_, i)=> [i]);
    for(let j = 1; j <= n; j++) dp[0][j] = j;
    for(let i = 1; i <= m; i++) for(let j = 1; j <= n; j++)
      dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return 1 - dp[m][n] / Math.max(m, n);
  }
  const ALIASES = {
    moonlight: ['Moonlight Flower', 'Moonlight'], lod: ['Lord of Death', 'Lord of the Dead'],
    samurai: ['Incantation Samurai', 'Samurai Specter'], garm: ['Garm', 'Hatii'], amonra: ['Amon Ra', 'Amonra'],
    gtb: ['Golden Thief Bug'], evil_snake: ['Evil Snake Lord'], doppel: ['Doppelganger'], stormy: ['Stormy Knight', 'Knight of Windstorm'],
    turtle_general: ['Turtle General'], dark_lord: ['Dark Lord'], orc_hero: ['Orc Hero'], orc_lord: ['Orc Lord'],
  };
  // MVPs that share a name: pick by the map in the announcement
  const FAMILIES = [
    { names: ['Baphomet'], pick: map=> /glast|gl_|church|heim/i.test(map) ? 'bapho_gh' : 'bapho_maze' },
    { names: ['Ghostring'], pick: map=> /sunken|ship|treasure/i.test(map) ? 'ghost_sunken' : 'ghost_poring' },
    { names: ['Angeling'], pick: map=> /magma/i.test(map) ? 'angel_magma' : /toy/i.test(map) ? 'angel_toy' : /mjol|mjöl/i.test(map) ? 'angel_mjolnir' : 'angel_poring' },
    { names: ['Deviling'], pick: ()=> 'devil_magma' },
    { names: ['Archangeling', 'Arcangeling', 'Arcangel'], pick: ()=> 'arch_magma' },
  ];
  const FAMILY_OF = { bapho_maze: 0, bapho_gh: 0, ghost_sunken: 1, ghost_poring: 1, angel_magma: 2, angel_toy: 2, angel_mjolnir: 2, angel_poring: 2, devil_magma: 3, arch_magma: 4 };
  const placeOf = m=> String(m.location || '').replace(/\s*\(.*$/, '');
  // name (and, when readable, the map) decide which MVP it is; a shaky name is accepted when the map agrees
  function matchMvp(name, map, withScore){
    const list = (typeof mvps !== 'undefined' ? mvps : []);
    let best = null, bestS = 0;
    for(const m of list){
      const fam = FAMILY_OF[m.id];
      if(fam !== undefined && FAMILIES[fam].pick(map || '') !== m.id) continue;   // e.g. Baphomet at Glast Heim → Baphomet GH
      const names = [m.name].concat(ALIASES[m.id] || [], fam !== undefined ? FAMILIES[fam].names : []);
      let nS = 0; for(const n of names) nS = Math.max(nS, sim(name, n));
      const mS = map ? sim(map, placeOf(m)) : 0;
      const ok = nS >= 0.72 || (nS >= 0.5 && mS >= 0.6);
      const sc = nS + (mS >= 0.6 ? 0.2 * mS : 0);
      if(ok && sc > bestS){ bestS = sc; best = m; }
      if(withScore && !ok && nS > bestS - 0.3 && nS >= 0.6 && !best){ /* keep looking */ }
    }
    if(withScore) return best ? { mvp: best, score: bestS } : null;
    return best;
  }

  // ---------- capture loop ----------
  let stream = null, track = null, grabber = null, video = null, ticker = null, busy = false;
  const seenSig = new Map(), recent = new Map(), log = [], seenKill = new Map();
  const GONE_MS = 3 * 60000;    // a kill line must be gone this long before the same line counts again
  let warm = false;             // the first read after Start only notes what's already in chat
  let lastScan = 0, status = '', lastFrameSize = null;
  const AREA_KEY = 'falsehood-kd-chat';
  // default: the whole bottom strip, so the chat box is found whether it's bottom-left, middle or right
  const DEFAULT_AREA = { x: 0, y: 0.7, w: 1, h: 0.3 };
  let area = (()=>{ try { const a = JSON.parse(localStorage.getItem(AREA_KEY) || 'null'); return a && a.w > 0 && a.h > 0 ? a : null; } catch(e) { return null; } })() || DEFAULT_AREA;
  const areaIsDefault = ()=> area === DEFAULT_AREA;
  // the watcher drags a box around their chat window once; only that part is read
  async function pickArea(){
    const f = await frame();
    if(!f){ alert('Start auto-detect and share the Ragnarok window first.'); return; }
    const W = f.width || f.videoWidth, H = f.height || f.videoHeight;
    const shot = document.createElement('canvas'); shot.width = W; shot.height = H; shot.getContext('2d').drawImage(f, 0, 0, W, H);
    if(f.close) f.close();
    const ov = document.createElement('div'); ov.className = 'kd-pick';
    ov.innerHTML = `<div class="kd-pick-card"><b>Drag a box around your chat window</b><span>Only the green kill lines inside this box are read. Include the whole chat area.</span>
      <div class="kd-pick-stage"><canvas></canvas><div class="kd-pick-rect" hidden></div></div>
      <div class="kd-pick-acts"><button type="button" class="kd-pick-cancel">Cancel</button><button type="button" class="kd-pick-ok" disabled>Use this area</button></div></div>`;
    document.body.appendChild(ov);
    const cv = ov.querySelector('canvas'), stage = ov.querySelector('.kd-pick-stage'), rect = ov.querySelector('.kd-pick-rect'), ok = ov.querySelector('.kd-pick-ok');
    const scale = Math.min(1, (innerWidth * 0.9) / W, (innerHeight * 0.68) / H);
    cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
    cv.getContext('2d').drawImage(shot, 0, 0, cv.width, cv.height);
    let sel = area ? { x: area.x * cv.width, y: area.y * cv.height, w: area.w * cv.width, h: area.h * cv.height } : null, drag = null;
    const draw = ()=>{ if(!sel || sel.w < 4 || sel.h < 4){ rect.hidden = true; ok.disabled = true; return; }
      rect.hidden = false; ok.disabled = false; Object.assign(rect.style, { left: sel.x + 'px', top: sel.y + 'px', width: sel.w + 'px', height: sel.h + 'px' }); };
    const pos = e=>{ const r = cv.getBoundingClientRect(); return { x: Math.max(0, Math.min(cv.width, e.clientX - r.left)), y: Math.max(0, Math.min(cv.height, e.clientY - r.top)) }; };
    stage.addEventListener('pointerdown', e=>{ e.preventDefault(); stage.setPointerCapture(e.pointerId); drag = pos(e); sel = { x: drag.x, y: drag.y, w: 0, h: 0 }; draw(); });
    stage.addEventListener('pointermove', e=>{ if(!drag) return; const p = pos(e); sel = { x: Math.min(p.x, drag.x), y: Math.min(p.y, drag.y), w: Math.abs(p.x - drag.x), h: Math.abs(p.y - drag.y) }; draw(); });
    stage.addEventListener('pointerup', ()=>{ drag = null; });
    draw();
    ov.querySelector('.kd-pick-cancel').onclick = ()=> ov.remove();
    ok.onclick = ()=>{
      area = { x: sel.x / cv.width, y: sel.y / cv.height, w: sel.w / cv.width, h: sel.h / cv.height };
      try { localStorage.setItem(AREA_KEY, JSON.stringify(area)); } catch(e) {}
      seenSig.clear(); seenKill.clear(); warm = false;      // whatever is in chat right now counts as old
      ov.remove();
      addLog('ok', 'Chat area set', 'Only kills in your chat box are read');
      status = 'Watching'; paintBtn();
    };
  }
  const diag = { size: '', black: false, lines: 0, lastLineAt: 0, lastText: '', lastTextAt: 0 };

  function addLog(kind, title, sub){
    log.unshift({ kind, title, sub, at: Date.now() });
    if(log.length > 30) log.pop();
    paintPop();
  }
  async function frame(){
    if(grabber){
      try { return await Promise.race([grabber.grabFrame(), new Promise((_, rej)=> setTimeout(()=> rej(new Error('timeout')), 3000))]); }
      catch(e) { if(!video){ video = document.createElement('video'); video.muted = true; video.srcObject = stream; video.play().catch(()=>{}); } }
    }
    if(video && video.videoWidth) return video;
    return null;
  }
  async function scan(){
    if(busy || !track || track.readyState !== 'live') return;
    busy = true;
    try {
      const f = await frame();
      if(!f) return;
      const W = f.width || f.videoWidth, H = f.height || f.videoHeight;
      if(!W || !H) return;
      const cv = scan.cv || (scan.cv = document.createElement('canvas'));
      cv.width = W; cv.height = H;
      const cx = cv.getContext('2d', { willReadFrequently: true });
      cx.drawImage(f, 0, 0, W, H);
      if(f.close) f.close();
      lastScan = Date.now();
      lastFrameSize = [W, H];
      if(!area){ status = 'Mark your chat box to start reading kills'; return; }
      // read only the chat box the watcher marked
      const ax = Math.max(0, Math.round(area.x * W)), ay = Math.max(0, Math.round(area.y * H));
      const aw = Math.min(W - ax, Math.round(area.w * W)), ah = Math.min(H - ay, Math.round(area.h * H));
      if(aw < 40 || ah < 10){ status = 'The marked chat area is too small. Mark it again.'; return; }
      const img = cx.getImageData(ax, ay, aw, ah);
      // a fully black picture usually means Ragnarok is in full-screen mode
      let lit = 0; for(let i = 0; i < img.data.length; i += 4 * 97) if(img.data[i] + img.data[i+1] + img.data[i+2] > 30) lit++;
      diag.size = W + '×' + H + ' · reading chat area ' + aw + '×' + ah; diag.black = lit < 20;
      const lines = findLines(img);
      diag.lines = lines.length; if(lines.length) diag.lastLineAt = Date.now();
      const now = Date.now();
      for(const [k, v] of seenSig) if(now - v.at > 10 * 60000) seenSig.delete(k);
      const visible = [];
      for(const ln of lines){
        let hit = seenSig.get(ln.sig);                         // same picture as before: reuse what we read
        if(!hit){
          await loadOCR();
          const { data } = await worker.recognize(ln.canvas);
          const items = [];
          for(const row of String((data && data.text) || '').split(/\n+/)){
            const txt = row.replace(/\s+/g, ' ').trim();
            if(!txt) continue;
            diag.lastText = txt; diag.lastTextAt = Date.now();
            const p = parseLine(txt);
            if(!p){ if(/kil|has|guild/i.test(txt)) addLog('miss', 'Saw a message but couldn’t read it', txt.slice(0, 90)); continue; }
            const m = resolve(p);
            if(!m){ if(/guild|has|kil/i.test(txt)) addLog('miss', `Couldn’t match “${p.mvp}”`, [p.map, p.killer && 'by ' + p.killer].filter(Boolean).join(' · ')); continue; }
            items.push({ m, p });
          }
          hit = { items, at: now };
          seenSig.set(ln.sig, hit);
        }
        hit.at = now;
        visible.push(...hit.items);
      }
      // a kill line stays in chat for a while: only a line we haven't been seeing counts as a new kill
      for(const [id, arr] of seenKill){ const keep = arr.filter(e=> now - e.seen < GONE_MS); keep.length ? seenKill.set(id, keep) : seenKill.delete(id); }
      for(const { m, p } of visible){
        const arr = seenKill.get(m.id) || [];
        const same = arr.find(e=> (!e.killer && !p.killer) || sim(e.killer, p.killer) >= 0.5);
        if(same){ same.seen = now; continue; }
        arr.push({ killer: p.killer, seen: now }); seenKill.set(m.id, arr);
        if(warm) handleKill(p, m);
        else addLog('skip', `${m.name}: already in chat when you started`, p.killer ? 'by ' + p.killer : '');
      }
      if(worker) warm = true;
      status = diag.black
        ? '⚠ The shared window is black. Run Ragnarok in windowed mode (Alt+Enter), then Stop and Start again.'
        : 'Watching · last check ' + new Date(lastScan).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
    } catch(e) {
      status = 'Problem reading the screen: ' + ((e && e.message) || e);
    } finally { busy = false; paintBtn(); }
  }
  // slide over the words and find the best MVP name in them (for misread lines)
  function findInWords(text, map){
    const toks = String(text || '').split(/\s+/).filter(Boolean);
    let best = null, score = 0;
    for(let i = 0; i < toks.length; i++) for(let n = 1; n <= 3 && i + n <= toks.length; n++){
      const m = matchMvp(toks.slice(i, i + n).join(' '), map, true);
      if(m && m.score > score){ score = m.score; best = m.mvp; }
    }
    return score >= 0.78 ? best : null;
  }
  // last resort: the map name alone, when only one MVP lives there
  function byMap(map){
    if(!map) return null;
    const list = (typeof mvps !== 'undefined' ? mvps : []);
    const scored = list.map(m=>({ m, s: sim(map, String(m.location || '').replace(/\s*\(.*$/, '')) })).sort((a, b)=> b.s - a.s);
    if(!scored.length || scored[0].s < 0.8) return null;
    if(scored[1] && scored[1].s >= scored[0].s - 0.02) return null;     // two MVPs share that map
    return scored[0].m;
  }
  function resolve(p){
    let m = matchMvp(p.mvp, p.map);
    if(!m && p.loose) m = findInWords(p.after || p.text, p.map);
    if(!m) m = byMap(p.map);
    return m;
  }
  function handleKill(p, m){
    m = m || resolve(p);
    const who = p.killer ? `by ${p.killer}${p.guild ? ' (' + p.guild + ')' : ''}` : '';
    if(!m){ addLog('miss', `Couldn’t match “${p.mvp}”`, [p.map, who].filter(Boolean).join(' · ')); return; }
    const now = Date.now();
    if((recent.get(m.id) || 0) > now - SAME_KILL_MS || (m.lastDeath && now - m.lastDeath < SAME_KILL_MS)){
      recent.set(m.id, now);
      addLog('skip', `${m.name} already logged`, who);
      return;
    }
    let can = true;
    try { can = A.canKill(); } catch(e) {}
    if(!can){ addLog('miss', `${m.name}: you can’t log kills`, who); return; }
    recent.set(m.id, now);
    try { logKill(m, 0); } catch(e) { addLog('miss', `${m.name}: couldn’t log`, String(e && e.message || e)); return; }
    addLog('ok', `${m.name} logged`, [p.map, who].filter(Boolean).join(' · '));
    try { showToast(`📡 Auto-logged ${m.name}${p.killer ? ' — killed by ' + p.killer : ''}`); } catch(e) {}
  }

  async function start(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
      alert('Auto-detect needs Chrome or Edge on a computer.'); return;
    }
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 2, max: 5 } }, audio: false, selfBrowserSurface: 'exclude', surfaceSwitching: 'include' });
    } catch(e) { return; }   // they cancelled the share box
    track = stream.getVideoTracks()[0];
    warm = false; seenKill.clear(); seenSig.clear();
    track.addEventListener('ended', stop);
    grabber = (typeof ImageCapture !== 'undefined') ? new ImageCapture(track) : null;
    if(!grabber){ video = document.createElement('video'); video.muted = true; video.srcObject = stream; video.play().catch(()=>{}); }
    status = 'Loading the text reader…';
    paintBtn(); paintPop();
    loadOCR().then(()=>{ status = area ? 'Watching' : 'Mark your chat box to start reading kills'; paintBtn(); paintPop(); }).catch(e=>{ status = e.message; paintPop(); });

    // timers in a worker keep ticking even when this tab is in the background
    const blob = new Blob([`setInterval(()=>postMessage(0), ${SCAN_MS});`], { type: 'text/javascript' });
    ticker = new Worker(URL.createObjectURL(blob));
    ticker.onmessage = scan;
    addLog('ok', 'Auto-detect started', 'Sharing: ' + (track.label || 'screen'));
  }
  function stop(){
    if(ticker){ ticker.terminate(); ticker = null; }
    if(track){ try { track.stop(); } catch(e) {} }
    if(stream) stream.getTracks().forEach(t=>{ try { t.stop(); } catch(e) {} });
    stream = track = grabber = null;
    if(video){ video.srcObject = null; video = null; }
    status = '';
    addLog('skip', 'Auto-detect stopped', '');
    paintBtn();
  }
  window.addEventListener('beforeunload', ()=>{ if(track) stop(); });

  // ---------- UI (Admin, FLHD and Timers) ----------
  let btn = null, pop = null;
  const esc = v=> String(v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function paintBtn(){
    if(!btn) return;
    const on = !!track;
    btn.classList.toggle('on', on);
    btn.classList.toggle('busy', on && !worker);
    btn.innerHTML = `<span class="kd-dot"></span>${on ? 'Auto-detect on' : 'Auto-detect'}`;
    btn.title = on ? 'Reading kill announcements from the shared game window. Click for details.' : 'Share your Ragnarok window and kills are logged automatically';
    const st = pop && pop.querySelector('.kd-status'); if(st) st.textContent = status;
  }
  function paintPop(){
    if(!pop) return;
    const on = !!track;
    const ago = t=>{ const s = Math.floor((Date.now() - t) / 1000); return s < 60 ? s + 's ago' : Math.floor(s / 60) + 'm ago'; };
    pop.innerHTML = `<h4>📡 Auto-detect kills</h4>
      <p>${on ? 'Keep Ragnarok and this tab open, with your chat box visible. New <i>“… has killed [MVP] at …”</i> lines in chat are logged for everyone.'
              : 'Share your <b>Ragnarok game window</b>. It reads the <b>chat box along the bottom</b> of the game (left, middle or right); you can adjust the area. When a green <i>“… has killed [MVP] at …”</i> line appears in chat, the tracker logs the kill for everyone. Nothing touches the game; it only reads the picture.'}</p>
      <div class="kd-status">${esc(status || (on ? 'Watching' : 'Not running'))}</div>
      ${on ? `<div class="kd-diag">Screen ${esc(diag.size || '…')} · green lines now: ${diag.lines}${diag.lastText ? `<br>Last text read (${ago(diag.lastTextAt)}): “${esc(diag.lastText.slice(0, 110))}”` : '<br>No green announcement text seen yet'}</div>` : ''}
      <div class="kd-log">${log.length ? log.slice(0, 12).map(e=>`<div class="kd-row ${e.kind}"><span><b>${esc(e.title)}</b>${e.sub ? '<br><small>' + esc(e.sub) + '</small>' : ''}</span><small>${ago(e.at)}</small></div>`).join('') : '<div class="kd-none">No kills detected yet.</div>'}</div>
      ${on ? `<div class="kd-area">${areaIsDefault() ? '✓ Reading the bottom of the game window' : '✓ Reading your marked chat box'} <button type="button" class="kd-mark">${areaIsDefault() ? 'Adjust' : 'Change'}</button></div>` : ''}
      <div class="kd-acts">${on ? '<button type="button" class="kd-stop">■ Stop auto-detect</button>' : '<button type="button" class="kd-go">▶ Start: share game window</button>'}</div>`;
    const go = pop.querySelector('.kd-go'), st = pop.querySelector('.kd-stop');
    if(go) go.onclick = ()=>{ start(); };
    if(st) st.onclick = ()=>{ stop(); };
    const mk = pop.querySelector('.kd-mark'); if(mk) mk.onclick = ()=>{ pop.hidden = true; pickArea(); };
  }
  function mount(){
    const r = window.FALSEHOOD_ROLE;
    if(r !== 'editor' && r !== 'admin' && r !== 'timer') return;   // anyone who can log kills
    const anchor = document.querySelector('.fb-online') || document.getElementById('fbRole');
    if(!anchor || btn) return;
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'kd-btn';
    anchor.after(btn);
    pop = document.createElement('div'); pop.className = 'kd-pop'; pop.hidden = true;
    document.body.appendChild(pop);
    btn.onclick = e=>{
      e.stopPropagation();
      if(!pop.hidden){ pop.hidden = true; return; }
      paintPop(); pop.hidden = false;
      const rc = btn.getBoundingClientRect();
      pop.style.top = (rc.bottom + 6) + 'px';
      pop.style.left = Math.max(8, Math.min(rc.left, innerWidth - pop.offsetWidth - 8)) + 'px';
    };
    pop.onclick = e=> e.stopPropagation();
    document.addEventListener('click', ()=>{ if(pop) pop.hidden = true; });
    setInterval(()=>{ if(pop && !pop.hidden) paintPop(); }, 5000);
    paintBtn();
  }
  const wait = setInterval(()=>{ if(document.getElementById('fbRole')){ clearInterval(wait); setTimeout(mount, 300); } }, 500);

  window.__adParse = t=>{ const p = parseLine(t); if(!p) return null; const m = matchMvp(p.mvp, p.map) || (p.loose ? findInWords(p.after || p.text, p.map) : null) || byMap(p.map); return { mvp: p.mvp, map: p.map, killer: p.killer, loose: !!p.loose, id: m ? m.id : null }; };
  // for testing: window.__adTest(imageOrCanvas) runs one frame through the reader
  window.__adTest = async (src)=>{
    const W = src.width || src.naturalWidth, H = src.height || src.naturalHeight;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const cx = cv.getContext('2d'); cx.drawImage(src, 0, 0);
    const ax = Math.round(area.x * W), ay = Math.round(area.y * H), aw = Math.round(area.w * W), ah = Math.round(area.h * H);
    const lines = findLines(cx.getImageData(ax, ay, aw, ah));
    await loadOCR();
    const res = [];
    for(const ln of lines){ const { data } = await worker.recognize(ln.canvas); for(const row of data.text.split(/\n+/)){ const t = row.trim(); if(!t) continue; const p = parseLine(t); const m = p ? resolve(p) : null; res.push({ text: t, match: m ? m.id : null }); } }
    return res;
  };
})();
</script>
