<!-- Auto-detect: share the Ragnarok window and the tracker reads the game chat.
     Green  "[Name] of Guild [G] has killed [MVP] at Map."         -> logs that MVP's kill
     Red    "[PW2 Boss Event] X has spawned in map"                 -> Boss Event spawned
     Yellow "[PW2 Boss Event] X has been defeated in map by Y"      -> Boss Event killed
     Text is found by brightness + colour direction (survives screen-share compression), read with Tesseract,
     and each line is identified by what it says so scrolling or a moving scene behind the chat doesn't re-log it.
     The colour rules live in two places that must match: isAnn / EV_COLORS and buildMasks(). -->

<script>
(function(){
  if(!window.FALSEHOOD_FIREBASE) return;
  const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  const SCAN_MS = 1500, SAME_KILL_MS = 5 * 60000;

  // ---------- reading the announcement ----------
  // Screen sharing sends the game through video compression, which smears the colour of thin text
  // but keeps its brightness. So each text colour is matched by its exact brightness (Y) plus the
  // direction of its colour (Cb/Cr), not by exact RGB.
  //   kill green rgb(140,255,123): Y 205, colour toward green
  //   event red  rgb(255,0,0):     Y 76,  colour toward red
  //   event yellow rgb(255,255,0): Y 225, colour toward yellow
  const ycc = (r, g, b)=>{ const y = 0.299*r + 0.587*g + 0.114*b; return [y, (b - y)*0.564 + 128, (r - y)*0.713 + 128]; };
  const isAnn = (r, g, b)=>{ const [y, cb, cr] = ycc(r, g, b); return y >= 197 && y <= 213 && cb <= 120 && cr <= 120; };
  // "[PW2 Boss Event]" lines that update the Boss Event row:
  // red "X has spawned in map" (boss is up now) and yellow "X has been defeated in map by Y" (died now)
  const EV_COLORS = [
    (r, g, b)=>{ const [y, cb, cr] = ycc(r, g, b); return y >= 68 && y <= 84 && cr >= 150 && cb >= 80 && cb <= 122; },
    (r, g, b)=>{ const [y, cb, cr] = ycc(r, g, b); return y >= 217 && y <= 233 && cb <= 100 && cr >= 128; },
  ];
  const SCALE = 4;
  let tessP = null, worker = null;
  function loadOCR(){
    if(tessP) return tessP;
    tessP = new Promise((res, rej)=>{
      if(window.Tesseract) return res();
      const s = document.createElement('script'); s.src = TESS_URL; s.onload = res; s.onerror = ()=> rej(new Error('Couldn’t load the text reader'));
      document.head.appendChild(s);
    }).then(async ()=>{
      worker = await Tesseract.createWorker('eng');
      await worker.setParameters({ tessedit_pageseg_mode: '7', preserve_interword_spaces: '1',
        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789[]().,\'-_ ' });
      return worker;
    });
    tessP.catch(()=>{ tessP = null; });
    return tessP;
  }

  // find each line of kill-green text and return it as a clean black-on-white picture, one line per picture
  function buildMasks(img){
    const d = img.data, n = img.width * img.height;
    const k = new Uint8Array(n), r = new Uint8Array(n), y = new Uint8Array(n);
    for(let p = 0, i = 0; p < n; p++, i += 4){
      const R = d[i], G = d[i+1], B = d[i+2];
      const L = 0.299*R + 0.587*G + 0.114*B;
      if(L < 68 || (L > 84 && L < 197) || L > 233) continue;          // not the brightness of any kill / event text
      const cb = (B - L)*0.564 + 128, cr = (R - L)*0.713 + 128;
      if(L <= 84){ if(cr >= 150 && cb >= 80 && cb <= 122) r[p] = 1; }
      else if(L <= 213){ if(cb <= 120 && cr <= 120) k[p] = 1; }
      else if(L >= 217 && cb <= 100 && cr >= 128) y[p] = 1;
    }
    return { k, r, y };
  }
  function findLines(img, isAnn, keepShort){
    const W = img.width, H = img.height, d = img.data;
    let mask;
    if(isAnn instanceof Uint8Array) mask = isAnn;
    else { mask = new Uint8Array(W * H); for(let y = 0, i = 0; y < H; y++) for(let x = 0; x < W; x++, i += 4) if(isAnn(d[i], d[i+1], d[i+2])) mask[y*W + x] = 1; }
    // rows that hold at least 2 matching pixels between columns c0..c1, split into runs at blank rows
    const rowRuns = (c0, c1, r0, r1)=>{
      const runs = []; let y0 = -1;
      for(let y = r0; y <= r1 + 1; y++){
        let c = 0;
        if(y <= r1) for(let x = c0; x <= c1 && c < 2; x++) c += mask[y*W + x];
        const on = y <= r1 && c >= 2;
        if(on && y0 < 0) y0 = y;
        if(!on && y0 >= 0){ runs.push([y0, y - 1]); y0 = -1; }
      }
      // join tiny pieces (dots of i/j, accents) to the line right below/above them
      const lines = [];
      for(const r of runs){
        const last = lines[lines.length - 1];
        if(last && (r[0] - last[1] <= 2) && ((r[1] - r[0] < 4) || (last[1] - last[0] < 4))) last[1] = r[1];
        else lines.push(r.slice());
      }
      return lines;
    };
    // columns with any match in rows a..b, split where there's a wide empty gap (another chat window)
    const colSegs = (a, b)=>{
      const segs = []; let x0 = -1, gap = 0;
      for(let x = 0; x <= W; x++){
        let on = false;
        if(x < W) for(let y = a; y <= b && !on; y++) on = mask[y*W + x] === 1;
        if(on){ if(x0 < 0) x0 = x; gap = 0; last = x; }
        else if(x0 >= 0 && ++gap >= 16){ segs.push([x0, last]); x0 = -1; gap = 0; }
      }
      if(x0 >= 0) segs.push([x0, last]);
      return segs;
    };
    let last = 0;
    const found = [];
    for(const [a, b] of rowRuns(0, W - 1, 0, H - 1)){
      for(const [s0, s1] of colSegs(a, b)){
        for(const [la, lb] of rowRuns(s0, s1, a, b)){
          if(lb - la < 5 || lb - la > 40) continue;                 // not a text line
          let total = 0, x0 = W, x1 = -1;
          for(let y = la; y <= lb; y++) for(let x = s0; x <= s1; x++) if(mask[y*W + x]){ total++; if(x < x0) x0 = x; if(x > x1) x1 = x; }
          const short = total < 120 || x1 - x0 < 100;               // too short to be a whole kill line…
          if(short && (!keepShort || total < 12 || x1 - x0 < 8)) continue;   // …but it may be the wrapped end of one
          if(!short){
            // real text is fairly dense and runs across the line; scattered game graphics aren't
            const dens = total / ((x1 - x0 + 1) * (lb - la + 1));
            let filled = 0, buckets = 0;
            for(let x = x0; x <= x1; x += 8){ buckets++; let on = false; for(let y = la; y <= lb && !on; y++) for(let k = x; k < Math.min(x + 8, x1 + 1) && !on; k++) on = mask[y*W + k] === 1; if(on) filled++; }
            if(dens < 0.08 || filled / buckets < 0.5) continue;
          }
          found.push({ a: la, b: lb, x0, x1, total, short });
        }
      }
    }
    found.sort((p, q)=> p.a - q.a || p.x0 - q.x0);
    const out = [];
    for(const { a, b, x0, x1, short } of found){
      const pad = 4, cx0 = Math.max(0, x0 - pad), cy0 = Math.max(0, a - pad), cw = Math.min(W, x1 + pad + 1) - cx0, ch = Math.min(H, b + pad + 1) - cy0;
      // black text on white at 1x, then scaled up smoothly (soft edges read better than blocky pixels)
      const tmp = document.createElement('canvas'); tmp.width = cw + 8; tmp.height = ch + 8;
      const tx = tmp.getContext('2d'), od = tx.createImageData(tmp.width, tmp.height);
      od.data.fill(255);
      for(let y = 0; y < ch; y++) for(let x = 0; x < cw; x++)
        if(mask[(cy0 + y)*W + cx0 + x]){ const j = ((y + 4) * tmp.width + x + 4) * 4; od.data[j] = od.data[j+1] = od.data[j+2] = 0; }
      tx.putImageData(od, 0, 0);
      const cv = document.createElement('canvas'); cv.width = tmp.width * SCALE; cv.height = tmp.height * SCALE;
      const cx = cv.getContext('2d');
      cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
      cx.drawImage(tmp, 0, 0, cv.width, cv.height);
      let sig = '';
      for(let x = 0; x < cw; x += 5){ let c = 0; for(let y = 0; y < ch; y++) c += mask[(cy0 + y)*W + cx0 + x]; sig += c.toString(36); }
      out.push({ canvas: cv, small: tmp, sig: cw + 'x' + ch + ':' + sig, y0: a, y1: b, x0, x1, short });
    }
    return out;
  }

  // wrapped kill messages: a line continues on the next one in the same chat window (right below, same left edge)
  const newMsg = t=> /^.{0,40}?\]\s*o[ft]\s+Gu?[il1|]{1,2}d/i.test(t);
  const KILL_RULES = { isNew: newMsg, isDone: t=> /\.\s*$/.test(t) };
  // event lines start with "[PW2 Boss Event]"; one is finished once the map is followed by more words
  const EV_RULES = { isNew: t=> /^\W{0,3}P\s*[WwV]{1,3}\s*[2Z]|^.{0,8}Bo[s5]{2}\s*Ev/i.test(t), isDone: t=> /(spawn|defeat|gather)\S*\s+[il1]n\s+\S{4,}\s+\S/i.test(t) };
  function joinWrapped(items, rules){        // items: { ln, text } in top-to-bottom order
    rules = rules || KILL_RULES;
    const chains = [];
    for(const it of items){
      const ch = chains.find(c=>{
        const p = c[c.length - 1];
        return it.ln.y0 - p.ln.y1 >= 0 && it.ln.y0 - p.ln.y1 <= 10 && Math.abs(it.ln.x0 - c[0].ln.x0) <= 40 && !c.done;
      });
      if(ch && !rules.isNew(it.text) && !rules.isDone(ch.map(x=> x.text).join(' '))) ch.push(it);
      else { if(ch) ch.done = true; if(!it.ln.short) chains.push([it]); }
    }
    return chains.map(c=>({ text: c.map(x=> x.text).join(' '), lns: c.map(x=> x.ln), key: c.map(x=> x.ln.sig).join('|'), y: c[c.length - 1].ln.y1, x0: c[0].ln.x0 }));
  }

  // "[Name] of Guild [Guild] has killed [Maya] at Ant Hell F2."
  function parseLine(raw){
    const t = String(raw || '').replace(/\s+/g, ' ').trim();
    const clean = s=> s.replace(/^[\[\]\(\)\{\}|<>"'`.:;,\s]+|[\[\]\(\)\{\}|<>"'`.:;,\s]+$/g, '');
    const who = /^(.*?)\s+o[ft]\s+Gu?[il1|]{1,2}d\s+(.*?)\s+ha[s5]\s/i.exec(t);
    const k = /has\s*k\s*[il1|!]{1,3}\s*[il1|!]?\s*e\s*d\s*(.+?)\s+at\s+(.+?)\s*[.,:;]*$/i.exec(t);
    if(k) return { mvp: clean(k[1]), map: clean(k[2]), killer: who ? clean(who[1]) : '', guild: who ? clean(who[2]) : '', text: t };
    // forgiving read 1: the MVP is the last [ … ] in the line, the map is what follows it
    const groups = [...t.matchAll(/[\[\(\{|]\s*([^\[\]\(\)\{\}|]{2,40}?)\s*[\]\)\}|]/g)];
    if(groups.length >= 2 || (groups.length && /k[hil1|]|ha[s5]|gu[il1]/i.test(t))){
      const g = groups[groups.length - 1];
      const after = t.slice(g.index + g[0].length).replace(/^[\s.,:;'"-]*(a[a-z]?\s+)?/i, '');
      return { mvp: clean(g[1]), map: clean(after), killer: groups.length >= 3 ? clean(groups[0][1]) : (who ? clean(who[1]) : ''), guild: groups.length >= 3 ? clean(groups[1][1]) : (who ? clean(who[2]) : ''), text: t, loose: true, after: g[1] + ' ' + after };
    }
    // forgiving read 2: OCR slipped on "has killed" or "at" — find the words by shape instead
    const toks = t.split(' ');
    let ki = toks.findIndex(w=> sim(w, 'killed') >= 0.6 || /k\S{2,4}ed/i.test(w));
    if(ki < 0){ const gi = toks.findIndex(w=> sim(w, 'guild') >= 0.6); if(gi < 0 || !/kil|has|ha5/i.test(t)) return null; ki = gi; }
    let ai = -1;
    for(let i = toks.length - 1; i > ki; i--) if(/^(at|al|af|a[t1l]\.?)$/i.test(toks[i])){ ai = i; break; }
    const rest = toks.slice(ki + 1, ai > 0 ? ai : undefined).join(' ');
    const map = ai > 0 ? toks.slice(ai + 1).join(' ') : '';
    return { mvp: clean(rest), map: clean(map), killer: who ? clean(who[1]) : '', guild: who ? clean(who[2]) : '', text: t, loose: true, after: toks.slice(ki + 1).join(' ') };
  }

  // ---------- which MVP is it? ----------
  const norm = s=> String(s || '').toLowerCase().replace(/[^a-z]/g, '');
  // common OCR slips: "rn" for "m", "vv" for "w"
  function sim(a, b){
    const x = sim1(a, b), A = norm(a).replace(/rn/g, 'm').replace(/vv/g, 'w');
    return Math.max(x, sim1(A, b));
  }
  function sim1(a, b){
    a = norm(a); b = norm(b);
    if(!a || !b) return 0;
    if(a === b) return 1;
    const m = a.length, n = b.length, dp = Array.from({ length: m + 1 }, (_, i)=> [i]);
    for(let j = 1; j <= n; j++) dp[0][j] = j;
    for(let i = 1; i <= m; i++) for(let j = 1; j <= n; j++)
      dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return 1 - dp[m][n] / Math.max(m, n);
  }
  const ALIASES = {
    moonlight: ['Moonlight Flower', 'Moonlight'], lod: ['Lord of Death', 'Lord of the Dead'],
    samurai: ['Incantation Samurai', 'Samurai Specter'], garm: ['Garm', 'Hatii'], amonra: ['Amon Ra', 'Amonra'],
    gtb: ['Golden Thief Bug'], evil_snake: ['Evil Snake Lord'], doppel: ['Doppelganger'], stormy: ['Stormy Knight', 'Knight of Windstorm'],
    turtle_general: ['Turtle General'], dark_lord: ['Dark Lord'], orc_hero: ['Orc Hero'], orc_lord: ['Orc Lord'],
  };
  // MVPs that share a name: pick by the map in the announcement
  const FAMILIES = [
    { names: ['Baphomet'], pick: map=> /glast|gl_|church|heim/i.test(map) ? 'bapho_gh' : null },   // Baphomet Maze isn't tracked
    { names: ['Ghostring'], pick: map=> /sunken|ship|treasure/i.test(map) ? 'ghost_sunken' : 'ghost_poring' },
    { names: ['Angeling'], pick: map=> /toy|xmas|warehouse/i.test(map) ? 'angel_toy' : /yuno|el\s*mes|plateau/i.test(map) ? 'angel_yuno' : /mjol|mjöl/i.test(map) ? 'angel_mjolnir' : 'angel_poring' },
    { names: ['Deviling'], pick: ()=> 'devil_yuno' },
    { names: ['Archangeling', 'Arcangeling', 'Arcangel'], pick: ()=> 'arch_yuno' },
  ];
  const FAMILY_OF = { bapho_maze: 0, bapho_gh: 0, ghost_sunken: 1, ghost_poring: 1, angel_toy: 2, angel_yuno: 2, angel_poring: 2, angel_mjolnir: 2, devil_yuno: 3, arch_yuno: 4 };
  const placeOf = m=> String(m.location || '').replace(/\s*\(.*$/, '');
  // name (and, when readable, the map) decide which MVP it is; a shaky name is accepted when the map agrees
  function matchMvp(name, map, withScore){
    const list = (typeof mvps !== 'undefined' ? mvps : []);
    const rows = [];
    for(const m of list){
      if(m.id === 'boss_event') continue;
      const fam = FAMILY_OF[m.id];
      if(fam !== undefined && FAMILIES[fam].pick(map || '') !== m.id) continue;   // e.g. Baphomet at Glast Heim → Baphomet GH
      const names = [m.name].concat(ALIASES[m.id] || [], fam !== undefined ? FAMILIES[fam].names : []);
      let nS = 0; for(const n of names) nS = Math.max(nS, sim(name, n));
      rows.push({ m, nS, mS: map ? sim(map, placeOf(m)) : 0 });
    }
    let best = null, bestS = 0;
    for(const r of rows){
      const rival = rows.some(o=> o !== r && o.nS >= r.nS - 0.15);
      const ok = r.nS >= 0.72 || (r.nS >= 0.5 && r.mS >= 0.6) || (r.nS >= 0.66 && !rival);
      const sc = r.nS + (r.mS >= 0.6 ? 0.2 * r.mS : 0);

    const on = !!track;
    btn.classList.toggle('on', on);
    btn.classList.toggle('busy', on && !worker);
    btn.innerHTML = `<span class="kd-dot"></span>${on ? 'Auto-detect on' : 'Auto-detect'}`;
    btn.title = on ? 'Reading kill announcements from the shared game window. Click for details.' : 'Share your Ragnarok window and kills are logged automatically';
    const st = pop && pop.querySelector('.kd-status'); if(st) st.textContent = status;
  }
  function paintPop(){
    if(!pop) return;
    const on = !!track;
    const ago = t=>{ const s = Math.floor((Date.now() - t) / 1000); return s < 60 ? s + 's ago' : Math.floor(s / 60) + 'm ago'; };
    pop.innerHTML = `<h4>📡 Auto-detect kills</h4>
      <p>${on ? 'Keep Ragnarok and this tab open, with your chat box visible. New <i>“… has killed [MVP] at …”</i> lines in chat are logged for everyone.'
              : 'Share your <b>Ragnarok game window</b>. It reads the whole game window, so your chat box can be anywhere; you can mark just the chat box if you like. When a green <i>“… has killed [MVP] at …”</i> line appears in chat, the tracker logs the kill for everyone. The <b>[PW2 Boss Event]</b> “has spawned” (red) and “has been defeated” (yellow) lines update the Boss Event row. Nothing touches the game; it only reads the picture.'}</p>
      <div class="kd-status">${esc(status || (on ? 'Watching' : 'Not running'))}</div>
      ${on ? `<div class="kd-diag">Screen ${esc(diag.size || '…')} · reading ${esc(diag.strips || "…")} · ${esc(diag.pace || "full speed")} · green lines now: ${diag.lines}${diag.lastText ? `<br>Last text read (${ago(diag.lastTextAt)}): “${esc(diag.lastText.slice(0, 110))}”` : '<br>No green announcement text seen yet'}</div>` : ''}
      <div class="kd-log">${log.length ? log.slice(0, 12).map(e=>`<div class="kd-row ${e.kind}"><span><b>${esc(e.title)}</b>${e.sub ? '<br><small>' + esc(e.sub) + '</small>' : ''}</span><small>${ago(e.at)}</small></div>`).join('') : '<div class="kd-none">Nothing detected yet.</div>'}</div>
      ${on && thumb.width ? '<div class="kd-prev"><span>What it sees (green box = area read)</span><canvas class="kd-thumb"></canvas></div>' : ''}
      ${on ? `<div class="kd-area">${areaIsDefault() ? '✓ Reading the whole game window' : '✓ Reading your marked chat box'} <span><button type="button" class="kd-mark">${areaIsDefault() ? 'Mark chat box' : 'Change'}</button>${areaIsDefault() ? '' : ' <button type="button" class="kd-reset">Reset</button>'}</span></div>` : ''}
      <div class="kd-acts">${on ? '<button type="button" class="kd-stop">■ Stop auto-detect</button>' : '<button type="button" class="kd-go">▶ Start: share game window</button>'}</div>`;
    const tc = pop.querySelector('.kd-thumb');
    if(tc){
      tc.width = thumb.width; tc.height = thumb.height;
      const g = tc.getContext('2d'); g.drawImage(thumb, 0, 0);
      g.strokeStyle = '#2fbf71'; g.lineWidth = 2;
      g.strokeRect(area.x * tc.width + 1, area.y * tc.height + 1, area.w * tc.width - 2, area.h * tc.height - 2);
    }
    const go = pop.querySelector('.kd-go'), st = pop.querySelector('.kd-stop');
    if(go) go.onclick = ()=>{ start(); };
    if(st) st.onclick = ()=>{ stop(); };
    const rs = pop.querySelector('.kd-reset');
    if(rs) rs.onclick = ()=>{ area = DEFAULT_AREA; try { localStorage.removeItem(AREA_KEY); } catch(e) {} seenSig.clear(); seenKill.clear(); seenEvt.clear(); linePos.clear(); seenLine.clear(); scrollNoted.clear(); prevGroups = []; hot = []; warm = false; addLog('ok', 'Reading the whole game window', ''); paintPop(); };
    const mk = pop.querySelector('.kd-mark'); if(mk) mk.onclick = ()=>{ pop.hidden = true; pickArea(); };
  }
  function mount(){
    const r = window.FALSEHOOD_ROLE;
    if(r !== 'editor' && r !== 'admin' && r !== 'timer') return;   // anyone who can log kills
    const anchor = document.querySelector('.fb-online') || document.getElementById('fbRole');
    if(!anchor || btn) return;
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'kd-btn';
    anchor.after(btn);
    pop = document.createElement('div'); pop.className = 'kd-pop'; pop.hidden = true;
    document.body.appendChild(pop);
    btn.onclick = e=>{
      e.stopPropagation();
      if(!pop.hidden){ pop.hidden = true; return; }
      paintPop(); pop.hidden = false;
      const rc = btn.getBoundingClientRect();
      pop.style.top = (rc.bottom + 6) + 'px';
      pop.style.left = Math.max(8, Math.min(rc.left, innerWidth - pop.offsetWidth - 8)) + 'px';
    };
    pop.onclick = e=> e.stopPropagation();
    document.addEventListener('click', ()=>{ if(pop) pop.hidden = true; });
    setInterval(()=>{ if(pop && !pop.hidden) paintPop(); }, 5000);
    paintBtn();
  }
  const wait = setInterval(()=>{ if(document.getElementById('fbRole')){ clearInterval(wait); setTimeout(mount, 300); } }, 500);

  // ---------- warn the watcher: their own Auto-detect can't read chat ----------
  const WARN = {
    frozen: ['Auto-detect can’t see the game', 'Ragnarok looks minimized or frozen. Restore the game window — it can sit behind other windows, just not minimized.'],
    black: ['Auto-detect sees a black screen', 'Run Ragnarok in windowed mode (Alt+Enter), then press Stop and Start in Auto-detect.'],
    outside: ['Kill text is outside your chat box', 'Your chat moved. Open Auto-detect, press Change and draw the box around your chat again (or Reset).'],
    noarea: ['Auto-detect isn’t reading yet', 'Open Auto-detect and mark your chat box.'],
  };
  let warnEl = null, badSince = 0, badCode = '', snoozed = {};
  setInterval(()=>{
    const h = track && window.FALSEHOOD_AD_HEALTH ? window.FALSEHOOD_AD_HEALTH() : 'ok';
    const bad = WARN[h] ? h : '';
    if(bad !== badCode){ badCode = bad; badSince = Date.now(); }
    const show = bad && Date.now() - badSince > 30000 && !(snoozed[bad] > Date.now());
    if(!show){ if(warnEl) warnEl.hidden = true; return; }
    if(!warnEl){
      warnEl = document.createElement('div'); warnEl.className = 'kd-warn'; warnEl.setAttribute('role', 'alert');
      document.body.appendChild(warnEl);
    }
    if(warnEl.hidden || warnEl.dataset.code !== bad){
      warnEl.dataset.code = bad;
      warnEl.innerHTML = `<span class="kd-warn-ic">📡⚠</span><span class="kd-warn-txt"><b>${WARN[bad][0]}</b>${WARN[bad][1]}</span>
        <button type="button" class="kd-warn-go">Open Auto-detect</button><button type="button" class="kd-warn-x" title="Hide for 15 minutes">✕</button>`;
      warnEl.querySelector('.kd-warn-go').onclick = e=>{ e.stopPropagation(); warnEl.hidden = true; if(btn && pop && pop.hidden) btn.click(); };
      warnEl.querySelector('.kd-warn-x').onclick = ()=>{ snoozed[bad] = Date.now() + 15 * 60000; warnEl.hidden = true; };
      warnEl.hidden = false;
      try { if(typeof playSoft === 'function') playSoft(); } catch(e) {}
    }
  }, 5000);

  window.__adLog = (k, t, sub)=> addLog(k, t, sub);
  window.__adEvent = t=> parseEvent(t);
  window.falsehoodFixMap = m=> /^…/.test(String(m || '')) ? m : fixMap(String(m || '').replace(/[^A-Za-z0-9_]/g, '').replace(/rn/g, 'm'));
  window.__adDiag = ()=> diag;
  // health for the Admin's 📡 list: is this watcher's Auto-detect actually able to read chat?
  window.FALSEHOOD_AD_HEALTH = ()=>{
    if(!track) return 'ok';
    if(!worker) return 'loading';
    if(lastScan && Date.now() - lastScan > 60000) return 'stalled';
    if(diag.black) return 'black';
    if(diag.frozen) return 'frozen';
    if(!area) return 'noarea';
    if(diag.outside > 0) return 'outside';
    return 'ok';
  };
  window.__adEventLog = t=>{ const e = parseEvent(t); if(e){ e.text = t; handleEvent(e); } return e; };
  window.__adParse = t=>{ const p = parseLine(t); if(!p) return null; const m = matchMvp(p.mvp, p.map) || (p.loose ? findInWords(p.after || p.text, p.map) : null) || byMap(p.map); return { mvp: p.mvp, map: p.map, killer: p.killer, loose: !!p.loose, id: m ? m.id : null }; };
  // for testing: window.__adTest(imageOrCanvas) runs one frame through the reader
  window.__adTest = async (src, whole)=>{
    const W = src.width || src.naturalWidth, H = src.height || src.naturalHeight;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const cx = cv.getContext('2d'); cx.drawImage(src, 0, 0);
    const ar = whole ? { x: 0, y: 0, w: 1, h: 1 } : area;
    const ax = Math.round(ar.x * W), ay = Math.round(ar.y * H), aw = Math.round(ar.w * W), ah = Math.round(ar.h * H);
    const im = cx.getImageData(ax, ay, aw, ah);
    const lines = findLines(im, isAnn, true);
    await loadOCR();
    const res = [];
    const evItems = [];
    for(const ln of EV_COLORS.flatMap(fn=> findLines(im, fn, true)).sort((p, q)=> p.y0 - q.y0 || p.x0 - q.x0)){ const { data } = await worker.recognize(ln.canvas); const t = data.text.replace(/\s+/g, ' ').trim(); if(t) evItems.push({ ln, text: t }); }
    for(const { text: t } of joinWrapped(evItems, EV_RULES)){ const e = parseEvent(t); res.push({ text: t, match: e ? JSON.stringify(e) : null }); }
    const items = [];
    for(const ln of lines){ const { data } = await worker.recognize(ln.canvas); const t = data.text.replace(/\s+/g, ' ').trim(); if(t) items.push({ ln, text: t }); }
    for(const { text: t } of joinWrapped(items)){ const p = parseLine(t); const m = p ? resolve(p) : null; res.push({ text: t, match: m ? m.id : null }); }
    return res;
  };
})();
</script>
