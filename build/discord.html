<!-- Discord posts: kills, spawn windows and the Boss Event go to the guild's Discord channel through a webhook.
     Any FLHD / Timers / Admin device with the tracker open does the posting; a shared lock (discordlog) makes
     sure each message is sent once. Only the Admin can set the webhook, and View-only accounts can't read it. -->
<style>
.dc-ov{position:fixed;inset:0;z-index:9999;background:rgba(10,6,18,.7);display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,system-ui,sans-serif}
.dc-card{width:min(440px,100%);box-sizing:border-box;background:#1b1426;color:#f1ecf8;border:1px solid #3b2d52;border-radius:14px;padding:16px;display:grid;gap:10px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.dc-card h4{margin:0;font:700 16px Cinzel,serif}
.dc-card p{margin:0;color:#b9aecb;font-size:12.5px;line-height:1.5}
.dc-card ol{margin:0;padding-left:18px;color:#b9aecb;font-size:12.5px;line-height:1.5}
.dc-card input{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;border:1px solid #4a3a63;background:#2a2233;color:#f6f3fb;font:13px Inter,system-ui,sans-serif}
.dc-card .dc-st{font-size:12px;color:#9d8fb3;min-height:16px}
.dc-card .dc-st.ok{color:#7be0a5}.dc-card .dc-st.bad{color:#ff9aa8}
.dc-ck{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#cfc4df;line-height:1.4;cursor:pointer}
.dc-card .dc-ck input{width:auto;flex:none;margin-top:2px;padding:0;accent-color:#a02ab8}
.dc-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dc-acts button{padding:8px 12px;border-radius:9px;border:1px solid #4a3a63;background:#2a2233;color:#f6f3fb;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.dc-acts .dc-save{background:#a02ab8;border-color:#c03bd6}
.dc-acts .dc-off{color:#ffb3c0;border-color:#6b3b4a;background:#3a1f29}
.dc-acts button:disabled{opacity:.5;cursor:default}
</style>
<script>
(function(){
  if(!window.FALSEHOOD_FIREBASE) return;
  const canPost = ()=>{ const r = window.FALSEHOOD_ROLE; return r === 'editor' || r === 'admin' || r === 'timer'; };
  const HOOK_RE = /^https:\/\/(?:ptb\.|canary\.)?discord(?:app)?\.com\/api\/webhooks\/\d+\/[\w-]+$/;
  const fs = ()=> window.FALSEHOOD_FS;
  let cfg = null, watching = false;
  function watchCfg(){
    if(watching || !fs() || !canPost()) return;
    watching = true;
    fs().doc('config_discord/main').onSnapshot(s=>{ cfg = s.exists ? (s.data() || null) : null; }, ()=>{ cfg = null; });
  }

  // Discord shows <t:…> times in each reader's own timezone
  const sec = ms=> Math.floor(ms / 1000);
  const at = (ms, f)=> `<t:${sec(ms)}:${f || 't'}>`;
  const nick = id=> (id && typeof nickNames !== 'undefined' && nickNames[id]) || '';
  async function send(url, content){
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, username: 'Falsehood MVP Tracker', allowed_mentions: { parse: [] } }) });
    return r.ok;
  }
  // first device to claim a message posts it; everyone else skips it
  async function claim(key){
    const ref = fs().collection('discordlog').doc(key);
    try {
      return await fs().runTransaction(async tx=>{
        const s = await tx.get(ref);
        if(s.exists) return false;
        tx.set(ref, { at: Date.now(), by: window.FALSEHOOD_UID || null });
        return true;
      });
    } catch(e) { return false; }
  }
  const tried = new Set();
  async function post(key, content){
    if(tried.has(key)) return;
    tried.add(key);
    if(!(await claim(key))) return;
    try { await send(cfg.url, content); } catch(e) {}
  }

  // When someone runs Auto-detect, only their trackers post to Discord (fewer Firebase reads);
  // when nobody does, every tracker that can post takes part as before.
  const amPoster = ()=>{
    const w = window.FALSEHOOD_WATCH;
    if(!w || !w.isWatching) return true;
    if(w.isWatching()) return true;
    return !(w.count() > 0);
  };
  const postsOn = ()=> cfg.posts === true;
  const boardOn = ()=> cfg.board !== false;
  function tick(){
    watchCfg();
    if(!cfg || !cfg.on || !cfg.url || !canPost() || typeof mvps === 'undefined') return;
    if(!amPoster()) return;
    if(boardOn()) board();
    if(!postsOn()) return;
    const now = Date.now(), since = +cfg.since || 0;
    for(const m of mvps){
      if(!m.lastDeath) continue;
      if(m.id === 'boss_event'){
        if(m.lastDeath < since || now - m.lastDeath < 5000 || now - m.lastDeath > 10 * 60000) continue;
        const mm = /^(\S+)\s*\((.+)\)\s*$/.exec(String(m.location || ''));
        const map = mm ? mm[1] : '', boss = mm ? mm[2] : '';
        if(m.ev === 'spawn') post('ev_spawn_' + m.lastDeath, `🔥 **Boss Event:** ${boss || 'an MVP'} has spawned${map ? ' in ' + map : ''} · ${at(m.lastDeath)}`);
        else post('ev_dead_' + m.lastDeath, `✅ **Boss Event:** ${boss || 'MVP'} killed${m.killer ? ' by ' + m.killer : ''}${map ? ' in ' + map : ''} · ${at(m.lastDeath)}`);
        continue;
      }
      if(m.type === 'mini') continue;
      const open = m.lastDeath + m.min * 60000, close = m.lastDeath + m.max * 60000;
      const place = String(m.location || '');
      // kills: wait 15 s first so an Undo right after a mis-click isn't posted
      if(m.lastDeath >= since && now - m.lastDeath >= 15000 && now - m.lastDeath < 30 * 60000){
        const who = nick(m.by) ? ' · logged by ' + nick(m.by) : '';   // Discord is seen by view-only members too: no Auto-detect mention
        const when = m.min === m.max
          ? `Spawns ${at(open)} (${at(open, 'R')})`
          : `Floats ${at(open)} – ${at(close)} (${at(open, 'R')})`;
        post('kill_' + m.id + '_' + m.lastDeath, `💀 **${m.name}** killed ${at(m.lastDeath)}${who}${place ? ' · ' + place : ''}\n${when}`);
      }
      // spawn window opens
      if(open >= since && now >= open && now - open < 15 * 60000 && (m.min === m.max || now <= close)){
        post('open_' + m.id + '_' + m.lastDeath, m.min === m.max
          ? `🟢 **${m.name}** has spawned${place ? ' · ' + place : ''}`
          : `🟢 **${m.name}** is floating now${place ? ' · ' + place : ''} · window ends ${at(close)} (${at(close, 'R')})`);
      }
      // window closed and nobody logged a new kill: it's overdue
      if(m.min !== m.max && close >= since && now > close && now - close < 15 * 60000){
        post('over_' + m.id + '_' + m.lastDeath, `🔴 **${m.name}** is overdue${place ? ' · ' + place : ''} · window ended ${at(close)} (${at(close, 'R')})`);
      }
    }
  }
  setInterval(tick, 5000);

  // ---------- live board: one message that edits itself ----------
  const plain = loc=> String(loc || '').replace(/\s*\(.*\)\s*$/, '') || '?';
  function boardBody(){
    const now = Date.now();
    const list = mvps.filter(m=> m.type !== 'mini' && m.id !== 'boss_event' && m.lastDeath);
    const st = m=>{ const o = m.lastDeath + m.min * 60000, c = m.lastDeath + m.max * 60000; return now < o ? 'wait' : now <= c ? 'float' : 'over'; };
    const close = m=> m.lastDeath + m.max * 60000, open = m=> m.lastDeath + m.min * 60000;
    const floating = list.filter(m=> st(m) === 'float').sort((a, b)=> close(a) - close(b));
    const overdue = list.filter(m=> st(m) === 'over' && now - close(m) < 3 * 3600000).sort((a, b)=> close(b) - close(a));
    const next = list.filter(m=> st(m) === 'wait').sort((a, b)=> open(a) - open(b)).slice(0, 8);
    const line = (m, txt)=> `**${m.name}** · ${plain(m.location)} · ${txt}`;
    const sec = (title, rows, none)=> `**${title}**\n` + (rows.length ? rows.join('\n') : `*${none}*`);
    const be = mvps.find(m=> m.id === 'boss_event');
    let beTxt = '*No event recorded yet*';
    if(be && be.lastDeath){
      const mm = /^(\S+)\s*\((.+)\)\s*$/.exec(String(be.location || ''));
      const map = mm ? mm[1] : '', boss = mm ? mm[2] : 'MVP';
      beTxt = be.ev === 'spawn'
        ? `**${boss}** · ${map || '?'} · spawned ${at(be.lastDeath)} (${at(be.lastDeath, 'R')})`
        : `✓ **${boss}** killed${be.killer ? ' by ' + be.killer : ''} · ${map || '?'} · ${at(be.lastDeath)} (${at(be.lastDeath, 'R')})`;
    }
    const desc = [
      sec('🟢 Floating now', floating.map(m=> line(m, m.min === m.max ? 'has spawned' : `ends ${at(close(m))} (${at(close(m), 'R')})`)), 'Nothing floating'),
      sec('🔴 Overdue', overdue.map(m=> line(m, `since ${at(close(m))} (${at(close(m), 'R')})`)), 'Nothing overdue'),
      sec('⏳ Next up', next.map(m=> line(m, m.min === m.max ? `spawns ${at(open(m))} (${at(open(m), 'R')})` : `${at(open(m))} – ${at(close(m))} (${at(open(m), 'R')})`)), 'No timers running'),
      sec('🔥 Boss Event', [beTxt], ''),
    ].join('\n\n');
    // what the board says, without the times that tick by themselves: an edit is only needed when this changes
    const sig = JSON.stringify([floating.map(m=> m.id + m.lastDeath), overdue.map(m=> m.id + m.lastDeath), next.map(m=> m.id + m.lastDeath + m.location), be ? [be.lastDeath, be.ev, be.location, be.killer] : 0, Math.floor(now / (10 * 60000))]);
    return { sig, body: { username: 'Falsehood MVP Tracker', allowed_mentions: { parse: [] }, embeds: [{
      title: 'Falsehood MVP board', color: 0x7F77DD, description: desc.slice(0, 4000),
      footer: { text: 'Updates automatically while a guild tracker is open · last update' }, timestamp: new Date(now).toISOString() }] } };
  }
  let boardBusy = false, boardSeen = '';
  async function board(){
    if(boardBusy) return;
    const { sig, body } = boardBody();
    if(sig === boardSeen) return;
    boardBusy = true;
    const ref = fs().doc('discordboard/main');
    try {
      // one device edits at a time; skip if the board already shows this
      const me = window.FALSEHOOD_UID || 'x';
      const st = await fs().runTransaction(async tx=>{
        const d = (await tx.get(ref)).data() || {};
        if(d.url === cfg.url && d.sig === sig && d.id){ return { skip: true, d }; }
        if(d.lockUntil > Date.now() && d.lockBy !== me) return { skip: true, busy: true, d };
        tx.set(ref, Object.assign({}, d, { lockUntil: Date.now() + 20000, lockBy: me }));
        return { skip: false, d };
      });
      if(st.skip){ if(!st.busy) boardSeen = sig; return; }
      const d = st.d;
      let id = d.url === cfg.url ? d.id : null;     // a new webhook (another channel) starts a new board
      let ok = false;
      if(id){
        const r = await fetch(cfg.url + '/messages/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        ok = r.ok;
        if(r.status === 404) id = null;              // someone deleted the board: post a new one
      }
      if(!id){
        const r = await fetch(cfg.url + (cfg.url.includes('?') ? '&' : '?') + 'wait=true', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if(r.ok){ const j = await r.json(); id = j && j.id; ok = !!id; }
      }
      await ref.set({ id: id || null, url: cfg.url, sig: ok ? sig : (d.sig || ''), editedAt: Date.now(), by: me, lockUntil: 0, lockBy: null });
      if(ok) boardSeen = sig;
    } catch(e) {
      try { await ref.set({ lockUntil: 0, lockBy: null }, { merge: true }); } catch(x) {}
    } finally { boardBusy = false; }
  }

  // ---------- Admin setup ----------
  window.falsehoodDiscordSetup = async ()=>{
    if(window.FALSEHOOD_ROLE !== 'admin' || !fs()) return;
    let cur = null;
    try { const s = await fs().doc('config_discord/main').get(); cur = s.exists ? s.data() : null; } catch(e) {}
    const ov = document.createElement('div'); ov.className = 'dc-ov';
    ov.innerHTML = `<div class="dc-card" role="dialog" aria-label="Discord posts">
      <h4>💬 Discord posts</h4>
      <p>Keeps a live MVP board in a Discord channel (one message that updates itself), and can also post each kill, spawn window, overdue and Boss Event. No pings. Any FLHD / Timers / Admin with the tracker open does the updating.</p>
      <ol><li>In Discord: <b>Server Settings → Integrations → Webhooks → New Webhook</b>.</li><li>Pick the channel, then <b>Copy Webhook URL</b>.</li><li>Paste it here and press <b>Save &amp; turn on</b>.</li></ol>
      <input class="dc-url" type="url" placeholder="https://discord.com/api/webhooks/…" autocomplete="off" spellcheck="false">
      <label class="dc-ck"><input type="checkbox" class="dc-board"> <span><b>Live board</b>: one message that edits itself (pin it once in Discord)</span></label>
      <label class="dc-ck"><input type="checkbox" class="dc-posts"> <span><b>Individual posts</b>: a new message for each kill, spawn window, overdue and Boss Event</span></label>
      <div class="dc-st">${cur && cur.on ? '✓ Discord posts are <b>on</b>.' : cur && cur.url ? 'Discord posts are <b>off</b>.' : 'Not set up yet.'}</div>
      <div class="dc-acts">
        ${cur && cur.on ? '<button type="button" class="dc-off">Turn off</button>' : ''}
        <button type="button" class="dc-test">Send test</button>
        <button type="button" class="dc-close">Close</button>
        <button type="button" class="dc-save">Save &amp; turn on</button>
      </div></div>`;
    document.body.appendChild(ov);
    const inp = ov.querySelector('.dc-url'), st = ov.querySelector('.dc-st');
    if(cur && cur.url) inp.value = cur.url;
    ov.querySelector('.dc-board').checked = !cur || cur.board !== false;
    ov.querySelector('.dc-posts').checked = !!(cur && cur.posts === true);
    const say = (t, k)=>{ st.className = 'dc-st' + (k ? ' ' + k : ''); st.innerHTML = t; };
    const valid = ()=>{ const u = inp.value.trim(); if(!HOOK_RE.test(u)){ say('That doesn’t look like a Discord webhook URL. It starts with https://discord.com/api/webhooks/', 'bad'); return null; } return u; };
    ov.querySelector('.dc-close').onclick = ()=> ov.remove();
    ov.onclick = e=>{ if(e.target === ov) ov.remove(); };
    ov.querySelector('.dc-test').onclick = async ()=>{
      const u = valid(); if(!u) return;
      say('Sending…');
      try { say(await send(u, '✅ **Falsehood MVP Tracker** is connected. The live MVP board will appear in this channel.') ? 'Test sent. Check your Discord channel.' : 'Discord refused it. Check the webhook URL.', 'ok'); }
      catch(e) { say('Couldn’t reach Discord. Check the URL and your connection.', 'bad'); }
    };
    ov.querySelector('.dc-save').onclick = async ()=>{
      const u = valid(); if(!u) return;
      const bOn = ov.querySelector('.dc-board').checked, pOn = ov.querySelector('.dc-posts').checked;
      if(!bOn && !pOn){ say('Tick the live board, individual posts, or both.', 'bad'); return; }
      try { await fs().doc('config_discord/main').set({ url: u, on: true, board: bOn, posts: pOn, since: Date.now(), by: window.FALSEHOOD_UID || null }); say('✓ Saved. Discord posts are on.', 'ok'); setTimeout(()=> ov.remove(), 1200); }
      catch(e) { say('Couldn’t save (' + ((e && e.code) || 'error') + '). Update the Firebase rules first.', 'bad'); }
    };
    const off = ov.querySelector('.dc-off');
    if(off) off.onclick = async ()=>{
      try { await fs().doc('config_discord/main').set(Object.assign({}, cur, { on: false })); say('Discord posts are off.', 'ok'); setTimeout(()=> ov.remove(), 1000); }
      catch(e) { say('Couldn’t save (' + ((e && e.code) || 'error') + ').', 'bad'); }
    };
    inp.focus();
  };
})();
</script>
