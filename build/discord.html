<!-- Discord board: a live MVP board (one message that edits itself) in up to two Discord channels, through webhooks.
     Any FLHD / Timers / Admin device with the tracker open does the updating; a shared lock (discordboard) makes
     sure only one edits at a time. Only the Admin can set the webhook, and View-only accounts can't read it. -->
<style>
.dc-ov{position:fixed;inset:0;z-index:9999;background:rgba(10,6,18,.7);display:flex;align-items:center;justify-content:center;padding:16px;font-family:Inter,system-ui,sans-serif}
.dc-card{width:min(440px,100%);box-sizing:border-box;background:#1b1426;color:#f1ecf8;border:1px solid #3b2d52;border-radius:14px;padding:16px;display:grid;gap:10px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.dc-card h4{margin:0;font:700 16px Cinzel,serif}
.dc-card p{margin:0;color:#b9aecb;font-size:12.5px;line-height:1.5}
.dc-card ol{margin:0;padding-left:18px;color:#b9aecb;font-size:12.5px;line-height:1.5}
.dc-card input{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;border:1px solid #4a3a63;background:#2a2233;color:#f6f3fb;font:13px Inter,system-ui,sans-serif}
.dc-card .dc-st{font-size:12px;color:#9d8fb3;min-height:16px}
.dc-card .dc-st.ok{color:#7be0a5}.dc-card .dc-st.bad{color:#ff9aa8}
.dc-ck{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#cfc4df;line-height:1.4;cursor:pointer}
.dc-card .dc-ck input{width:auto;flex:none;margin-top:2px;padding:0;accent-color:#a02ab8}
.dc-sec{font:700 11px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#cdb8ef;margin-top:4px}.dc-sec small{font-weight:500;letter-spacing:0;text-transform:none;color:#9d8fb3}
.dc-card{max-height:calc(100vh - 32px);overflow:auto}
.dc-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dc-acts button{padding:8px 12px;border-radius:9px;border:1px solid #4a3a63;background:#2a2233;color:#f6f3fb;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.dc-acts .dc-save{background:#a02ab8;border-color:#c03bd6}
.dc-acts .dc-off{color:#ffb3c0;border-color:#6b3b4a;background:#3a1f29}
.dc-acts button:disabled{opacity:.5;cursor:default}
</style>
<script>
(function(){
  if(!window.FALSEHOOD_FIREBASE) return;
  const canPost = ()=>{ const r = window.FALSEHOOD_ROLE; return r === 'editor' || r === 'admin' || r === 'timer'; };
  const HOOK_RE = /^https:\/\/(?:ptb\.|canary\.)?discord(?:app)?\.com\/api\/webhooks\/\d+\/[\w-]+$/;
  const fs = ()=> window.FALSEHOOD_FS;
  let cfg = null, watching = false;
  function watchCfg(){
    if(watching || !fs() || !canPost()) return;
    watching = true;
    fs().doc('config_discord/main').onSnapshot(s=>{ cfg = s.exists ? (s.data() || null) : null; }, ()=>{ cfg = null; });
  }

  // Discord shows <t:…> times in each reader's own timezone
  const sec = ms=> Math.floor(ms / 1000);
  const at = (ms, f)=> `<t:${sec(ms)}:${f || 't'}>`;
  const nick = id=> (id && typeof nickNames !== 'undefined' && nickNames[id]) || '';
  // the guild logo as the bot's picture (only from the real site; Discord can't load a local file)
  const avatar = ()=> /^https?:/.test(location.protocol) ? location.origin + location.pathname.replace(/[^/]*$/, '') + 'apple-touch-icon.png' : undefined;
  async function send(url, content){
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, username: 'Falsehood MVP Tracker', avatar_url: avatar(), allowed_mentions: { parse: [] } }) });
    return r.ok;
  }
  // up to two channels (webhooks), each with its own live board
  const hooks = ()=> [
    cfg.url ? { url: cfg.url, board: cfg.board !== false, doc: 'discordboard/main' } : null,
    cfg.url2 ? { url: cfg.url2, board: cfg.board2 !== false, doc: 'discordboard/main2' } : null,
  ].filter(Boolean);
  // When someone runs Auto-detect, only their trackers post to Discord (fewer Firebase reads);
  // when nobody does, every tracker that can post takes part as before.
  const amPoster = ()=>{
    const w = window.FALSEHOOD_WATCH;
    if(!w || !w.isWatching) return true;
    if(w.isWatching()) return true;
    return !(w.count() > 0);
  };
  function tick(){
    watchCfg();
    if(!cfg || !cfg.url || !canPost() || typeof mvps === 'undefined') return;
    // test mode: Discord is "off" for everyone (old versions included) except the one tracker named in onlyBy
    const solo = !!cfg.onlyBy && cfg.onlyBy === window.FALSEHOOD_UID;
    if(cfg.onlyBy ? !solo : !cfg.on) return;
    if(!solo && !amPoster()) return;
    for(const h of hooks()) if(h.board) board(h);
  }
  setInterval(tick, 5000);

  // ---------- live board: one message that edits itself ----------
  const plain = loc=> String(loc || '').replace(/\s*\(.*\)\s*$/, '') || '?';
  const cut = (t, n)=> { t = String(t || ''); return t.length > n ? t.slice(0, n - 1).trimEnd() + '…' : t; };
  const COLOR = { float: 0x2FBF71, over: 0xE2405C, event: 0xF08A24, done: 0x5C5470, quiet: 0x7F77DD };
  const siteUrl = ()=> /^https?:/.test(location.protocol) ? location.origin + location.pathname.replace(/[^/]*$/, '') : '';
  function boardBody(){
    const now = Date.now();
    const list = mvps.filter(m=> m.type !== 'mini' && m.id !== 'boss_event' && m.lastDeath);
    const st = m=>{ const o = m.lastDeath + m.min * 60000, c = m.lastDeath + m.max * 60000; return now < o ? 'wait' : now <= c ? 'float' : 'over'; };
    const close = m=> m.lastDeath + m.max * 60000, open = m=> m.lastDeath + m.min * 60000;
    const floating = list.filter(m=> st(m) === 'float').sort((a, b)=> close(a) - close(b));
    const overdue = list.filter(m=> st(m) === 'over' && now - close(m) < 2 * 3600000).sort((a, b)=> close(b) - close(a));
    const next = list.filter(m=> st(m) === 'wait').sort((a, b)=> open(a) - open(b)).slice(0, 10);
    // Boss Event: its own card on top (orange while it's up, for up to 2 hours; dimmer once killed)
    const be = mvps.find(m=> m.id === 'boss_event');
    const bm = be && /^(\S+)\s*\((.+)\)\s*$/.exec(String(be.location || ''));
    const beMap = bm ? bm[1] : '', beBoss = bm ? bm[2] : 'MVP';
    const beUp = !!(be && be.lastDeath && be.ev === 'spawn' && now - be.lastDeath < 2 * 3600000);
    // the boss's picture from the tracker (Admin-uploaded) goes in the corner of the Boss Event card, as a file attached to the board
    let pic = null;
    try {
      const bm = be && be.lastDeath && typeof mvpByBossName === 'function' ? mvpByBossName(beBoss) : null;
      const url = bm && typeof portraits !== 'undefined' ? portraits[bm.id] : '';
      const mt = /^data:image\/(gif|png|webp|jpeg|jpg);base64,/i.exec(url || '');
      if(mt){ const ext = mt[1].toLowerCase().replace('jpeg', 'jpg'); pic = { name: 'boss-' + bm.id + '.' + ext, url, key: bm.id + ':' + url.length }; }
    } catch(e) {}
    // lines lead with the name, then the map, then a countdown Discord keeps ticking by itself
    const line = (m, txt)=> `**${m.name}** · ${cut(plain(m.location), 34)} · ${txt}`;
    const n = (k, w)=> `**${k}** ${w}`;
    const summary = [n(floating.length, 'floating'), n(overdue.length, 'overdue'), n(next.length, 'coming up')].join(' · ');
    const parts = [summary];
    // ⏰ ending within 10 minutes gets its own group on top, so the urgent ones don't get lost in a long list
    const SOON = 10 * 60000, NOW = 5 * 60000;
    const ending = floating.filter(m=> m.min !== m.max && close(m) - now <= SOON), floatRest = floating.filter(m=> !ending.includes(m));
    const fl = m=> line(m, m.min === m.max ? `spawned **${at(open(m), 'R')}**` : `ends **${at(close(m), 'R')}**`);
    if(ending.length) parts.push('**⏰ Ending soon**\n' + ending.map(fl).join('\n'));
    if(floatRest.length) parts.push('**🟢 Floating now**\n' + floatRest.map(fl).join('\n'));
    if(overdue.length) parts.push('**🔴 Overdue**\n' + overdue.map(m=> line(m, `overdue since **${at(close(m), 'R')}**`)).join('\n'));
    if(!floating.length && !overdue.length) parts.push('*Nothing floating or overdue right now.*');
    // "Next up" as columns (side by side on PC): name · map · when
    const fields = next.length ? [
      // ⚡ spawning within 5 minutes: get ready
      { name: '⏳ Next up', value: next.map(m=> (open(m) - now <= NOW ? '⚡ ' : '') + '**' + cut(m.name, 18) + '**').join('\n'), inline: true },
      { name: 'Map', value: next.map(m=> cut(plain(m.location), 18)).join('\n'), inline: true },
      { name: 'Spawns', value: next.map(m=> open(m) - now <= NOW ? '**' + at(open(m), 'R') + '**' : at(open(m), 'R')).join('\n'), inline: true },
    ] : [{ name: '⏳ Next up', value: '*No timers running*', inline: false }];
    const site = siteUrl();
    const main = {
      title: 'Falsehood MVP board', color: overdue.length ? COLOR.over : floating.length ? COLOR.float : COLOR.quiet,
      description: parts.join('\n\n').slice(0, 3990) + '\n\u200b', fields,   // \u200b: a blank line before Next up (Discord drops plain trailing newlines)
      footer: { text: 'Updates automatically while a guild tracker is open · last update' }, timestamp: new Date(now).toISOString() };
    if(site){ main.url = site; main.thumbnail = { url: site + 'apple-touch-icon.png' }; }
    const embeds = [main];
    // the Boss Event always has its own card on top: orange while it's up, dimmer once it's killed
    if(beUp) embeds.unshift({ color: COLOR.event, title: `🔥 BOSS EVENT · ${cut(beBoss, 60).toUpperCase()} IS UP`,
      description: `📍 **${beMap || '?'}** · spawned ${at(be.lastDeath, 'R')} (${at(be.lastDeath)})` });
    else if(be && be.lastDeath) embeds.unshift({ color: COLOR.done, title: `✅ BOSS EVENT · ${cut(beBoss, 60).toUpperCase()} ${be.ev === 'spawn' ? 'SPAWNED' : 'KILLED'}`,
      description: `📍 **${beMap || '?'}** · ${at(be.lastDeath, 'R')} (${at(be.lastDeath)})` });
    if(pic && be && be.lastDeath) embeds[0].thumbnail = { url: 'attachment://' + pic.name };
    // what the board says, without the times that tick by themselves: an edit is only needed when this changes
    const sig = JSON.stringify([ending.map(m=> m.id), next.filter(m=> open(m) - now <= NOW).map(m=> m.id), floating.map(m=> m.id + m.lastDeath), overdue.map(m=> m.id + m.lastDeath), next.map(m=> m.id + m.lastDeath + m.location), be ? [be.lastDeath, be.ev, be.location, be.killer, beUp] : 0, Math.floor(now / (10 * 60000))]);
    return { sig: sig + '|' + (pic ? pic.key : ''), pic, body: { username: 'Falsehood MVP Tracker', avatar_url: avatar(), allowed_mentions: { parse: [] }, embeds } };
  }
  const boardBusy = {}, boardSeen = {};
  async function board(h){
    if(boardBusy[h.doc]) return;
    const { sig, body, pic } = boardBody();
    if(sig === boardSeen[h.doc]) return;
    boardBusy[h.doc] = true;
    const ref = fs().doc(h.doc);
    try {
      // one device edits at a time; skip if the board already shows this
      const me = window.FALSEHOOD_UID || 'x';
      const st = await fs().runTransaction(async tx=>{
        const d = (await tx.get(ref)).data() || {};
        if(d.url === h.url && d.sig === sig && d.id){ return { skip: true, d }; }
        if(d.lockUntil > Date.now() && d.lockBy !== me) return { skip: true, busy: true, d };
        tx.set(ref, Object.assign({}, d, { lockUntil: Date.now() + 20000, lockBy: me }));
        return { skip: false, d };
      });
      if(st.skip){ if(!st.busy) boardSeen[h.doc] = sig; return; }
      const d = st.d;
      let id = d.url === h.url ? d.id : null;     // a new webhook (another channel) starts a new board
      let ok = false;
      const picKey = pic ? pic.key : '';
      // the boss picture is uploaded only when it changes; otherwise the one already on the message is kept
      const req = async (url, method, withPic)=>{
        if(withPic && pic){
          const fd = new FormData(), blob = await (await fetch(pic.url)).blob();
          fd.append('payload_json', JSON.stringify(Object.assign({}, body, { attachments: [{ id: 0, filename: pic.name }] })));
          fd.append('files[0]', blob, pic.name);
          return fetch(url, { method, body: fd });
        }
        const b = withPic ? Object.assign({}, body, { attachments: [] }) : body;   // no picture any more: remove the old one
        return fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
      };
      if(id){
        const r = await req(h.url + '/messages/' + id, 'PATCH', (d.pic || '') !== picKey);
        ok = r.ok;
        if(r.status === 404) id = null;              // someone deleted the board: post a new one
      }
      if(!id){
        const r = await req(h.url + (h.url.includes('?') ? '&' : '?') + 'wait=true', 'POST', !!pic);
        if(r.ok){ const j = await r.json(); id = j && j.id; ok = !!id; }
      }
      await ref.set({ id: id || null, url: h.url, sig: ok ? sig : (d.sig || ''), pic: ok ? picKey : (d.pic || ''), editedAt: Date.now(), by: me, lockUntil: 0, lockBy: null });
      if(ok) boardSeen[h.doc] = sig;
    } catch(e) {
      try { await ref.set({ lockUntil: 0, lockBy: null }, { merge: true }); } catch(x) {}
    } finally { boardBusy[h.doc] = false; }
  }

  // ---------- Admin setup ----------
  window.falsehoodDiscordSetup = async ()=>{
    if(window.FALSEHOOD_ROLE !== 'admin' || !fs()) return;
    let cur = null;
    try { const s = await fs().doc('config_discord/main').get(); cur = s.exists ? s.data() : null; } catch(e) {}
    const ov = document.createElement('div'); ov.className = 'dc-ov';
    ov.innerHTML = `<div class="dc-card" role="dialog" aria-label="Discord board">
      <h4>💬 Discord board</h4>
      <p>Keeps a live MVP board in a Discord channel: one message that updates itself (pin it once in Discord). No pings. Any FLHD / Timers / Admin with the tracker open does the updating.</p>
      <ol><li>In Discord: <b>Server Settings → Integrations → Webhooks → New Webhook</b>.</li><li>Pick the channel, then <b>Copy Webhook URL</b>.</li><li>Paste it here and press <b>Save &amp; turn on</b>.</li></ol>
      <div class="dc-sec">Channel 1</div>
      <input class="dc-url" type="url" placeholder="https://discord.com/api/webhooks/…" autocomplete="off" spellcheck="false">
      <div class="dc-sec">Channel 2 <small>(optional: the same live board in a second channel)</small></div>
      <input class="dc-url2" type="url" placeholder="Leave empty for one channel only" autocomplete="off" spellcheck="false">
      <label class="dc-ck dc-solo-l"><input type="checkbox" class="dc-solo"> <span>🧪 <b>Test mode: only my tracker updates Discord</b>. Everyone else’s tracker (old or new version) stops posting. Discord only updates while your tracker is open.</span></label>
      <div class="dc-st">${cur && cur.onlyBy ? '🧪 <b>Test mode</b>: only ' + (cur.onlyBy === window.FALSEHOOD_UID ? 'your tracker' : 'the Admin’s tracker') + ' updates Discord.' : cur && cur.on ? '✓ The Discord board is <b>on</b>.' : cur && cur.url ? 'The Discord board is <b>off</b>.' : 'Not set up yet.'}</div>
      <div class="dc-acts">
        ${cur && (cur.on || cur.onlyBy) ? '<button type="button" class="dc-off">Turn off</button>' : ''}
        <button type="button" class="dc-test">Send test</button>
        <button type="button" class="dc-close">Close</button>
        <button type="button" class="dc-save">Save &amp; turn on</button>
      </div></div>`;
    document.body.appendChild(ov);
    const inp = ov.querySelector('.dc-url'), st = ov.querySelector('.dc-st');
    if(cur && cur.url) inp.value = cur.url;
    ov.querySelector('.dc-solo').checked = !!(cur && cur.onlyBy);
    const inp2 = ov.querySelector('.dc-url2');
    if(cur && cur.url2) inp2.value = cur.url2;

    const say = (t, k)=>{ st.className = 'dc-st' + (k ? ' ' + k : ''); st.innerHTML = t; };
    const valid = ()=>{ const u = inp.value.trim(); if(!HOOK_RE.test(u)){ say('That doesn’t look like a Discord webhook URL. It starts with https://discord.com/api/webhooks/', 'bad'); return null; } return u; };
    ov.querySelector('.dc-close').onclick = ()=> ov.remove();
    ov.onclick = e=>{ if(e.target === ov) ov.remove(); };
    const valid2 = ()=>{ const u = inp2.value.trim(); if(!u) return ''; if(!HOOK_RE.test(u)){ say('Channel 2 doesn’t look like a Discord webhook URL. Leave it empty, or paste one that starts with https://discord.com/api/webhooks/', 'bad'); return null; } if(u === inp.value.trim()){ say('Channel 2 is the same webhook as channel 1. Use a webhook from another channel, or leave it empty.', 'bad'); return null; } return u; };
    ov.querySelector('.dc-test').onclick = async ()=>{
      const u = valid(); if(!u) return;
      const u2 = valid2(); if(u2 === null) return;
      say('Sending…');
      try {
        const ok = [await send(u, '✅ **Falsehood MVP Tracker** is connected (channel 1).')];
        if(u2) ok.push(await send(u2, '✅ **Falsehood MVP Tracker** is connected (channel 2).'));
        say(ok.every(Boolean) ? 'Test sent. Check your Discord channel' + (u2 ? 's.' : '.') : 'Discord refused it. Check the webhook URL' + (u2 ? 's.' : '.'), ok.every(Boolean) ? 'ok' : 'bad');
      }
      catch(e) { say('Couldn’t reach Discord. Check the URL and your connection.', 'bad'); }
    };
    ov.querySelector('.dc-save').onclick = async ()=>{
      const u = valid(); if(!u) return;
      const u2 = valid2(); if(u2 === null) return;
      const solo = ov.querySelector('.dc-solo').checked, me = window.FALSEHOOD_UID || null;
      // test mode keeps "on" false, so trackers that don't know about test mode (old versions) stay quiet
      try { await fs().doc('config_discord/main').set({ url: u, on: !solo, onlyBy: solo ? me : null, board: true, posts: false, url2: u2 || null, board2: !!u2, posts2: false, since: Date.now(), by: me });
        say(solo ? '✓ Saved. 🧪 Test mode: only your tracker updates Discord.' : '✓ Saved. The Discord board is on (everyone’s trackers update it).', 'ok'); setTimeout(()=> ov.remove(), 1500); }
      catch(e) { say('Couldn’t save (' + ((e && e.code) || 'error') + '). Update the Firebase rules first.', 'bad'); }
    };
    const off = ov.querySelector('.dc-off');
    if(off) off.onclick = async ()=>{
      try { await fs().doc('config_discord/main').set(Object.assign({}, cur, { on: false, onlyBy: null })); say('The Discord board is off.', 'ok'); setTimeout(()=> ov.remove(), 1000); }
      catch(e) { say('Couldn’t save (' + ((e && e.code) || 'error') + ').', 'bad'); }
    };
    inp.focus();
  };
})();
</script>
