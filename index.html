  canKill: ()=> canWrite && mode !== 'connecting',
  kill: m=> logKill(m, 0),
  isHidden: m=> isHidden(m),
  byName: async m=>{
    if(!userApi || !m.by || mode !== 'live') return '';
    try {
      const ps = await userApi.profiles([m.by]);
      const p = ps[m.by];
      return p && p.isMe ? 'you' : ((p && p.name) || 'a guildmate');
    } catch(e) { return ''; }
  },
  goTo(m){
    if(currentTab !== m.type){
      currentTab = m.type;
      try { localStorage.setItem('falsehood-tab', currentTab); } catch(e) {}
      showHidden = false;
    }
    render();
    const i = rendered.indexOf(m);
    const el = document.querySelectorAll('#mvpList .item')[i];
    if(el){
      el.scrollIntoView({ block:'center', behavior: reduceMotion ? 'auto' : 'smooth' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
  }
};
/* ================= SPAWN ALERTS ================= */
// Banners that stay until dismissed, live countdowns, "Killed it", pre-alerts, repeat chime, voice.
let alertsOn = (()=>{ try { return localStorage.getItem('falsehood-alerts') === '1'; } catch(e) { return false; } })();
let alertCfg = { pre: 5, repeat: true, voice: false, banner: true, sound: true, desktop: true, title: true, mvp: true, mini: true, overdue: true, voiceName: '', rate: 1.05, pitch: 1, vol: 1 };
try { Object.assign(alertCfg, JSON.parse(localStorage.getItem('falsehood-alert-settings') || '{}')); } catch(e) {}
// Alert cards are always on; desktop notifications and tab flashing are removed
alertCfg.banner = true; alertCfg.desktop = false; alertCfg.title = false;
function saveAlertCfg(){ try { localStorage.setItem('falsehood-alert-settings', JSON.stringify(alertCfg)); } catch(e) {} }

let audioCtx = null;
const ORIGINAL_TITLE = document.title;
let titleTimer = null;
const prevStatus = {};
mvps.forEach(m=> prevStatus[m.id] = getStatus(m));
const preFired = {};          // id -> the kill time a pre-alert was already shown for
const banners = new Map();    // key -> { m, kind, death, el }
let lastRepeat = 0;
const reduceMotion = (()=>{ try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e) { return false; } })();
const escA = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tone(freqs, gap, vol){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    freqs.forEach((freq,i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const start = t0 + i*gap;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(vol, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  } catch(e) {}
}
const playChime = ()=> tone([880, 1175, 1568], 0.18, 0.35);
const playSoft  = ()=> tone([660, 880], 0.22, 0.18);
const playLow   = ()=> tone([523, 392, 311], 0.22, 0.3);   // falling notes: the floating window has ended

function speakNow(text){
  try {
    const u = new SpeechSynthesisUtterance(text);
    const v = alertCfg.voiceName && window.speechSynthesis.getVoices().find(x=>x.name === alertCfg.voiceName);
    if(v){ u.voice = v; u.lang = v.lang; }
    u.rate = +alertCfg.rate || 1; u.pitch = +alertCfg.pitch || 1; u.volume = alertCfg.vol == null ? 1 : +alertCfg.vol;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}
function speak(text){
  if(!alertCfg.voice) return;
  speakNow(text);
}
function flashTitle(text){
  clearInterval(titleTimer);
  let on = true;
  titleTimer = setInterval(()=>{ document.title = on ? text : ORIGINAL_TITLE; on = !on; }, 1000);
  setTimeout(()=>{ clearInterval(titleTimer); document.title = ORIGINAL_TITLE; }, 15000);
}
window.addEventListener('focus', ()=>{ clearInterval(titleTimer); document.title = ORIGINAL_TITLE; });
function notify(title, body, tag){
  try {
    if('Notification' in window && Notification.permission === 'granted') new Notification(title, { body, tag });
  } catch(e) {}
}

/* ---- banner stack ---- */
const alertSection = document.createElement('section');
alertSection.className = 'alert-section';
alertSection.setAttribute('aria-label', 'Spawn alerts');
alertSection.innerHTML = '<div class="alert-head"><span class="ap-title">Spawn alerts</span><span class="alert-empty"></span></div>';
const stack = document.createElement('div');
stack.className = 'alert-stack';
stack.setAttribute('aria-live', 'assertive');
alertSection.appendChild(stack);
document.getElementById('mvpList').after(alertSection);
function paintAlertEmpty(){
  const e = alertSection.querySelector('.alert-empty');
  // Only the alerts for the open tab are shown (MVP tab: MVPs, MINI MVP tab: MINI MVPs, Storage: all)
  const tab = (typeof currentTab !== 'undefined') ? currentTab : 'mvp';
  alertSection.dataset.tab = tab;
  const shown = [...banners.values()].filter(r=> tab === 'storage' || (r.m.type || 'mvp') === tab).length;
  e.hidden = shown > 0;
  const what = tab === 'mini' ? 'MINI MVP' : tab === 'mvp' ? 'MVP' : 'MVP or MINI MVP';
  e.textContent = alertsOn
    ? `No ${what} alerts right now. They show up here when one is about to spawn, is floating, or is up.`
    : 'Alerts are off. Turn them on with the Alerts button to get spawn alerts here.';
}

function removeBanner(key){
  const r = banners.get(key);
  if(r){ r.el.remove(); banners.delete(key); }
  paintAlertEmpty();
}
function updateBanner(r){
  const m = r.m, now = Date.now();
  const min = m.lastDeath + m.min*60000, max = m.lastDeath + m.max*60000;
  let t;
  if(r.kind === 'pre') t = now < min ? `opens in ${fmtClock(min-now)}` : 'now floating';
  else t = now <= max ? `spawning in ${fmtClock(max-now)}` : `overdue ${fmtClock(now-max)}`;
  r.el.querySelector('.ab-time').textContent = t;
  setUrgent(r.el, r.kind === 'main' && now <= max && max - now < 5*60000);
  r.el.classList.toggle('is-floating', r.kind === 'main' && now <= max);
  r.el.classList.toggle('is-overdue', r.kind === 'main' && now > max);
  if(r.kind === 'main') r.el.querySelector('.ab-what').textContent = now > max ? 'is overdue' : 'is floating';
}
function showBanner(m, kind){
  if(kind === 'main') removeBanner(m.id + ':pre');
  const key = m.id + ':' + kind;
  removeBanner(key);
  const canKill = kind === 'main' && !m.test && A.canKill();
  const el = document.createElement('div');
  el.className = 'alert-banner ' + kind;
  el.dataset.type = m.type === 'mini' ? 'mini' : 'mvp';
  el.innerHTML = `
    <button class="ab-body" title="${m.test ? '' : 'Show it in the list'}">
      <span class="ab-line1">
        <span class="ab-tag"></span>
        <span class="ab-name"></span>
        <span class="ab-what"></span>
      </span>
      <span class="ab-line2">
        <span class="ab-loc"></span><span class="sep">·</span><span class="ab-time"></span>
      </span>
    </button>
    <span class="ab-actions">
      ${canKill ? '<button class="btn btn-primary ab-kill">Killed it</button>' : ''}
      <button class="btn btn-icon ab-close" aria-label="Dismiss">✕</button>
    </span>`;
  el.querySelector('.ab-tag').textContent = m.type === 'mini' ? 'MINI MVP' : 'MVP';
  el.querySelector('.ab-name').textContent = m.name;
  el.querySelector('.ab-what').textContent = kind === 'pre' ? 'floating soon' : 'is floating';
  el.querySelector('.ab-loc').textContent = m.location || '';
  const rec = { m, kind, death: m.lastDeath, el };
  banners.set(key, rec);
  updateBanner(rec);
  stack.prepend(el);
  paintAlertEmpty();

  el.querySelector('.ab-close').onclick = ()=> removeBanner(key);
  el.querySelector('.ab-body').onclick = ()=>{ if(!m.test) A.goTo(m); };
  const k = el.querySelector('.ab-kill');
  if(k) k.onclick = ()=>{ removeBanner(key); A.kill(m); };
}

function fireMain(m){
  if(alertCfg.sound) playChime();
  speak(`${m.name} is floating`);
  if(alertCfg.title) flashTitle(`⚔ ${m.name} spawning!`);
  if(alertCfg.desktop) notify(`${m.name} is in its spawn window`, `${m.location || ''}\nWindow ends in ${fmtClock(m.lastDeath + m.max*60000 - Date.now())}`, 'mvp-' + m.id);
  if(alertCfg.banner) showBanner(m, 'main');
  lastRepeat = Date.now();
}
function fireOverdue(m){
  if(alertCfg.sound) playLow();
  speak(`${m.name} is up`);
  // Re-show the card even if the floating one was dismissed; an open card just turns red by itself
  if(!banners.has(m.id + ':main')) showBanner(m, 'main');
}
function firePre(m){
  const left = m.lastDeath + m.min*60000 - Date.now();
  if(alertCfg.sound) playSoft();
  const mins = Math.max(1, Math.round(left/60000));
  speak(`${m.name} opens in ${mins} minute${mins > 1 ? 's' : ''}`);
  if(alertCfg.desktop) notify(`${m.name} opens soon`, `${m.location || ''}\nOpens in ${fmtClock(left)}`, 'mvp-pre-' + m.id);
  if(alertCfg.banner) showBanner(m, 'pre');
}

function alertsTick(){
  const now = Date.now();
  mvps.forEach(m=>{
    const s = getStatus(m);
    if(alertsOn && !A.isHidden(m) && alertCfg[m.type === 'mini' ? 'mini' : 'mvp']){
      if(prevStatus[m.id] === 'waiting' && s === 'window') fireMain(m);
      if(alertCfg.overdue && prevStatus[m.id] === 'window' && s === 'overdue') fireOverdue(m);
      if(alertCfg.pre > 0 && s === 'waiting' && preFired[m.id] !== m.lastDeath){
        const left = m.lastDeath + m.min*60000 - now;
        if(left <= alertCfg.pre*60000){
          preFired[m.id] = m.lastDeath;
          if(left > 5000) firePre(m);
        }
      }
    }
    prevStatus[m.id] = s;
  });
  // Clear a banner once someone logs or resets that MVP; otherwise keep its countdown ticking
  banners.forEach((r,key)=>{
    if(!r.m.test && r.m.lastDeath !== r.death) removeBanner(key);
    else updateBanner(r);
  });
  if(alertsOn && alertCfg.repeat && alertCfg.sound && now - lastRepeat >= 30000 &&
     [...banners.values()].some(r=> r.kind === 'main' && !r.m.test && getStatus(r.m) === 'window')){
    playChime();
    lastRepeat = now;
  }
}

/* ---- header controls: Alerts toggle + settings ---- */
const alertBtn = document.getElementById('alertBtn');
function paintAlertBtn(){
  alertBtn.textContent = alertsOn ? '🔔 Alerts on' : '🔕 Alerts off';
  alertBtn.classList.toggle('on', alertsOn);
}
alertBtn.onclick = ()=>{
  alertsOn = !alertsOn;
  try { localStorage.setItem('falsehood-alerts', alertsOn ? '1' : '0'); } catch(e) {}
  paintAlertBtn();
  paintAlertEmpty();
  if(typeof paintPanel === 'function') paintPanel();
  if(alertsOn){
    if(alertCfg.sound) playChime();
    try { if(alertCfg.desktop && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch(e) {}
  } else {
    [...banners.keys()].forEach(removeBanner);
  }
};
paintAlertBtn();
paintAlertEmpty();
document.addEventListener('click', ()=>{
  if(alertsOn && !audioCtx){ try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
}, { once:true });

const apWrap = document.createElement('span');
apWrap.className = 'ap-wrap';
const SW = (key, label, hint) => `
  <label class="ap-switch" for="ap-${key}">
    <span class="ap-text"><span class="ap-label">${label}</span>${hint ? `<span class="ap-hint">${hint}</span>` : ''}</span>
    <input type="checkbox" role="switch" id="ap-${key}" data-key="${key}">
  </label>`;
apWrap.innerHTML = `
  <button class="btn btn-icon" id="apBtn" title="Notification settings" aria-label="Notification settings" aria-expanded="false">⚙</button>
  <div class="alert-panel" id="apPanel" hidden>
    <div class="ap-title">Notification settings</div>
    ${SW('master', 'Spawn alerts', 'Turns every notification below on or off')}
    <div class="ap-group" id="apGroup">
      <div class="ap-sub">Alert me for</div>
      ${SW('mvp', 'MVP')}
      ${SW('mini', 'MINI MVP')}
      ${SW('overdue', 'Overdue', 'Red card and a low chime when floating ends')}
      <div class="ap-sub">How</div>
      ${SW('sound', 'Sound', 'Chime when something spawns')}
      ${SW('repeat', 'Repeat sound', 'Every 30s until the alert card is dismissed')}
      ${SW('voice', 'Voice callout', 'Says the MVP name out loud')}
      <div class="ap-voice" id="apVoiceBox">
        <div class="ap-row"><label for="apVoiceName">Voice</label><select id="apVoiceName"></select></div>
        <div class="ap-row"><label for="apRate">Speed</label><input type="range" id="apRate" min="0.6" max="1.6" step="0.05"><span class="ap-val" id="apRateVal"></span></div>
        <div class="ap-row"><label for="apPitch">Pitch</label><input type="range" id="apPitch" min="0.5" max="1.5" step="0.05"><span class="ap-val" id="apPitchVal"></span></div>
        <div class="ap-row"><label for="apVol">Volume</label><input type="range" id="apVol" min="0.1" max="1" step="0.05"><span class="ap-val" id="apVolVal"></span></div>
        <button class="btn" id="apVoiceTest" type="button">▶ Preview voice</button>
      </div>
      <div class="ap-row">
        <label for="apPre">Heads-up before spawn</label>
        <select id="apPre">
          <option value="0">Off</option><option value="1">1 min</option>
          <option value="3">3 min</option><option value="5">5 min</option>
        </select>
      </div>
      <button class="btn" id="apTest">Test alert</button>
    </div>
  </div>`;
alertBtn.after(apWrap);
const apPanel = apWrap.querySelector('#apPanel');
const apBtn = apWrap.querySelector('#apBtn');
function paintPanel(){
  if(typeof paintVoice === 'function') paintVoice();
  apWrap.querySelectorAll('input[data-key]').forEach(inp=>{
    inp.checked = inp.dataset.key === 'master' ? alertsOn : !!alertCfg[inp.dataset.key];
  });
  apWrap.querySelector('#apPre').value = String(alertCfg.pre);
  apWrap.querySelector('#apGroup').classList.toggle('off', !alertsOn);
  apWrap.querySelector('#ap-repeat').disabled = !alertCfg.banner || !alertCfg.sound;
}
paintPanel();
apBtn.onclick = e=>{
  e.stopPropagation();
  apPanel.hidden = !apPanel.hidden;
  apBtn.setAttribute('aria-expanded', String(!apPanel.hidden));
  paintPanel();
};
apPanel.onclick = e=> e.stopPropagation();
document.addEventListener('click', ()=>{ if(!apPanel.hidden){ apPanel.hidden = true; apBtn.setAttribute('aria-expanded','false'); } });
apWrap.querySelectorAll('input[data-key]').forEach(inp=>{
  inp.onchange = ()=>{
    const k = inp.dataset.key;
    if(k === 'master'){
      if(inp.checked !== alertsOn) alertBtn.click();
    } else {
      alertCfg[k] = inp.checked;
      saveAlertCfg();
      if(k === 'desktop' && inp.checked){
        try { if('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch(e) {}
      }
      if(k === 'banner' && !inp.checked) [...banners.keys()].forEach(removeBanner);
      if((k === 'mvp' || k === 'mini') && !inp.checked){
        banners.forEach((r,key)=>{ if(!r.m.test && r.m.type === k) removeBanner(key); });
      }
    }
    paintPanel();
  };
});
apWrap.querySelector('#apPre').onchange = e=>{ alertCfg.pre = parseInt(e.target.value, 10) || 0; saveAlertCfg(); };

/* ---- voice picker ---- */
function fillVoices(){
  const sel = apWrap.querySelector('#apVoiceName');
  let voices = [];
  try { voices = window.speechSynthesis.getVoices(); } catch(e) {}
  // English voices first, then the rest; each shows its language
  voices = voices.slice().sort((a,b)=>(b.lang.startsWith('en') - a.lang.startsWith('en')) || a.name.localeCompare(b.name));
  sel.innerHTML = '<option value="">Browser default</option>' +
    voices.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}">${v.name.replace(/</g,'&lt;')} (${v.lang})</option>`).join('');
  sel.value = voices.some(v=>v.name === alertCfg.voiceName) ? alertCfg.voiceName : '';
  sel.disabled = !voices.length;
  if(!voices.length) sel.innerHTML = '<option value="">No voices found on this device</option>';
}
fillVoices();
try { window.speechSynthesis.onvoiceschanged = fillVoices; } catch(e) {}
function pct(v){ return Math.round(v * 100) + '%'; }
function paintVoice(){
  const box = apWrap.querySelector('#apVoiceBox');
  box.hidden = !alertCfg.voice;
  apWrap.querySelector('#apRate').value = alertCfg.rate;   apWrap.querySelector('#apRateVal').textContent = (+alertCfg.rate).toFixed(2) + '×';
  apWrap.querySelector('#apPitch').value = alertCfg.pitch; apWrap.querySelector('#apPitchVal').textContent = (+alertCfg.pitch).toFixed(2);
  apWrap.querySelector('#apVol').value = alertCfg.vol;     apWrap.querySelector('#apVolVal').textContent = pct(+alertCfg.vol);
}
paintVoice();
apWrap.querySelector('#apVoiceName').onchange = e=>{ alertCfg.voiceName = e.target.value; saveAlertCfg(); speakNow('Pharaoh is floating'); };
[['#apRate','rate'],['#apPitch','pitch'],['#apVol','vol']].forEach(([id,k])=>{
  const el = apWrap.querySelector(id);
  el.oninput = ()=>{ alertCfg[k] = +el.value; paintVoice(); };
  el.onchange = ()=>{ saveAlertCfg(); };
});
apWrap.querySelector('#apVoiceTest').onclick = ()=>{ try { window.speechSynthesis.cancel(); } catch(e) {} speakNow('Pharaoh is floating'); };
apWrap.querySelector('#apTest').onclick = ()=>{
  const demo = { id:'__test', test:true, name:'Test MVP', type:'mvp', min:0, max:10, lastDeath: Date.now(), location:'This is how a spawn alert looks' };
  if(alertCfg.sound) playChime();
  speak('Test MVP is floating');
  if(alertCfg.title) flashTitle('⚔ Test MVP spawning!');
  if(alertCfg.desktop) notify('Test MVP is floating', 'This is how a spawn alert looks', 'mvp-test');
  if(alertCfg.banner) showBanner(demo, 'main');
};

/* ================= START ================= */
setSync();
render();
connect();

/* ================= LIVE TICK ================= */
setInterval(()=>{
  sweepStale();
  alertsTick();
  renderNextUp();
  const sorted = visibleList().sort(compareMvps);
  const orderChanged = sorted.length !== rendered.length || sorted.some((m,i)=> m !== rendered[i]);
  if(orderChanged || pendingRender){
    requestRender();
    if(!pendingRender) return;
  }
  document.querySelectorAll('#mvpList .item').forEach((el,i)=>{
    const m = rendered[i];
    if(!m) return;
    el.querySelector('.status').innerHTML = getStatusHTML(m);
    applyStatus(el, m);
  });
  renderSummary();
  if(tabSignature() !== tabSig) renderTabs();
}, 1000);
</script>
