<script>
(function(){
  const cfg = window.FALSEHOOD_FIREBASE;
  if(!cfg || !window.firebase) return;            // no config: the tracker runs in this-device mode
  window.FALSEHOOD_HOST = 'firebase';
  firebase.initializeApp(cfg);
  const auth = firebase.auth();
  const fs = firebase.firestore();

  // Short lease on a doc, used by the tracker to hand out item numbers one at a time
  firebase.firestore.DocumentReference.prototype.acquire = async function(opts){
    const lock = fs.collection('locks').doc(this.path.replace(/\//g, '_'));
    const holder = (opts && opts.holder) || String(Math.random());
    const ttl = (opts && opts.ttlMs) || 4000;
    const ok = await fs.runTransaction(async tx=>{
      const s = await tx.get(lock);
      const d = s.exists ? s.data() : null;
      if(d && d.until > Date.now() && d.holder !== holder) return false;
      tx.set(lock, { holder, until: Date.now() + ttl });
      return true;
    });
    if(ok) held.set(this.path, lock);
    return { acquired: ok };
  };
  // Saving the leased doc releases the lease, so the next person doesn't wait for it to expire
  const held = new Map();
  const origSet = firebase.firestore.DocumentReference.prototype.set;
  firebase.firestore.DocumentReference.prototype.set = async function(...args){
    const r = await origSet.apply(this, args);
    const lock = held.get(this.path);
    if(lock){ held.delete(this.path); lock.delete().catch(()=>{}); }
    return r;
  };

  let gateDone = null;
  let role = 'editor';
  // Editor password first, then the view-only one; the security rules decide which matches
  async function join(uid, pass){
    for(const r of ['editor', 'viewer']){
      try { await fs.collection('members').doc(uid).set({ pass, role: r, joinedAt: Date.now() }); return r; }
      catch(x) { if(!(x && x.code === 'permission-denied')) throw x; }
    }
    return null;
  }
  // Access badge beside LIVE: shows Editor / View only, click for switch + log out
  function showRole(){
    const sync = document.getElementById('sync');
    if(!sync || document.getElementById('fbRole')) return;
    const b = document.createElement('button');
    b.id = 'fbRole'; b.type = 'button';
    b.className = 'fb-role ' + role;
    b.textContent = role === 'editor' ? '✎ Editor' : '👁 View only';
    b.title = 'Your access on this device. Click for options.';
    sync.after(b);
    const menu = document.createElement('div');
    menu.className = 'fb-menu'; menu.hidden = true;
    menu.innerHTML = `<div class="m-info">${role === 'editor'
        ? 'You have <b>edit access</b> on this device: you can log kills and manage storage.'
        : 'You have <b>view-only access</b> on this device: you can see everything but can’t make changes.'}</div>
      ${role === 'viewer' ? '<button type="button" class="m-up">🔑 Enter editor password</button>' : ''}
      <button type="button" class="m-out">⎋ Log out of this device</button>`;
    document.body.appendChild(menu);
    b.onclick = e=>{
      e.stopPropagation();
      if(!menu.hidden){ menu.hidden = true; return; }
      const r = b.getBoundingClientRect();
      menu.hidden = false;
      menu.style.top = (r.bottom + 6) + 'px';
      menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + 'px';
    };
    document.addEventListener('click', e=>{ if(!menu.contains(e.target)) menu.hidden = true; });
    const up = menu.querySelector('.m-up');
    if(up) up.onclick = ()=>{ menu.hidden = true; window.falsehoodUnlock(); };
    menu.querySelector('.m-out').onclick = async ()=>{
      if(!confirm('Log out of the Falsehood tracker on this device? You’ll need a password to get back in.')) return;
      try { await auth.signOut(); } catch(e) {}
      location.reload();
    };
  }
  window.falsehoodUnlock = async ()=>{
    const uid = auth.currentUser && auth.currentUser.uid;
    if(!uid) return;
    const r = await askPassword(uid, true);
    if(r === 'editor') location.reload();
  };
  function askPassword(uid, upgrade){
    return new Promise(resolve=>{
      const g = document.createElement('div');
      g.id = 'fbGate';
      g.innerHTML = `<form class="g-card">
        <h2>Falsehood</h2>
        <p>${upgrade ? 'Enter the editor password to log kills and manage storage.' : 'Enter the guild password to open the shared timers and storage. You only need to do this once on this device.'}</p>
        <input type="password" autocomplete="current-password" placeholder="Guild password" aria-label="Guild password">
        <div class="g-err" role="alert"></div>
        <div class="g-row"><button type="button" class="g-skip">${upgrade ? 'Cancel' : 'Use offline'}</button><button class="g-go">Enter</button></div>
      </form>`;
      document.body.appendChild(g);
      const form = g.querySelector('form'), inp = g.querySelector('input'), err = g.querySelector('.g-err'), go = g.querySelector('.g-go');
      inp.focus();
      g.querySelector('.g-skip').onclick = ()=>{ g.remove(); resolve(false); };
      form.onsubmit = async e=>{
        e.preventDefault();
        const pass = inp.value;
        if(!pass) return;
        go.disabled = true; err.textContent = '';
        try {
          const r = await join(uid, pass);
          if(!r || (upgrade && r !== 'editor')){
            err.textContent = upgrade ? 'That isn’t the editor password.' : 'Wrong password. Ask a guild officer for it.';
            go.disabled = false; inp.select(); return;
          }
          g.remove(); resolve(r);
        } catch(x) {
          err.textContent = 'Couldn’t connect. Check your internet and try again.';
          go.disabled = false; inp.select();
        }
      };
    });
  }
  async function ready(){
    if(gateDone) return gateDone;
    gateDone = (async ()=>{
      try {
        await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        const cred = auth.currentUser ? { user: auth.currentUser } : await new Promise((res, rej)=>{
          const off = auth.onAuthStateChanged(u=>{ off(); u ? res({ user: u }) : auth.signInAnonymously().then(res, rej); });
        });
        const uid = cred.user.uid;
        let member = false;
        try {
          const me = await fs.collection('members').doc(uid).get();
          if(me.exists){ member = true; role = (me.data() || {}).role === 'viewer' ? 'viewer' : 'editor'; }
        } catch(e) { member = false; }
        if(!member){
          if(document.readyState === 'loading') await new Promise(r=> document.addEventListener('DOMContentLoaded', r, { once:true }));
          const r = await askPassword(uid, false);
          if(r){ member = true; role = r; }
        }
        if(member && role === 'viewer') document.body.classList.add('viewonly');
        if(member) showRole();
        if(member && role === 'editor') await importOnce(uid);
        return member ? uid : null;
      } catch(e) { console.warn('Firebase sign-in failed', e); return null; }
    })();
    return gateDone;
  }

  const IMPORT = window.FALSEHOOD_IMPORT || null;
  const names = Object.assign({}, IMPORT && IMPORT.names);
  let namesOn = false;
  // One-time copy of the old Claude board (timers, storage, pictures, history) into Firebase
  async function importOnce(uid){
    if(!IMPORT) return;
    const flag = fs.doc('meta/imported');
    let mine = false;
    try {
      mine = await fs.runTransaction(async tx=>{
        const s = await tx.get(flag);
        if(s.exists) return false;
        tx.set(flag, { at: Date.now(), by: uid });
        return true;
      });
    } catch(e) { return; }
    if(!mine) return;
    const writes = [];
    for(const col of ['loot', 'lootfiles', 'lootlog']){
      for(const [id, data] of Object.entries(IMPORT[col] || {})) writes.push(fs.collection(col).doc(id).set(data));
    }
    for(const [id, data] of Object.entries(IMPORT.mvps || {})){
      writes.push((async ()=>{
        const ref = fs.collection('mvps').doc(id);
        const cur = await ref.get();
        if(!cur.exists) await ref.set(data);         // keep anything already logged on the new board
      })());
    }
    writes.push((async ()=>{
      const ref = fs.doc('meta/counter');
      const cur = await ref.get();
      const last = cur.exists ? (+(cur.data() || {}).last || 0) : 0;
      if(last < (IMPORT.counter || 0)) await ref.set({ last: IMPORT.counter });
    })());
    try { await Promise.all(writes); } catch(e) { console.warn('Import incomplete', e); }
  }
  function watchNames(){
    if(namesOn) return; namesOn = true;
    fs.collection('names').onSnapshot(s=>{ s.docs.forEach(d=>{ names[d.id] = (d.data() || {}).name; }); }, ()=>{});
  }
  window.claude = {
    async use(what){
      const uid = await ready();
      if(!uid) return null;
      watchNames();
      if(what === 'db') return fs;
      if(what === 'user') return {
        id: async ()=> uid,
        can: async ()=> role === 'editor',
        profiles: async ids=>{
          const out = {};
          ids.forEach(id=>{ out[id] = { name: names[id] || null, isMe: id === uid }; });
          return out;
        },
      };
      return null;
    },
  };
})();
</script>

<body>
<title>Falsehood MVP Tracker</title>

<style>
/* Layout: one slim header line, then a two-column grid of compact MVP rows (one column on narrow screens) */
:root {
  --update-bg: #2a2233; --update-ink: #f6f3fb; --update-hover: #3a3146;
  --row-overdue: #fff0f2;
  --brand-glow: rgba(123,47,242,.25);

  --bone: #2a2233;

  --surface: #ffffff;
  --surface-2: #f6f3fb;
  --border: #e0d8ee;
  --text: #18121f;
  --text-2: #625a72;
  --text-3: #9a92a8;
  --accent: #7b2ff2;
  --accent-2: #a52fe0;
  --gold: #a52fe0;
  --input-bg: #ffffff;
  --green: #1f9d55;
  --on-accent: #ffffff;

  --waiting: #9a6b00;  --waiting-bg: #fff3c4;

  --window:  #15803d;  --window-bg:  #dcfce7;
  --overdue: #c0263e;  --overdue-bg: #fde2e6;
  --unknown: #948ea2;  --unknown-bg: #f0eef4;

  --row-window: #effcf3;
  --shadow: 0 1px 2px rgba(40,20,70,.06), 0 6px 18px rgba(60,30,110,.07);
  --scrim: rgba(10,8,14,.55);

  --font-display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --update-bg: #ece6f2; --update-ink: #18121f; --update-hover: #ffffff;
  --row-overdue: #26101a;
  --brand-glow: rgba(176,110,255,.45);
  --window-glow: rgba(74,222,128,.35);
  --bone: #ece6f2;
    --bg: #0b0810;
    --bg-grad: radial-gradient(circle at 12% 0%, #2c1258 0%, transparent 45%), radial-gradient(circle at 88% 0%, #22093f 0%, transparent 42%);
    --surface: #15111d; --surface-2: #1c1727; --border: #2b2340;
    --text: #efeaf6; --text-2: #a89fba; --text-3: #6c6480;
    --accent: #8f4dff; --accent-2: #d06bff; --gold: #d06bff;
    --input-bg: #0f0c16; --green: #5fd18e; --on-accent: #ffffff;
    --waiting: #ffd34d;  --waiting-bg: #3a2f0b;
  --row-waiting: #1c1910;
    --window:  #4ade80;  --window-bg:  #12351f;
    --overdue: #ff6b7f;  --overdue-bg: #401a24;
    --unknown: #7d768c;  --unknown-bg: #1f1b27;
    --live: #5fd18e;     --live-bg: #173325;
    --row-window: #0f2418;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
    --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --update-bg: #ece6f2; --update-ink: #18121f; --update-hover: #ffffff;
  --row-overdue: #26101a;
  --brand-glow: rgba(176,110,255,.45);
  --window-glow: rgba(74,222,128,.35);
  --bone: #ece6f2;
  --bg: #0b0810;
  --bg-grad: radial-gradient(circle at 12% 0%, #2c1258 0%, transparent 45%), radial-gradient(circle at 88% 0%, #22093f 0%, transparent 42%);
  --surface: #15111d; --surface-2: #1c1727; --border: #2b2340;
  --text: #efeaf6; --text-2: #a89fba; --text-3: #6c6480;
  --accent: #8f4dff; --accent-2: #d06bff; --gold: #d06bff;
  --input-bg: #0f0c16; --green: #5fd18e; --on-accent: #ffffff;
  --waiting: #ffd34d;  --waiting-bg: #3a2f0b;
  --row-waiting: #1c1910;
  --window:  #4ade80;  --window-bg:  #12351f;
  --overdue: #ff6b7f;  --overdue-bg: #401a24;
  --unknown: #7d768c;  --unknown-bg: #1f1b27;
  --live: #5fd18e;     --live-bg: #173325;
  --row-window: #0f2418;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
  --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}

/* ================= BASE ================= */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--text);
  background: var(--bg-grad), var(--bg);
  background-attachment: fixed;
  min-height: 100vh;
  padding-block: 12px 64px;
  padding-inline: 16px;
}
.wrap { max-width: 1400px; margin: 0 auto; }
button:focus-visible, input:focus-visible, .loc:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

/* ================= HEADER ================= */
header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 10px;
}
.emblem { display: block; width: 44px; height: 44px; flex-shrink: 0; margin: -4px 0; }
.emblem img { width: 44px; height: 44px; display: block; filter: drop-shadow(0 0 6px rgba(140, 70, 255, .35)); }
h1 {
  font-family: var(--font-display);
  font-size: 20px; letter-spacing: .06em;
  margin: 0; line-height: 1;
}
h1 .false { color: var(--bone); }
h1 .hood  { color: var(--accent); text-shadow: 0 0 14px var(--brand-glow); }
h1 small { font-family: var(--font-body); font-size: 11px; letter-spacing: .14em; color: var(--text-2); margin-left: 6px; font-weight: 500; }
.sync {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 999px;
  color: var(--unknown); background: var(--unknown-bg);
}
.sync::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.sync.live { color: var(--live); background: var(--live-bg); }
.sync.local { color: var(--overdue); background: var(--overdue-bg); }
.summary { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 4px 10px;
  font-size: 12px; color: var(--text-2);
}
.chip b { color: var(--text); font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; }

.theme-btn {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 500;
  background: var(--surface); color: var(--text-2);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer;
  box-shadow: var(--shadow);
}
.theme-btn:hover { color: var(--text); }
.alert-btn { border-radius: 999px; padding: 4px 12px; color: var(--text-2); }
.alert-btn.on { color: var(--window); border-color: var(--window); background: var(--window-bg); }
.reset-all { color: var(--overdue); border-color: color-mix(in srgb, var(--overdue) 55%, transparent); border-radius: 999px; padding: 4px 12px; }
.reset-all:hover { background: var(--overdue-bg); }

/* ================= NOTICE BANNER ================= */
.notice {
  margin-bottom: 10px; padding: 8px 12px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--waiting);
  color: var(--text-2); font-size: 12.5px; line-height: 1.45;
}
.notice b { color: var(--text); }

/* ================= LIST ================= */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 10px;
}
.item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid transparent;
  border-radius: 8px;
  padding: 5px 10px;
  display: grid;
  grid-template-columns: minmax(0,1fr) auto;
  align-items: center;
  gap: 2px 10px;
  transition: background-color .4s;
  min-width: 0;
}


.item.s-overdue { border-left-color: var(--overdue); background: var(--row-overdue); }

.line1 { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; min-width: 0; }
.status { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; min-width: 0; }
.mvp-name { font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.spawn-text { font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.line2 {
  grid-column: 1 / 2;
  display: flex; align-items: center; gap: 6px; min-width: 0;
  font-size: 11.5px; color: var(--text-2);
  white-space: nowrap; overflow: hidden;
}
.by { overflow: hidden; text-overflow: ellipsis; }
.sep { color: var(--text-3); }
.muted { color: var(--text-3); font-style: italic; }
.red { color: var(--overdue); font-weight: 700; }
.green { color: var(--green); font-weight: 700; }

/* BADGES */
.badge {
  display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
  font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 999px;
}
.badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.item.s-waiting { border-left-color: var(--waiting); background: var(--row-waiting); }
.item.s-window  { border-left-color: var(--window); background: var(--row-window); }
.b-waiting { color: var(--waiting); background: var(--waiting-bg); }
.b-window  { color: var(--window);  background: var(--window-bg); }
.b-window::before { animation: pulse 1.4s ease-in-out infinite; }
.b-window { box-shadow: 0 0 10px var(--window-glow); }
.item.s-window { box-shadow: 0 0 14px var(--window-glow); }
.item.s-window.fav { box-shadow: inset 0 0 0 1px var(--gold), 0 0 14px var(--window-glow); }
.b-overdue { color: var(--overdue); background: var(--overdue-bg); }
.b-unknown { color: var(--unknown); background: var(--unknown-bg); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .b-window::before { animation: none; } .item { transition: none; } }

/* LOCATION (editable) */
.loc {
  outline: none; border-radius: 4px; padding: 0 3px; margin-left: -3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; flex-shrink: 1; min-width: 0;
}
.loc[contenteditable="true"]:hover { background: var(--surface-2); cursor: text; }
.loc:focus { background: var(--surface-2); box-shadow: 0 0 0 1px var(--accent-2); text-overflow: clip; }

/* UPDATE CONTROLS */
.controls {
  grid-column: 2; grid-row: 1 / 3;
  display: flex; align-items: center; gap: 4px; white-space: nowrap;
  font-size: 11.5px; color: var(--text-2);
}
input[type=number] {
  width: 48px; padding: 3px 5px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--input-bg); color: var(--text); font: inherit; font-size: 12px;
}
input[type=number]:focus { outline: none; border-color: var(--accent-2); }
.btn {
  font: inherit; font-size: 12px; font-weight: 500;
  border-radius: 6px; padding: 3px 9px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.1); }
.btn-icon { padding: 3px 7px; }

/* FAVORITE + HIDE */
.star {
  background: none; border: none; padding: 0; margin: 0 -2px 0 0;
  font-size: 15px; line-height: 1; cursor: pointer; color: var(--text-3);
}
.star:hover { color: var(--gold); }
.item.fav .star { color: var(--gold); }
.item.fav { box-shadow: inset 0 0 0 1px var(--gold); }
.btn.hide { color: var(--text-3); }
.btn.hide:hover { color: var(--overdue); }

.hidden-box { margin-top: 10px; }
.hidden-toggle {
  background: none; border: none; padding: 2px 0; cursor: pointer;
  font: inherit; font-size: 12px; color: var(--text-2);
}
.hidden-toggle:hover { color: var(--text); }
.hidden-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.hidden-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px dashed var(--border);
  border-radius: 999px; padding: 3px 4px 3px 10px;
  font-size: 12px; color: var(--text-2);
}
.hidden-chip button {
  font: inherit; font-size: 11px; cursor: pointer;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface-2); color: var(--text); padding: 1px 8px;
}
.hidden-chip button:hover { border-color: var(--accent-2); }

/* TOAST */
.toast {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 12.5px; z-index: 900;
  box-shadow: var(--shadow); max-width: calc(100% - 32px);
}


/* MVP / MINI MVP TABS */
.tabs {
  display: inline-flex; gap: 2px; padding: 3px; margin-bottom: 8px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
}
.tab {
  display: inline-flex; align-items: center; gap: 7px;
  font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .02em;
  padding: 6px 14px; border: none; border-radius: 7px; cursor: pointer;
  background: transparent; color: var(--text-2);
}
.tab:hover { color: var(--text); background: var(--surface-2); }
.tab.active { background: var(--accent); color: var(--on-accent, #fff); box-shadow: 0 0 12px var(--brand-glow); }
.tab .count {
  font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
  padding: 0 6px; border-radius: 999px; background: var(--surface-2); color: var(--text-2);
}
.tab.active .count { background: rgba(255,255,255,.2); color: inherit; }
.tab .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--window); box-shadow: 0 0 6px var(--window); }
.tab.active .live-dot { background: #fff; box-shadow: 0 0 6px #fff; }


/* ================= ALERT BANNERS ================= */
[hidden] { display: none !important; }
/* Alerts live in their own section under the list, 3 per row */
.alert-section { margin-top: 14px; }
.alert-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 8px; }
.alert-head .ap-title { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.alert-empty { font-size: 12px; color: var(--text-3); }
.alert-stack { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.alert-stack:empty { display: none; }
@media (max-width: 1100px) { .alert-stack { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px)  { .alert-stack { grid-template-columns: minmax(0, 1fr); } }
.alert-banner {
  pointer-events: auto; display: flex; align-items: center; gap: 10px;
  padding: 10px 10px 10px 14px; border-radius: 12px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--window);
  box-shadow: 0 0 0 1px var(--window-glow), 0 0 26px var(--window-glow), var(--shadow);
  animation: abIn .25s ease-out;
}
.alert-banner.pre { border-color: var(--border); box-shadow: var(--shadow); padding-block: 7px; }
.ab-body {
  flex: 1; min-width: 0; display: grid; gap: 3px;
  background: none; border: none; padding: 0; margin: 0; text-align: left;
  font: inherit; color: inherit; cursor: pointer;
}
.ab-line1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ab-tag {
  font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;

.mp-list { display: flex; flex-wrap: wrap; gap: 6px; }
.mp-item { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-2); font-size: 13px; cursor: pointer; user-select: none; }
.mp-item:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.mp-item input { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.mp-item.on { color: var(--text); border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.mp-item:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.mp-empty { font-size: 12px; color: var(--text-3); }
.mp-add { display: flex; gap: 6px; }
.mp-add .mp-input { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font: inherit; font-size: 13px; }
.mp-add .mp-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--brand-glow); }
.mp-add .btn { font-size: 12.5px; padding: 6px 12px; }
.mp-tools { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-3); }
.mp-link { background: none; border: none; padding: 0; font: inherit; font-size: 12px; color: var(--accent); cursor: pointer; }
.mp-link:hover { text-decoration: underline; }
.mp-count { margin-left: auto; }
.modal .mp { margin-bottom: 10px; }


/* member picker: name + remove button */
.mp-item { padding: 0 4px 0 0; gap: 0; }
.mp-item > label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px; cursor: pointer; }
.mp-x { background: none; border: none; padding: 2px 5px; margin: 0; border-radius: 999px; font-size: 11px; line-height: 1; color: var(--text-3); cursor: pointer; }
.mp-x:hover { color: var(--overdue); background: var(--overdue-bg); }
.mp-x:focus-visible { outline: 2px solid var(--accent); }


/* picture attachments */
.st-file { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.st-thumb-btn { padding: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); cursor: zoom-in; overflow: hidden; width: 72px; height: 54px; flex-shrink: 0; }
.st-thumb-btn.missing { cursor: default; }
.st-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
.st-file-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.st-file-btn { font-size: 12px; padding: 4px 10px; }
.st-file-rm:hover { color: var(--overdue); border-color: var(--overdue); }
.modal.pic { width: min(900px, 100%); }
.st-full { display: block; max-width: 100%; max-height: 70vh; margin: 4px auto 0; border-radius: 8px; }
.st-field input[type=file] { padding: 6px 8px; font-size: 13px; color: var(--text-2); }


/* Spawn alerts follow the open tab */
.alert-section[data-tab="mvp"] .alert-banner[data-type="mini"],
.alert-section[data-tab="mini"] .alert-banner[data-type="mvp"] { display: none; }

/* ================= MODAL ================= */
.modal-overlay {
  position: fixed; inset: 0; background: var(--scrim);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
  padding: 16px;
}
.modal {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
  padding: 20px; width: 320px; max-width: 100%;
  border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.35);
}
.modal h3 { font-family: var(--font-display); margin: 0 0 8px; letter-spacing: .04em; }
.modal p { color: var(--text-2); margin: 0; line-height: 1.5; font-size: 14px; }
.modal p b { color: var(--text); }
.modal-buttons { display: flex; justify-content: flex-end; gap: 6px; margin-top: 18px; }
.modal-buttons .btn { font-size: 13px; padding: 6px 12px; }

/* ================= NARROW SCREENS ================= */
@media (max-width: 980px) {
  .grid { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .summary { margin-left: 0; }
  .item { grid-template-columns: minmax(0,1fr); }
  .controls { grid-column: 1; grid-row: auto; margin-top: 3px; flex-wrap: wrap; }
  .loc { max-width: 150px; }
}
</style>

<script>
/* ================= SAFE STORAGE (per-viewer conveniences only) ================= */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e) {} }

/* ================= THEME ================= */
(function(){
  const root = document.documentElement;
  const saved = lsGet('falsehood-theme');
  if(saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
  document.getElementById('themeBtn').onclick = ()=>{
    const current = root.getAttribute('data-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    lsSet('falsehood-theme', next);
  };
})();

/* ================= MVP LIST ================= */
let mvps = [
  { id:'mistress',     name:'Mistress',          min:60, max:180, location:'Mjolnir Mountains (mjolnir_04)' },
  { id:'orc_lord',     name:'Orc Lord',          min:60, max:180, location:'Orc Village (gef_fild10)' },
  { id:'drake',        name:'Drake',             min:60, max:180, location:'Sunken Ship B2 (treasure02)' },
  { id:'orc_hero',     name:'Orc Hero',          min:60, max:180, location:'Geffen Field (gef_fild14)' },
  { id:'phreeoni',     name:'Phreeoni',          min:60, max:180, location:'Sograt Desert (moc_fild17)' },
  { id:'stormy',       name:'Stormy Knight',     min:60, max:180, location:'Toy Factory F2 (xmas_dun02)' },
  { id:'doppel',       name:'Doppelganger',      min:60, max:180, location:'Geffen Dungeon B3 (gef_dun02)' },
  { id:'gtb',          name:'Golden Thief Bug',  min:60, max:180, location:'Prontera Culvert B4 (prt_sewb4)' },
  { id:'osiris',       name:'Osiris',            min:60, max:180, location:'Pyramid B4 (moc_pryd04)' },
  { id:'maya',         name:'Maya',              min:60, max:180, location:'Ant Hell F2 (anthell02)' },
  { id:'dark_lord',    name:'Dark Lord',         min:60, max:90,  location:'Glast Heim Churchyard (gl_chyard)' },
  { id:'eddga',        name:'Eddga',             min:60, max:90,  location:'Payon Forest (pay_fild11)' },
  { id:'amonra',       name:'Amon Ra',            min:60, max:180, location:'Pyramid B2 (moc_pryd06)' },
  { id:'garm',         name:'Garm',              min:60, max:180, location:'Lutie Field (xmas_fild01)' },
  { id:'turtle_general', name:'Turtle General',  min:60, max:70,  location:'Turtle Palace (tur_dun04)' },
  { id:'pharaoh',      name:'Pharaoh',           min:60, max:70,  location:'Sphinx F5 (in_sphinx5)' },
  { id:'samurai',      name:'Incantation Samurai', min:91, max:101, location:'Amatsu Dungeon F3 (ama_dun03)' },
  { id:'evil_snake',   name:'Evil Snake Lord',   min:94, max:104, location:'Gonryun Dungeon F3 (gon_dun03)' },
  { id:'lod',          name:'Lord Of Death',     min:133, max:143, location:'Niflheim (niflheim)' },
  { id:'moonlight',    name:'Moonlight',         min:60, max:180, location:'Payon Cave F5 (pay_dun04)' },
  { id:'bapho_maze',   name:'Baphomet Maze',     min:60, max:70,  location:'Labyrinth Forest F3 (prt_maze03)' },
  { id:'bapho_gh',     name:'Baphomet GH',       min:60, max:70,  location:'Glast Heim' },
  { id:'ghost_poring', name:'Ghostring Poring',  min:30, max:30,  location:'Payon Field (pay_fild04)' },
  { id:'angel_poring', name:'Angeling Poring',   min:30, max:30,  location:'Payon Field (pay_fild04)' },
  { id:'angel_magma',  name:'Angeling Magma',    min:60, max:90,  location:'Magma Dungeon' },
  { id:'devil_magma',  name:'Deviling Magma',    min:60, max:90,  location:'Magma Dungeon' },
  { id:'arch_magma',   name:'Arcangel Magma',    min:60, max:90,  location:'Magma Dungeon' },
  { id:'angel_toy',    name:'Angeling TOY',      min:60, max:90,  location:'Toy Factory' },
  { id:'angel_mjolnir', name:'Angeling Mjolnir', min:60, max:90,  location:'Mjolnir Mountains' },
  { id:'ghost_sunken', name:'Ghostring Sunken',  min:30, max:30,  location:'Sunken Ship' }
];
const byId = {};
mvps.forEach(m=>{ m.lastDeath = null; m.by = null; m.defaultLocation = m.location; byId[m.id] = m; });

/* ================= PERSONAL PREFS (this browser only) ================= */
let prefs = { fav:{}, hidden:{}, input:{} };
try {
  const p = JSON.parse(lsGet('falsehood-prefs') || '{}');
  prefs.fav = p.fav || {}; prefs.hidden = p.hidden || {}; prefs.input = p.input || {};
} catch(e) {}
function savePrefs(){ lsSet('falsehood-prefs', JSON.stringify(prefs)); }
const isFav = m => !!prefs.fav[m.id];
const isHidden = m => !!prefs.hidden[m.id];
const inputOf = m => prefs.input[m.id] || 0;

/* ================= SHARED STORE (with a this-device fallback) ================= */
let mode = 'connecting';   // 'connecting' | 'live' | 'local'
let canWrite = true;
let db = null, userApi = null, myId = null;
let pendingRender = false;
let firstSnapshot = true;

function loadLocalTimers(){
  try {
    const data = JSON.parse(lsGet('falsehood-local-timers') || '{}');
    mvps.forEach(m=>{
      const d = data[m.id];
      if(d){ m.lastDeath = typeof d.lastDeath === 'number' ? d.lastDeath : null; if(d.location) m.location = d.location; }
    });
  } catch(e) {}
}
function saveLocalTimers(){
  const data = {};
  mvps.forEach(m=>{ data[m.id] = { lastDeath: m.lastDeath, location: m.location }; });
  lsSet('falsehood-local-timers', JSON.stringify(data));
}

// One shared write at a time, in order
let writeChain = Promise.resolve();
function persist(m){
  if(mode === 'local'){ saveLocalTimers(); return; }
  if(mode !== 'live') return;
  const body = { lastDeath: m.lastDeath, by: m.by || null, location: m.location || '', updatedAt: Date.now() };
  writeChain = writeChain.then(()=> db.collection('mvps').doc(m.id).set(body)).catch(handleWriteError);
}
function handleWriteError(e){
  const code = e && e.code;
  if(code === 'invalid_argument' || code === 'revoked' || code === 'not_granted'){
    canWrite = false;
    showNotice('<b>View only.</b> You can see the timers and storage but can’t make changes.<button class="unlock" onclick="falsehoodUnlock()">🔑 Enter editor password</button>');
    requestRender();
  } else if(code === 'quota_exceeded'){
    showToast('The shared board is full and couldn’t save. Ask the page owner to check it.');
  } else {
    showToast('Couldn’t save that kill. Check your connection and log it again.');
  }
}

function setSync(){
  const el = document.getElementById('sync');
  el.className = 'sync' + (mode === 'live' ? ' live' : mode === 'local' ? ' local' : '');
  el.textContent = mode === 'live' ? 'Live' : mode === 'local' ? 'This device only' : 'Connecting';
  el.title = mode === 'live' ? 'Kills logged here update for everyone with this page open'
           : mode === 'local' ? 'Not connected to the shared board; timers are saved in this browser only' : '';
}

function showNotice(html){
  const n = document.getElementById('notice');
  n.innerHTML = html;
  n.hidden = false;
}

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.hidden = true; }, 4500);
}

function applySnapshot(snap){
  snap.docs.forEach(d=>{
    const m = byId[d.id];
    if(!m) return;
    const b = d.data() || {};
    m.lastDeath = typeof b.lastDeath === 'number' ? b.lastDeath : null;
    m.by = typeof b.by === 'string' ? b.by : null;
    m.location = (typeof b.location === 'string' && b.location) ? b.location : m.defaultLocation;
  });
  if(firstSnapshot){
    // Seed alert tracking from the real data so nothing fires on load
    mvps.forEach(m=> prevStatus[m.id] = getStatus(m));
    firstSnapshot = false;
  }
  sweepStale();
  requestRender();
}

async function connect(){
  let c = null;
  try { c = window.claude && window.claude.use ? window.claude : null; } catch(e) {}
  if(c){
    try { db = await c.use('db'); } catch(e) { db = null; }
    try { userApi = await c.use('user'); } catch(e) { userApi = null; }
  }
  if(!db){
    mode = 'local';
    loadLocalTimers();
    loadStorageLocal();
    loadLogLocal();
    mvps.forEach(m=> prevStatus[m.id] = getStatus(m));
    showNotice('Not connected to the shared board. Kills you log here are saved in this browser only. <b>Reload the page and enter the guild password</b> to see and update the guild’s timers.');
    setSync();
    render();
    return;
  }
  mode = 'live';
  if(userApi){
    try { myId = await userApi.id(); } catch(e) { myId = null; }
    try {
      const w = await userApi.can('data.write');
      if(w === false){
        canWrite = false;
        showNotice('<b>View only.</b> You can see the timers and storage but can’t make changes.<button class="unlock" onclick="falsehoodUnlock()">🔑 Enter editor password</button>');
      }
    } catch(e) {}
  }
  setSync();
  startStorageLive();
  db.collection('mvps').onSnapshot(applySnapshot, ()=>{
    mode = 'local';
    setSync();
    showNotice('Lost connection to the shared board. Reload the page to reconnect.');
  });
  render();
}

/* ================= HELPERS ================= */
function formatTime(ts){
  if(!ts) return '';
  return new Date(ts).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
}
function fmtClock(ms){
  const total = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(total/3600);
  const mnt = Math.floor((total%3600)/60);
  const s = total%60;
  const pad = n => String(n).padStart(2,'0');
  return h > 0 ? `${h}:${pad(mnt)}:${pad(s)}` : `${mnt}:${pad(s)}`;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= MODAL ================= */
let modalCallback = null;
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalMessage = document.getElementById('modalMessage');

document.getElementById('modalCancel').onclick = closeModal;
document.getElementById('modalConfirm').onclick = ()=>{
  if(document.getElementById('modalConfirm').disabled) return;
  const cb = modalCallback;
  closeModal();
  if(cb) cb();
};
modalOverlay.onclick = e => { if(e.target === modalOverlay) closeModal(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !modalOverlay.hidden) closeModal(); });

function openModal(title, msg, cb){
  document.querySelector('.modal').classList.remove('wide', 'pic');
  document.getElementById('modalCancel').hidden = false;
  const cbtn = document.getElementById('modalConfirm');
  cbtn.disabled = false;
  cbtn.textContent = 'Confirm';
  modalTitle.textContent = title;
  modalMessage.innerHTML = msg;
  modalCallback = cb;
  modalOverlay.hidden = false;
  document.getElementById('modalConfirm').focus();
}
function closeModal(){
  modalOverlay.hidden = true;
  modalCallback = null;
}

/* ================= SPAWN LOGIC ================= */
function getNextSpawn(m){ return m.lastDeath ? m.lastDeath + m.min*60000 : Infinity; }

function getStatus(m){
  if(!m.lastDeath) return 'unknown';
  const now = Date.now();
  if(now < m.lastDeath + m.min*60000) return 'waiting';
  if(now <= m.lastDeath + m.max*60000) return 'window';
  return 'overdue';
}

/* Order: In window → Overdue → Waiting (soonest first) → Unknown; favorites first within each */
const STATUS_RANK = { window:0, overdue:1, waiting:2, unknown:3 };
function compareMvps(a,b){
  const sa = getStatus(a), sb = getStatus(b);
  if(sa !== sb) return STATUS_RANK[sa] - STATUS_RANK[sb];
  if(isFav(a) !== isFav(b)) return isFav(a) ? -1 : 1;
  if(sa === 'window')  return (a.lastDeath + a.max*60000) - (b.lastDeath + b.max*60000);
  if(sa === 'overdue') return b.lastDeath - a.lastDeath;
  if(sa === 'waiting') return getNextSpawn(a) - getNextSpawn(b);
  return 0;
}

const STATUS_LABEL = { unknown:'Unknown', waiting:'Waiting', window:'Floating', overdue:'Overdue' };

function getSpawnText(m){
  if(!m.lastDeath) return '';
  const now = Date.now();
  const minSpawn = m.lastDeath + m.min*60000;
  const maxSpawn = m.lastDeath + m.max*60000;
  if(now < minSpawn)
    return `floating in <span class="red">${fmtClock(minSpawn-now)}</span> – <span class="green">${fmtClock(maxSpawn-now)}</span>`;
  if(now <= maxSpawn)
    return `spawning in <span class="green">${fmtClock(maxSpawn-now)}</span>`;
  return `<span class="red">overdue ${fmtClock(now-maxSpawn)}</span>`;
}
function getStatusHTML(m){
  const s = getStatus(m);
  return `<span class="badge b-${s}">${STATUS_LABEL[s]}</span><span class="spawn-text">${getSpawnText(m)}</span>`;
}
const isUrgent = m => getStatus(m) === 'window' && (m.lastDeath + m.max*60000 - Date.now()) < 5*60000;
function setUrgent(el, on){
  if(on && !el.classList.contains('urgent')){
    el.style.animationDelay = `-${Date.now() % 1000}ms`;   // stay in step with the clock
    el.classList.add('urgent');
  } else if(!on && el.classList.contains('urgent')){
    el.classList.remove('urgent');
    el.style.animationDelay = '';
  }
}
function applyStatus(el, m){
  el.classList.remove('s-unknown','s-waiting','s-window','s-overdue');
  el.classList.add('s-' + getStatus(m));
  setUrgent(el, isUrgent(m));
  paintExtras(el, m);
  paintUndo(el, m);
}

}

/* ---- per-row extras: progress bar across the floating window ---- */
function paintExtras(el, m){
  const name = el.querySelector('.mvp-name');
  if(name && name.tabIndex !== 0){ name.tabIndex = 0; name.title = ''; }
  let bar = el.querySelector('.prog');
  if(!bar){
    bar = document.createElement('span');
    bar.className = 'prog';
    bar.innerHTML = '<span class="prog-fill"></span>';
    el.appendChild(bar);
  }
  const floating = getStatus(m) === 'window';
  bar.hidden = !floating;
  if(floating){
    const min = m.lastDeath + m.min*60000, max = m.lastDeath + m.max*60000;
    const pct = max > min ? Math.min(100, Math.max(0, (Date.now() - min) / (max - min) * 100)) : 100;
    bar.firstChild.style.width = pct.toFixed(2) + '%';
    bar.title = `${Math.round(pct)}% of the floating window has passed`;
  }
}

/* ---- "Next up" strip ---- */
const nextUp = document.createElement('div');
nextUp.className = 'nextup';
nextUp.setAttribute('aria-label', 'Next MVPs to float');
document.querySelector('header').after(nextUp);
let nextSig = null;   // null so the empty-state message draws on first load
function renderNextUp(){
  const now = Date.now();
  const list = mvps
    .filter(m=> getStatus(m) === 'waiting' && !isHidden(m))
    .sort((a,b)=> (a.lastDeath + a.min*60000) - (b.lastDeath + b.min*60000))
    .slice(0, 3);
  const sig = list.map(m=>m.id).join('|');
  if(sig !== nextSig){
    nextSig = sig;
    nextUp.innerHTML = '<span class="nu-label">Next up</span>' + (list.length
      ? list.map((m,i)=>`${i ? '<span class="sep">·</span>' : ''}<button class="nu-item" data-id="${escX(m.id)}"><span class="nu-name">${escX(m.name)}</span>${m.type === 'mini' ? '<span class="mini-tag">MINI</span>' : ''}<span class="nu-time"></span></button>`).join('')
      : '<span class="nu-empty">Nothing waiting. Log a kill to start a timer.</span>');
    nextUp.querySelectorAll('.nu-item').forEach(b=>{
      b.onclick = ()=>{
        const m = mvps.find(x=>x.id === b.dataset.id);
        if(!m) return;
        if(searchQ){ const s = document.getElementById('mvpSearch'); s.value = ''; s.oninput(); }
        A.goTo(m);
      };
    });
  }
  nextUp.querySelectorAll('.nu-item').forEach(b=>{
    const m = mvps.find(x=>x.id === b.dataset.id);
    if(m) b.querySelector('.nu-time').textContent = fmtClock(m.lastDeath + m.min*60000 - now);
  });
  if(tipAnchor && !document.body.contains(tipAnchor)) hideTip();
}

/* ================= UNDO A KILL (per MVP) ================= */
// After Killed it / Update, an Undo button shows on that MVP for 30 minutes and puts the previous timer back.
const UNDO_MS = 30 * 60000;
let undoLog = {};
try { undoLog = JSON.parse(localStorage.getItem('falsehood-undo') || '{}') || {}; } catch(e) { undoLog = {}; }
function saveUndo(){ try { localStorage.setItem('falsehood-undo', JSON.stringify(undoLog)); } catch(e) {} }
function recordUndo(m, prev, prevBy){
  undoLog[m.id] = { prev: prev == null ? null : prev, prevBy: prevBy == null ? null : prevBy, setTo: m.lastDeath, at: Date.now() };
  saveUndo();
}
function canUndo(m){
  const u = undoLog[m.id];
  // only while the timer is still the one this person logged (nobody changed it since)
  return !!u && m.lastDeath === u.setTo && Date.now() - u.at < UNDO_MS && A.canKill();
}
function undoKill(m){
  const u = undoLog[m.id];
  if(!u || m.lastDeath !== u.setTo) return;
  m.lastDeath = u.prev;
  m.by = u.prevBy;
  persist(m);
  delete undoLog[m.id]; saveUndo();
  if(typeof prevStatus !== 'undefined') prevStatus[m.id] = getStatus(m);
  render();
  if(typeof showToast === 'function') showToast(`${m.name}: kill undone, previous timer restored.`);
}
function paintUndo(el, m){
  let b = el.querySelector('.btn.undo');
  if(!b){
    b = document.createElement('button');
    b.className = 'btn undo';
    b.textContent = '↶ Undo';
    b.title = 'Undo the kill you just logged and restore the previous timer';
    b.setAttribute('aria-label', 'Undo kill for ' + m.name);
    b.onclick = ()=> undoKill(m);
    const reset = el.querySelector('.reset');
    if(reset) reset.before(b); else el.querySelector('.controls').appendChild(b);
  }
  b.hidden = !canUndo(m);
}


/* ================= STORAGE (guild loot) ================= */
// Falsehood holds the loot and sells it. Of the sale price: 10% stays with Falsehood,
// 90% is split evenly between the members, and each member's share loses 10% trade tax
// when Falsehood trades the zeny to them (300,000 share -> 30,000 tax -> 270,000 received).
const GUILD_CUT = 0.10, TRADE_TAX = 0.10;
let storageItems = [];
let storageLive = false;
let storageFilter = 'storage';            // 'storage' | 'sold'
const canEditStorage = ()=>{ try { return A.canKill(); } catch(e) { return true; } };
const zeny = n => Math.round(n).toLocaleString('en-US');

function loadStorageLocal(){
  try { storageItems = JSON.parse(localStorage.getItem('falsehood-storage') || '[]') || []; } catch(e) { storageItems = []; }
}
function saveStorageLocal(){
  try { localStorage.setItem('falsehood-storage', JSON.stringify(storageItems)); } catch(e) {}
}
function startStorageLive(){
  if(typeof db === 'undefined' || !db) return;
  storageLive = true;
  db.collection('loot').onSnapshot(snap=>{
    storageItems = snap.docs.map(d=> Object.assign({ id: d.id }, JSON.parse(JSON.stringify(d.data() || {}))));
    refreshStorage();
  }, ()=>{});
  startLogLive();
  db.collection('names').onSnapshot(snap=>{
    nickNames = {};
    snap.docs.forEach(d=>{ const n = (d.data() || {}).name; if(typeof n === 'string' && n.trim()) nickNames[d.id] = n.trim().slice(0, 24); });
    if(currentTab === 'storage') renderStorage();
  }, ()=>{});
  db.doc('meta/counter').onSnapshot(snap=>{
    sharedCounter = snap.exists ? (+(snap.data() || {}).last || 0) : 0;
    if(currentTab === 'storage') renderStorage();
  }, ()=>{});
}
let lootWrites = Promise.resolve();
function lootError(e){
  if(typeof handleWriteError === 'function') handleWriteError(e);
}
function saveItem(item, action){
  action = action || 'edited';
  if(action === 'created'){ item.createdBy = meId(); item.addedAt = item.addedAt || Date.now(); }
  else { item.updatedBy = meId(); item.updatedAt = Date.now(); item.lastAction = action; }
  logAction(action, item.item, null, item);
  const i = storageItems.findIndex(x=>x.id === item.id);
  if(i >= 0) storageItems[i] = item; else storageItems.push(item);
  if(storageLive){
    const body = JSON.parse(JSON.stringify(item)); delete body.id;
    lootWrites = lootWrites.then(()=> db.collection('loot').doc(item.id).set(body)).catch(lootError);
  } else saveStorageLocal();
  refreshStorage();
}
function deleteItem(id){
  const gone = storageItems.find(x=>x.id === id);
  if(gone) logAction('deleted', gone.item, gone);
  storageItems = storageItems.filter(x=>x.id !== id);
  if(storageLive) lootWrites = lootWrites.then(()=> db.collection('loot').doc(id).delete()).catch(lootError);
  else saveStorageLocal();
  refreshStorage();
}



/* ---- item numbers: assigned once when loot is added, never reused ---- */
const fmtNo = n => n ? '#' + String(n).padStart(3, '0') : '';
let counterSeen = 0;                       // highest number this page has seen or handed out
let sharedCounter = 0;                     // shared page: the guild-wide last number (meta/counter)
function localMaxNo(){
  // On the shared page the guild counter is the only source, so one person's browser can't push numbers up
  if(storageLive){
    let m = sharedCounter;
    storageItems.forEach(x=>{ if(x.no > m) m = x.no; });
    return m;
  }
  let m = counterSeen;
  storageItems.forEach(x=>{ if(x.no > m) m = x.no; });
  lootLog.forEach(e=>{ if(e.no > m) m = e.no; if(e.snapshot && e.snapshot.no > m) m = e.snapshot.no; });
  try { const c = +localStorage.getItem('falsehood-storage-counter') || 0; if(c > m) m = c; } catch(e) {}
  return m;
}
async function nextItemNo(){
  let n = localMaxNo() + 1;
  if(storageLive){
    // the shared counter lives in meta/counter; a short lease makes two people adding at once get different numbers
    const ref = db.doc('meta/counter');
    for(let t = 0; t < 12; t++){
      try {
        const r = await ref.acquire({ holder: 'add-' + newId(), ttlMs: 4000 });
        if(r.acquired){
          const snap = await ref.get();
          const last = snap.exists ? (+(snap.data() || {}).last || 0) : 0;
          n = Math.max(last, ...storageItems.map(x=>x.no || 0)) + 1;
          sharedCounter = n;
          await ref.set({ last: n });
          break;
        }
      } catch(e) { break; }
      await new Promise(res=> setTimeout(res, 250 + Math.random() * 300));
    }
  }
  counterSeen = Math.max(counterSeen, n);
  try { localStorage.setItem('falsehood-storage-counter', String(counterSeen)); } catch(e) {}
  return n;
}


/* ---- picture attachments (one per item), stored with the shared data so sharing stays as it is ---- */
const MAX_PIC_CHARS = 240000;                 // keeps each picture well under the 256 KB document limit
const fileCache = new Map();
function compressImage(file){
  return new Promise((resolve, reject)=>{
    if(!file || !/^image\//.test(file.type)) return reject(new Error('Pick a picture file (PNG, JPG, WEBP or GIF).'));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let scale = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'), g = c.getContext('2d');
      for(let round = 0; round < 8; round++){
        c.width = Math.max(1, Math.round(img.naturalWidth * scale));
        c.height = Math.max(1, Math.round(img.naturalHeight * scale));
        g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        for(const q of [0.82, 0.7, 0.58, 0.46]){
          const d = c.toDataURL('image/jpeg', q);
          if(d.length <= MAX_PIC_CHARS) return resolve(d);
        }
        scale *= 0.75;
      }
      reject(new Error('That picture is too big even after shrinking. Try a smaller screenshot.'));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('That file could not be read as a picture.')); };
    img.src = url;
  });
}
async function putFile(id, dataUrl){
  if(storageLive) await db.collection('lootfiles').doc(id).set({ data: dataUrl, at: Date.now(), by: meId() });
  else localStorage.setItem('falsehood-file-' + id, dataUrl);       // throws if this browser's storage is full
  fileCache.set(id, dataUrl);
}
async function getFile(id){
  if(fileCache.has(id)) return fileCache.get(id);
  let d = null;
  try {
    if(storageLive){ const s = await db.doc('lootfiles/' + id).get(); d = s.exists ? (s.data() || {}).data : null; }
    else d = localStorage.getItem('falsehood-file-' + id);
  } catch(e) { d = null; }
  if(typeof d === 'string' && d.startsWith('data:image/')) { fileCache.set(id, d); return d; }
  return null;
}
async function dropFile(id){
  fileCache.delete(id);
  try { if(storageLive) await db.collection('lootfiles').doc(id).delete(); else localStorage.removeItem('falsehood-file-' + id); } catch(e) {}
}
function fileNote(msg){
  if(typeof showToast === 'function') showToast(msg);
  else { const h = storageView.querySelector('#stAddHint'); if(h) h.textContent = msg; }
}
function fileHTML(x, can){
  if(x.hasFile) return `<div class="st-file">
      <button type="button" class="st-thumb-btn" data-act="view" aria-label="View picture of ${escX(x.item)}"><img class="st-thumb" data-fid="${escX(x.id)}" alt="Picture of ${escX(x.item)}"></button>
      <span class="st-file-actions">
        <button type="button" class="btn st-file-btn" data-act="view">View picture</button>
        ${can ? `<button type="button" class="btn st-file-btn" data-act="replace">Replace</button><button type="button" class="btn st-file-btn st-file-rm" data-act="remove">Remove</button>` : ''}
      </span>
    </div>`;
  return can ? `<div class="st-file"><button type="button" class="btn st-file-btn" data-act="attach">📎 Attach picture</button></div>` : '';
}
function pickFile(){
  return new Promise(res=>{
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = ()=> res(inp.files && inp.files[0] || null);
    inp.click();
  });
}
async function attachTo(x){
  const file = await pickFile();
  if(!file) return;
  try {
    const d = await compressImage(file);
    await putFile(x.id, d);
    saveItem(Object.assign({}, x, { hasFile: true }), 'attached');
  } catch(e) { fileNote((e && e.message && !e.code) ? e.message : 'The picture could not be saved. Try a smaller one.'); }
}
async function viewFile(x){
  const d = await getFile(x.id);
  openModal(x.item, d ? `<img class="st-full" src="${d}" alt="Picture of ${escX(x.item)}">` : 'This picture is no longer available.', null);
  document.querySelector('.modal').classList.add('pic');
  confirmBtn.textContent = 'Close';
  document.getElementById('modalCancel').hidden = true;
}
function wireFiles(list){
  list.querySelectorAll('.st-card').forEach(card=>{
    const x = storageItems.find(i=>i.id === card.dataset.id);
    if(!x) return;
    card.querySelectorAll('[data-act]').forEach(b=>{
      b.onclick = ()=>{
        const act = b.dataset.act;
        if(act === 'view') viewFile(x);
        else if(act === 'attach' || act === 'replace') attachTo(x);
        else if(act === 'remove') openModal('Remove picture', `Remove the picture from <b>${escX(x.item)}</b> for everyone?`, ()=>{
          dropFile(x.id);
          saveItem(Object.assign({}, x, { hasFile: false }), 'unattached');
        });
      };
    });
  });
  list.querySelectorAll('img.st-thumb[data-fid]').forEach(async img=>{
    const d = await getFile(img.dataset.fid);
    if(d) img.src = d; else img.closest('.st-thumb-btn').classList.add('missing');
  });
}

/* ---- who did what (storage audit trail) ---- */
let lootLog = [];
const ACTION_TEXT = { created:'added', edited:'edited', sold:'sold', unsold:'undid the sale of', paid:'updated payments for', deleted:'deleted', restored:'restored', attached:'attached a picture to', unattached:'removed the picture from' };
const meId = ()=>{ try { return (typeof myId !== 'undefined' && myId) ? myId : null; } catch(e) { return null; } };
function loadLogLocal(){
  try { lootLog = JSON.parse(localStorage.getItem('falsehood-storage-log') || '[]') || []; } catch(e) { lootLog = []; }
}
function logAction(action, itemName, snapshot, current){
  const entry = { action, item: itemName, by: meId(), at: Date.now() };
  const src = snapshot || current;
  if(src && src.no) entry.no = src.no;
  if(snapshot) entry.snapshot = JSON.parse(JSON.stringify(snapshot));   // a deleted item's full copy, so it can be restored
  if(storageLive){
    lootWrites = lootWrites.then(()=> db.collection('lootlog').doc(newId()).set(entry)).catch(lootError);
    lootLog = [entry].concat(lootLog).slice(0, 30);
  } else {
    lootLog = [entry].concat(lootLog).slice(0, 100);
    try { localStorage.setItem('falsehood-storage-log', JSON.stringify(lootLog)); } catch(e) {}
  }
}
function startLogLive(){
  db.collection('lootlog').orderBy('at', 'desc').limit(30).onSnapshot(snap=>{
    lootLog = snap.docs.map(d=> JSON.parse(JSON.stringify(d.data() || {})));
    if(currentTab === 'storage') renderActivity();
  }, ()=>{});
}
// Who: a name span the page fills in from the person's Claude display name
const whoHTML = uid => uid ? `<span class="who" data-uid="${escX(uid)}">a member</span>`
  : `<span class="who">${storageLive ? 'someone' : 'you'}</span>`;   // shared page: entries saved before names were recorded
let nickNames = {};                        // shared page: in-game names people set for themselves (names/<their id>)
async function fillWho(){
  const spans = [...storageView.querySelectorAll('.who[data-uid]')];
  if(!spans.length) return;
  const me = meId();
  spans.forEach(s=>{ if(s.dataset.uid === me) s.textContent = 'you'; else if(nickNames[s.dataset.uid]) s.textContent = nickNames[s.dataset.uid]; });
  const rest = spans.filter(s=> s.dataset.uid !== me && !nickNames[s.dataset.uid]);
  if(!rest.length || typeof userApi === 'undefined' || !userApi) return;
  let ps = {};
  try { ps = await userApi.profiles([...new Set(rest.map(s=>s.dataset.uid))]); } catch(e) { return; }
  rest.forEach(s=>{ const p = ps[s.dataset.uid]; s.textContent = (p && p.name) || 'a member'; });
}
function paintMyName(){
  const box = storageView.querySelector('#stMe');
  if(!box) return;
  const me = meId();
  box.hidden = !(storageLive && me);
  if(box.hidden) return;
  const mine = nickNames[me];
  box.innerHTML = `Guildmates see you as <b>${mine ? escX(mine) : 'a guildmate (no name set)'}</b> <button class="btn st-me-btn" type="button">${mine ? 'Change' : 'Set in-game name'}</button>`;
  box.querySelector('.st-me-btn').onclick = ()=>{
    openModal('Your in-game name', `
      <label class="mm-label" for="stMeName">Name guildmates see in Storage history</label>
      <input id="stMeName" class="st-modal-input" maxlength="24" placeholder="e.g. Scrumzilla" value="${escX(mine || '')}">`,
      ()=>{
        const v = document.getElementById('stMeName').value.trim().slice(0, 24);
        const ref = db.collection('names').doc(me);
        (v ? ref.set({ name: v }) : ref.delete()).catch(lootError);
        if(v) nickNames[me] = v; else delete nickNames[me];
        renderStorage();
      });
    confirmBtn.textContent = 'Save';
    const inp = document.getElementById('stMeName');
    inp.onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); confirmBtn.click(); } };
    inp.focus(); inp.select();
  };
}
function auditHTML(x){
  const made = `Added by ${whoHTML(x.createdBy)} · ${fmtDay(x.addedAt)}`;
  const last = x.updatedAt ? ` <span class="sep">·</span> ${escX((ACTION_TEXT[x.lastAction] || 'updated').replace(/^./, c=>c.toUpperCase()))} by ${whoHTML(x.updatedBy)} · ${fmtDay(x.updatedAt)}` : '';
  return `<div class="st-audit">${made}${last}</div>`;
}

// A deleted item can be restored while it isn't already back in storage
const canRestore = e => !!(e && e.action === 'deleted' && e.snapshot && e.snapshot.id && canEditStorage()
  && !storageItems.some(x=>x.id === e.snapshot.id));
function renderActivity(){
  const box = storageView.querySelector('#stActivity');
  if(!box) return;
  box.innerHTML = `<div class="st-act-title">Recent activity</div>` + (lootLog.length
    ? `<ul class="st-act-list">${lootLog.slice(0, 15).map((e,i)=>`<li>${whoHTML(e.by)} ${ACTION_TEXT[e.action] || 'changed'} <b>${e.no ? fmtNo(e.no) + ' ' : ''}${escX(e.item || 'an item')}</b> <span class="st-act-time">${fmtDay(e.at)}</span>${canRestore(e) ? ` <button class="btn st-restore" data-i="${i}">↶ Restore</button>` : ''}</li>`).join('')}</ul>`
    : `<div class="st-act-empty">No changes yet. Adding, editing, selling or deleting loot shows up here.</div>`);
  box.querySelectorAll('.st-restore').forEach(b=>{
    b.onclick = ()=>{
      const e = lootLog[+b.dataset.i];
      if(!canRestore(e)) return;
      openModal('Restore item', `Bring <b>${escX(e.item)}</b> back to ${e.snapshot.status === 'sold' ? 'Sold' : 'storage'} for everyone? Its members, price and paid checkmarks come back as they were.`,
        ()=>{ if(canRestore(e)) saveItem(JSON.parse(JSON.stringify(e.snapshot)), 'restored'); });
    };
  });
  fillWho();
}

/* "1.5m", "500k", "1,200,000" -> number */
function parseZeny(t){
  const s = String(t || '').trim().toLowerCase().replace(/[,\s]/g, '').replace(/z(eny)?$/, '');
  const m = s.match(/^(\d+(?:\.\d+)?)([kmb])?$/);
  if(!m) return null;
  const n = parseFloat(m[1]) * ({ k:1e3, m:1e6, b:1e9 }[m[2]] || 1);
  return Number.isFinite(n) && n > 0 ? Math.round(n) : null;
}
function splitSale(price, members){
  const n = members.length;
  const pool = Math.floor(price * (1 - GUILD_CUT));
  const share = n ? Math.floor(pool / n) : 0;
  const leftover = pool - share * n;              // rounding leftovers stay with Falsehood
  const tax = Math.round(share * TRADE_TAX);
  return {
    guild: price - pool + leftover,
    pool, share, tax,
    receives: share - tax,
    taxLost: tax * n,
  };
}
function parseMembers(t){
  const seen = new Set();
  return String(t || '').split(/[,\n]/).map(s=>s.trim()).filter(s=>{
    const k = s.toLowerCase();
    if(!s || seen.has(k)) return false;
    seen.add(k); return true;
  });
}
const knownMembers = ()=> [...new Set(storageItems.flatMap(x=>x.members || []))].sort((a,b)=>a.localeCompare(b));
const fmtDay = ts => ts ? new Date(ts).toLocaleDateString([], { month:'short', day:'numeric' }) + ', ' + new Date(ts).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }) : '';
const newId = ()=> 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---- view ---- */
const storageView = document.createElement('section');
storageView.className = 'storage';
storageView.hidden = true;
storageView.setAttribute('aria-label', 'Guild storage');
storageView.innerHTML = `
  <div class="st-me" id="stMe" hidden></div>
  <div class="st-summary" id="stSummary"></div>
  <form class="st-add" id="stAdd" autocomplete="off">
    <div class="st-add-title">Add loot to storage</div>
    <div class="st-fields">

/* ---- member picker: tick names from the guild list, or add a new one ---- */
function hiddenRoster(){
  try { return new Set((JSON.parse(localStorage.getItem('falsehood-roster-hidden') || '[]') || []).map(n=>n.toLowerCase())); } catch(e) { return new Set(); }
}
function setHidden(n, hide){
  try {
    let h = JSON.parse(localStorage.getItem('falsehood-roster-hidden') || '[]') || [];
    h = h.filter(x=>x.toLowerCase() !== n.toLowerCase());
    if(hide) h.push(n);
    localStorage.setItem('falsehood-roster-hidden', JSON.stringify(h));
    if(hide){
      const extra = (JSON.parse(localStorage.getItem('falsehood-roster') || '[]') || []).filter(x=>x.toLowerCase() !== n.toLowerCase());
      localStorage.setItem('falsehood-roster', JSON.stringify(extra));
    }
  } catch(e) {}
}
function rosterNames(){
  let extra = [];
  try { extra = JSON.parse(localStorage.getItem('falsehood-roster') || '[]') || []; } catch(e) {}
  const hidden = hiddenRoster();
  const all = new Map();
  [...knownMembers(), ...extra].forEach(n=>{ const k = n.toLowerCase(); if(!all.has(k) && !hidden.has(k)) all.set(k, n); });
  return [...all.values()].sort((a,b)=>a.localeCompare(b));
}
function rememberName(n){
  try {
    const extra = JSON.parse(localStorage.getItem('falsehood-roster') || '[]') || [];
    if(!extra.some(x=>x.toLowerCase() === n.toLowerCase())){ extra.push(n); localStorage.setItem('falsehood-roster', JSON.stringify(extra)); }
  } catch(e) {}
}
function makeMemberPicker(host, initial, onChange){
  const picked = new Map();                              // lower-case key -> display name
  (initial || []).forEach(n=> picked.set(n.toLowerCase(), n));
  const draw = ()=>{
    const names = new Map(rosterNames().map(n=>[n.toLowerCase(), n]));
    picked.forEach((n,k)=>{ if(!names.has(k)) names.set(k, n); });
    const list = [...names.values()].sort((a,b)=>a.localeCompare(b));
    host.innerHTML = `
      <div class="mp-list" role="group" aria-label="Members">${list.length
        ? list.map(n=>`<span class="mp-item${picked.has(n.toLowerCase()) ? ' on' : ''}"><label><input type="checkbox" value="${escX(n)}" ${picked.has(n.toLowerCase()) ? 'checked' : ''}><span>${escX(n)}</span></label><button type="button" class="mp-x" data-name="${escX(n)}" title="Remove ${escX(n)} from the list" aria-label="Remove ${escX(n)} from the list">✕</button></span>`).join('')
        : '<span class="mp-empty">No members yet. Add the first name below.</span>'}</div>
      <div class="mp-add">
        <input type="text" class="mp-input" maxlength="24" placeholder="Add a member who joined, e.g. Scrumzilla">
        <button type="button" class="btn mp-add-btn">+ Add</button>
      </div>
      <div class="mp-tools">${list.length ? `<button type="button" class="mp-link" data-all="1">Select all</button><button type="button" class="mp-link" data-all="0">Clear</button>` : ''}<span class="mp-count">${picked.size} selected</span></div>`;
    host.querySelectorAll('.mp-item input').forEach(cb=>{
      cb.onchange = ()=>{
        const k = cb.value.toLowerCase();
        if(cb.checked) picked.set(k, cb.value); else picked.delete(k);
        cb.closest('.mp-item').classList.toggle('on', cb.checked);
        host.querySelector('.mp-count').textContent = picked.size + ' selected';
        onChange && onChange();
      };
    });
    host.querySelectorAll('.mp-x').forEach(b=>{
      b.onclick = ()=>{
        const n = b.dataset.name;
        picked.delete(n.toLowerCase());
        setHidden(n, true);
        draw(); onChange && onChange();
      };
    });
    host.querySelectorAll('.mp-link').forEach(b=>{
      b.onclick = ()=>{
        if(b.dataset.all === '1') list.forEach(n=> picked.set(n.toLowerCase(), n)); else picked.clear();
        draw(); onChange && onChange();
      };
    });
    const inp = host.querySelector('.mp-input');
    const add = ()=>{
      parseMembers(inp.value).forEach(n=>{ const v = n.slice(0, 24); picked.set(v.toLowerCase(), v); setHidden(v, false); rememberName(v); });
      inp.value = '';
      draw(); onChange && onChange();
      host.querySelector('.mp-input').focus();
    };
    host.querySelector('.mp-add-btn').onclick = add;
    inp.onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); add(); } };
  };
  draw();
  return {
    get: ()=> [...picked.values()],
    clear: ()=>{ picked.clear(); draw(); },
    refresh: ()=>{ if(!host.contains(document.activeElement)) draw(); },
  };
}

(function wireStorageForm(){
  const f = storageView.querySelector('#stAdd');
  const item = f.querySelector('#stItem'),
        note = f.querySelector('#stNote'),
        btn = f.querySelector('#stAddBtn'), hint = f.querySelector('#stAddHint');
  f.querySelector('#stMvpList').innerHTML = mvps.map(m=>`<option value="${escX(m.name)}"></option>`).join('');
  let picker = null;
  const check = ()=>{
    const names = picker ? picker.get() : [];
    const ok = item.value.trim() && names.length && canEditStorage();
    btn.disabled = !ok;
    hint.textContent = !canEditStorage() ? 'You can view storage but not change it.'
      : ok ? `${names.length} member${names.length > 1 ? 's' : ''}: ${names.join(', ')}`
      : 'Add the item name and at least one member.';
  };
  picker = makeMemberPicker(f.querySelector('#stMemberPick'), [], check);
  storageView._picker = picker;
  item.addEventListener('input', check);
  let adding = false;
  f.addEventListener('submit', async e=>{
    e.preventDefault();
    const names = picker.get();

    adding = true; btn.disabled = true; btn.textContent = 'Adding…';
    const fileInput = f.querySelector('#stFile');

    const newItemId = newId();
    let hasFile = false;
    if(file){
      try { await putFile(newItemId, await compressImage(file)); hasFile = true; }
      catch(err) { fileNote((err && err.message && !err.code) ? err.message : 'The picture could not be saved; the item was added without it.'); }
    }
    const no = await nextItemNo();
    adding = false; btn.textContent = 'Add to storage';
    saveItem({
      id: newItemId, no, hasFile, item: item.value.trim(), note: note.value.trim(),
      members: names, status: 'storage', addedAt: Date.now(),
      price: null, soldAt: null, paid: {}
    }, 'created');
    item.value = ''; note.value = ''; picker.clear(); fileInput.value = '';

  storageView.querySelectorAll('.st-seg').forEach(b=>{
    b.onclick = ()=>{ storageFilter = b.dataset.f; renderStorage(); };

})();

/* ================= RENDER ================= */
let rendered = [];
let showHidden = false;

function requestRender(){
  const list = document.getElementById('mvpList');
  const ae = document.activeElement;
  const typing = list.contains(ae) && (ae.tagName === 'INPUT' || ae.isContentEditable);
  if(typing || !modalOverlay.hidden){ pendingRender = true; return; }
  render();
}

function logKill(m, minutesAgo){
  const prev = m.lastDeath, prevBy = m.by;
  m.lastDeath = Date.now() - minutesAgo*60000;
  m.by = myId;
  recordUndo(m, prev, prevBy);
  prefs.input[m.id] = 0; savePrefs();
  prevStatus[m.id] = getStatus(m);
  persist(m);
  render();
}
function clearKill(m){
  m.lastDeath = null;
  m.by = myId;
  prefs.input[m.id] = 0; savePrefs();
  prevStatus[m.id] = 'unknown';
  persist(m);
}

function render(){
  pendingRender = false;
  const list = document.getElementById('mvpList');
  list.innerHTML = '';
  const locked = !canWrite || mode === 'connecting';
  document.getElementById('resetAllBtn').disabled = locked;

  rendered = visibleList().sort(compareMvps);

  rendered.forEach(m=>{
    const el = document.createElement('div');
    el.className = 'item' + (isFav(m) ? ' fav' : '');
    el.innerHTML = `
      <div class="line1">
        <button class="star" title="${isFav(m) ? 'Remove from favorites' : 'Add to favorites'}" aria-label="Favorite ${esc(m.name)}">${isFav(m) ? '★' : '☆'}</button>
        <span class="mvp-name">${esc(m.name)}</span>${searchQ && m.type === 'mini' ? '<span class="mini-tag">MINI</span>' : ''}
        <span class="status">${getStatusHTML(m)}</span>
      </div>
      <div class="line2">
        <span class="loc" spellcheck="false"></span>
        <span class="sep">·</span>
        <span>${m.min}~${m.max}m</span>
        ${m.lastDeath ? `<span class="sep">·</span><span>died ${formatTime(m.lastDeath)}</span>` : ''}
      </div>
      <div class="controls">
        <button class="btn btn-primary kill" title="Log a kill at the current time" ${locked ? 'disabled' : ''}>Killed it</button>
        <button class="btn update" title="Log a kill that happened earlier" ${locked ? 'disabled' : ''}>Update</button>
        <button class="btn btn-icon reset" title="Reset timer" aria-label="Reset ${esc(m.name)}" ${locked ? 'disabled' : ''}>↺</button>
        <button class="btn btn-icon hide" title="Hide this MVP" aria-label="Hide ${esc(m.name)}">✕</button>
      </div>
    `;
    applyStatus(el, m);

    el.querySelector('.star').onclick = ()=>{
      if(prefs.fav[m.id]) delete prefs.fav[m.id]; else prefs.fav[m.id] = true;
      savePrefs(); render();
    };
    el.querySelector('.hide').onclick = ()=>{
      prefs.hidden[m.id] = true; savePrefs(); render();
    };

    const loc = el.querySelector('.loc');
    loc.textContent = m.location || '';
    if(!locked){
      loc.contentEditable = 'true';
      loc.title = 'Click to edit location';
      loc.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); loc.blur(); } };
      loc.onblur = ()=>{
        const v = loc.textContent.trim() || m.defaultLocation;
        if(v !== m.location){ m.location = v; persist(m); }
        loc.textContent = m.location;
        if(pendingRender) setTimeout(requestRender, 0);
      };
    }

    el.querySelector('.kill').onclick = ()=> logKill(m, 0);
    el.querySelector('.update').onclick = ()=> openMinutesModal(m, mins=> logKill(m, mins));

    el.querySelector('.reset').onclick = ()=>{
      openModal('Confirm Reset', `Reset the timer for <b>${esc(m.name)}</b> for everyone?`,
        ()=>{ clearKill(m); render(); });
    };

    list.appendChild(el);
  });

  if(!rendered.length && searchQ){
    const q = document.getElementById('mvpSearch').value.trim();
    const e = document.createElement('div');
    e.className = 'search-empty';
    e.textContent = `No MVP or MINI MVP matches “${q}”.`;
    list.appendChild(e);
  }
  renderHidden();
  renderTabs();
  renderNextUp();
  applyStorageView();
  renderSummary();
  fillNames();
}
